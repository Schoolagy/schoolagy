  <script>
    // ------------------------------------------------------------------
    // Sample data — same six teachers/course colors as grades.html's
    // COURSES array, duplicated locally per this project's established
    // cross-page convention (see architecture-decisions.md's
    // shared-stylesheet note). Two conversations start unread to
    // demonstrate that state; the rest are already read.
    // ------------------------------------------------------------------
    // Teachers a user can message, keyed by id — this is the source both
    // the New Message people-list and every conversation's identity
    // (avatar/name/course) read from. Separated from CONVERSATIONS below
    // per Martin's 2026-09-01 question about supporting multiple separate
    // message THREADS with the same person (a real Schoology behavior) —
    // a person and a thread are no longer the same thing: TEACHERS is the
    // person directory, CONVERSATIONS is a list of threads that each
    // reference one person by id via `personId`, so the same person can
    // have any number of threads (see the two Mr. Cho threads below).
    const TEACHERS = {
      cho: { name: 'Mr. Cho', course: 'English 10', color: '#6b8f5e' },
      alvarez: { name: 'Mr. Alvarez', course: 'AP Chemistry', color: '#a67a22' },
      whitfield: { name: 'Ms. Whitfield', course: 'Algebra II', color: '#5b6ea3' },
      bennett: { name: 'Mrs. Bennett', course: 'U.S. History', color: '#a15c4f' },
      ortiz: { name: 'Sra. Ortiz', course: 'Spanish III', color: '#8a6ba1' },
      reyes: { name: 'Coach Reyes', course: 'PE', color: '#4f8c8a' },
    };

    // Full district directory — duplicated from contacts.html's own
    // CONTACTS array (same ids/names/colors for the 6 people also in
    // TEACHERS above), per this project's established cross-page
    // sample-data convention. Added 2026-09-04 (per Martin) so the New
    // Message "To" dropdown can offer every person from Contacts, not
    // just current teachers -- previously only reachable one at a time
    // via a deep link from contacts.html itself (see
    // handleComposeDeepLink further down). Every entry not already a key
    // in TEACHERS gets folded in right below (using `dept` as that
    // person's `course` field, same fallback handleComposeDeepLink
    // already used) so person()/avatarBg()/the To dropdown all keep
    // reading from the one TEACHERS lookup regardless of where a
    // recipient came from.
    const CONTACTS = [
      { id: 'cho', name: 'Mr. Cho', role: 'Teacher', dept: 'English Department', color: '#6b8f5e' },
      { id: 'alvarez', name: 'Mr. Alvarez', role: 'Teacher', dept: 'Science Department', color: '#a67a22' },
      { id: 'whitfield', name: 'Ms. Whitfield', role: 'Teacher', dept: 'Math Department', color: '#5b6ea3' },
      { id: 'bennett', name: 'Mrs. Bennett', role: 'Teacher', dept: 'Social Studies Department', color: '#a15c4f' },
      { id: 'ortiz', name: 'Sra. Ortiz', role: 'Teacher', dept: 'World Languages Department', color: '#8a6ba1' },
      { id: 'reyes', name: 'Coach Reyes', role: 'Teacher', dept: 'Physical Education Department', color: '#4f8c8a' },
      { id: 'patterson', name: 'Ms. Patterson', role: 'Teacher', dept: 'Science Department', color: '#7a8f4f' },
      { id: 'delgado', name: 'Mr. Delgado', role: 'Teacher', dept: 'Math Department', color: '#5b7ea3' },
      { id: 'nakamura-t', name: 'Mrs. Nakamura', role: '', dept: 'English Department', color: '#8f6b7a' },
      { id: 'simmons', name: 'Dr. Simmons', role: 'Principal', dept: 'Administration', color: '#946b3e' },
      { id: 'osei', name: 'Mrs. Osei', role: 'Assistant Principal', dept: 'Administration', color: '#6b8f8f' },
      { id: 'foster', name: 'Ms. Foster', role: 'School Counselor', dept: 'Counseling', color: '#6b7a9c' },
      { id: 'okafor', name: 'Mr. Okafor', role: '', dept: 'Counseling', color: '#9c6b8a' },
      { id: 'lindqvist', name: 'Mrs. Lindqvist', role: 'Librarian', dept: 'Media Center', color: '#7a7050' },
      { id: 'ramirez', name: 'Nurse Ramirez', role: 'School Nurse', dept: 'Health Office', color: '#a15c5c' },
      { id: 'yusuf', name: 'Mr. Yusuf', role: '', dept: 'Athletics', color: '#4f7a5c' },
      { id: 'whitmore', name: 'Dr. Whitmore', role: 'Superintendent', dept: 'District Office', color: '#5c5c8a' },
      { id: 'alvarado', name: 'Ms. Alvarado', role: 'IT Help Desk', dept: 'District Office', color: '#4f7d8f' },
      { id: 'chen', name: 'Mr. Chen', role: 'Director of Special Education', dept: 'District Office', color: '#8f6b4f' },
    ];
    CONTACTS.forEach(c => {
      if (!TEACHERS[c.id]) TEACHERS[c.id] = { name: c.name, course: c.dept, color: c.color };
    });

    // Each thread has a `subject` (shown in the thread list/header so two
    // threads with the same person read as distinct, the same way email
    // subjects do) and, new this round, `docs`/`links`/`video`/`audio`
    // arrays alongside `messages` — sample "shared in this thread" content
    // for the new categorized search panel below (see searchCategories).
    // Docs/links/video/audio (2026-09-02): each thread's docs/links/video/
    // audio arrays used to be hand-authored separately from its messages,
    // which let them drift out of sync with what the messages actually
    // say — e.g. a "Docs" entry for a file nobody ever sent in the chat,
    // just a teacher mentioning an assignment that lives in Course
    // Materials. Per Martin: "Docs" should mean something someone
    // actually UPLOADED in the conversation, not an assignment merely
    // mentioned in passing. So these arrays are no longer hand-authored
    // here at all — they're derived from an `attachment` field on the
    // specific message that shares that item (see deriveMedia() right
    // after this array), and that message renders the attachment inline
    // in the thread view too (see renderBubbleAttachment), so what
    // search surfaces always matches something visibly shared in that
    // chat. A message that just references an assignment living
    // elsewhere (Alvarez's "nice work on the titration lab", Bennett's
    // "posted in Course Materials") stays plain text with no attachment
    // — those aren't chat uploads and don't belong in Docs.
    const CONVERSATIONS = [
      { id: 'cho-essay', personId: 'cho', subject: 'Essay Extension', unread: true, messages: [
        { from: 'me', text: "Could I get an extension on the rhetorical analysis essay? I was out sick Tuesday — here's my draft so far.", time: 'Yesterday · 4:12 PM', attachment: { kind: 'doc', name: 'Rhetorical_Analysis_Draft.docx' } },
        { from: 'them', text: 'Of course — Friday work for you?', time: 'Yesterday · 4:30 PM' },
        { from: 'me', text: 'That works, thank you so much!', time: 'Yesterday · 4:31 PM' },
      ] },
      // Second thread with the SAME teacher (Mr. Cho), on an unrelated
      // topic — demonstrates that a person can have more than one active
      // conversation at once, per Martin's question about this.
      { id: 'cho-bookclub', personId: 'cho', subject: 'After-School Book Club', unread: false, messages: [
        { from: 'them', text: "Quick heads up — Book Club meets in room 214 today instead of the library. Here's the sign-up sheet if you haven't added your name yet:", time: 'Mon, Aug 24 · 8:10 AM', attachment: { kind: 'link', title: 'Book Club sign-up sheet', url: 'forms.gle/bookclub24' } },
        { from: 'me', text: 'Got it, see you there!', time: 'Mon, Aug 24 · 8:12 AM' },
      ] },
      { id: 'alvarez-unit2', personId: 'alvarez', subject: 'Unit 2 Test Corrections', unread: true, messages: [
        { from: 'them', text: "Hi! Just a reminder the Unit 2 test corrections are due Friday. Here's the simulation again if you want extra practice:", time: 'Mon, Aug 24 · 9:02 AM', attachment: { kind: 'link', title: 'PhET Titration Simulation', url: 'phet.colorado.edu/titration' } },
        { from: 'me', text: 'Got it, thank you!', time: 'Mon, Aug 24 · 9:15 AM' },
        { from: 'them', text: 'Also — nice work on the titration lab, one of the best write-ups this term.', time: 'Yesterday · 3:40 PM' },
      ] },
      { id: 'whitfield-quiz6', personId: 'whitfield', subject: 'Quiz 6 Reschedule', unread: false, messages: [
        { from: 'them', text: "Quiz 6 has been pushed to next Tuesday to give everyone more review time. Here are some practice graphs to use while you wait:", time: 'Yesterday · 11:20 AM', attachment: { kind: 'link', title: 'Desmos — Quiz 6 practice graphs', url: 'desmos.com/calculator/quiz6' } },
      ] },
      { id: 'bennett-dbq', personId: 'bennett', subject: 'DBQ Essay Rubric', unread: false, messages: [
        { from: 'them', text: 'The DBQ essay rubric is posted in Course Materials if you want to look it over before you revise.', time: 'Tue, Aug 25 · 1:10 PM' },
      ] },
      { id: 'ortiz-vocab', personId: 'ortiz', subject: 'Vocabulario Exam', unread: false, messages: [
        { from: 'them', text: '¡Buen trabajo en el examen de vocabulario! Keep it up. Aquí tienes un audio de práctica:', time: 'Mon, Aug 24 · 2:05 PM', attachment: { kind: 'audio', name: 'Pronunciación — Unidad 3', duration: '0:48' } },
        { from: 'me', text: '¡Gracias, Sra. Ortiz!', time: 'Mon, Aug 24 · 2:40 PM' },
      ] },
      { id: 'reyes-fitness', personId: 'reyes', subject: 'Fitness Test Reminder', unread: false, messages: [
        { from: 'them', text: 'Don’t forget — bring sneakers for the fitness test Thursday. Here’s a quick warm-up to run through beforehand:', time: 'Fri, Aug 21 · 10:00 AM', attachment: { kind: 'video', name: 'Warm-up routine demo', duration: '1:12' } },
      ] },
    ];

    // A message carries its attachment(s) as either the older singular
    // `attachment` field (every hand-authored CONVERSATIONS message
    // above) or, since 2026-09-04 (per Martin: composer now supports
    // picking more than one file at once), a plural `attachments` array
    // (every message sent through the composer — see sendComposerMessage
    // further down). This normalizes either shape to an array so
    // everything downstream (deriveMedia, renderBubbles) only has to
    // handle one case.
    function attachmentsOf(m) {
      if (Array.isArray(m.attachments)) return m.attachments;
      if (m.attachment) return [m.attachment];
      return [];
    }

    // Builds each thread's docs/links/video/audio arrays from its
    // messages' attachment(s) (see attachmentsOf() above and the comment
    // above CONVERSATIONS) — single source of truth, so search can never
    // surface something that isn't also visible as an attachment in the
    // thread itself.
    function deriveMedia(c) {
      const docs = [], links = [], video = [], audio = [];
      c.messages.forEach(m => {
        attachmentsOf(m).forEach(a => {
          if (a.kind === 'doc') docs.push({ name: a.name, time: m.time });
          else if (a.kind === 'link') links.push({ title: a.title, url: a.url, time: m.time });
          else if (a.kind === 'video') video.push({ name: a.name, duration: a.duration, time: m.time });
          else if (a.kind === 'audio') audio.push({ name: a.name, duration: a.duration, time: m.time });
        });
      });
      return { docs, links, video, audio };
    }
    CONVERSATIONS.forEach(c => Object.assign(c, deriveMedia(c)));

    function person(c) { return TEACHERS[c.personId]; }

    function avatarInitial(name) {
      const parts = name.trim().split(' ');
      return parts[parts.length - 1][0].toUpperCase();
    }
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    // ------------------------------------------------------------------
    // Live-updating relative timestamps (2026-09-04, per Martin: "update
    // timestamps every min, also on page reload"). Only messages actually
    // sent through the composer this session carry a real `sentAt` (epoch
    // ms, set in sendComposerMessage) — every hand-authored CONVERSATIONS
    // message above has a fixed historical-looking string instead (e.g.
    // "Yesterday · 4:12 PM") and is left alone, since those are supposed
    // to read as fixed points in the past, not drift. For a message that
    // does have `sentAt`, relativeTime() computes the label fresh, and
    // any span rendered via timeSpanHtml() carries a `data-sent-at`
    // attribute so tickRelativeTimes() (below, run once immediately and
    // then every 60s) can refresh just that span's text in place —
    // deliberately NOT a full re-render of the thread/bubbles, so a tick
    // never resets scroll position or disrupts anything else on screen.
    // ------------------------------------------------------------------
    function relativeTime(ms) {
      const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
      if (diffSec < 60) return 'Just now';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin} min${diffMin === 1 ? '' : 's'} ago`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `${diffHr} hour${diffHr === 1 ? '' : 's'} ago`;
      const diffDay = Math.floor(diffHr / 24);
      return `${diffDay} day${diffDay === 1 ? '' : 's'} ago`;
    }
    function timeSpanHtml(label, sentAt, cls) {
      return `<span class="${cls}"${sentAt ? ` data-sent-at="${sentAt}"` : ''}>${label}</span>`;
    }
    function tickRelativeTimes() {
      document.querySelectorAll('[data-sent-at]').forEach(el => {
        el.textContent = relativeTime(Number(el.dataset.sentAt));
      });
    }
    setInterval(tickRelativeTimes, 60000);
    // Teacher "profile photo" (2026-09-01 follow-up: Martin asked for this
    // to come from the API/app auth rather than a stock image service). In
    // the real app this is GET /v1/users/{id}/photo — an endpoint gated
    // behind the signed-in session, same as every other Messages call this
    // mock documents (see the CSS comment above .msgs-shell). A static,
    // backend-less HTML file has no session to authenticate with, so it
    // can't literally call that endpoint; the earlier version of this page
    // used a public placeholder-photo service (pravatar.cc) as a stand-in,
    // but that's an unauthenticated third-party API, not "the app's auth,"
    // so it's gone. Instead every teacher gets a generated color-gradient
    // "photo card" with their initial — this is the same fallback avatar
    // real apps (Google, Outlook, Slack) show before a real photo has
    // synced, so it's an honest placeholder rather than a fake photo, and
    // it needs no network call at all (works instantly, even offline).
    function shadeColor(hex, percent) {
      const num = parseInt(hex.slice(1), 16);
      const clamp = v => Math.max(0, Math.min(255, v));
      const r = clamp((num >> 16) + Math.round(255 * percent));
      const g = clamp(((num >> 8) & 0xff) + Math.round(255 * percent));
      const b = clamp((num & 0xff) + Math.round(255 * percent));
      return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
    }
    // Takes a person/teacher object ({name, color, ...}), not a thread.
    function avatarBg(p) {
      return `linear-gradient(135deg, ${p.color}, ${shadeColor(p.color, -0.26)})`;
    }

    let activeConvoId = null;
    // Set while a New Message draft is in progress -- see
    // startComposeMode()/startNewThreadWith()/resumeComposeMode() below.
    // { personId, subject }, with personId null until chosen in the To
    // dropdown. Nothing is added to CONVERSATIONS until the first message
    // is actually sent, so re-opening New Message never creates empty
    // duplicate threads.
    let pendingThread = null;
    let currentFilter = 'all'; // 'all' | 'unread' | 'combined'
    let searchQuery = '';

    function convoTextMatches(c, q) {
      return c.messages.some(m => m.text.toLowerCase().includes(q));
    }

    function filteredConversations() {
      const list = CONVERSATIONS.filter(c => {
        if (currentFilter === 'unread' && !c.unread) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const p = person(c);
          const nameMatch = p.name.toLowerCase().includes(q) || p.course.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q);
          if (!nameMatch && !convoTextMatches(c, q)) return false;
        }
        return true;
      });
      // Pinned conversations float to the top (2026-09-04, per Martin,
      // right-click a row > Pin). Array.prototype.sort is stable
      // (ES2019+), so conversations keep their existing relative order
      // within each of the two groups -- this never reshuffles anything
      // beyond promoting pinned rows.
      return list.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }

    // "Combined" filter (2026-09-05, per Martin: picking this option from
    // the filter dropdown next to search should automatically merge every
    // person's separate subject threads into a single row, rather than
    // listing each subject as its own row). One row per person instead of
    // one row per thread -- reuses the exact same merged "All subjects"
    // timeline already built for the per-person subject dropdown
    // (showAllSubjectsFor/renderMergedBubbles), just reached from the
    // thread list directly instead of via that dropdown.
    //
    // "Most recent" thread per person: this app's sample data has no
    // reliable global timestamp to sort by (older messages only have a
    // display string like "Yesterday · 4:12 PM", not a real Date) -- so,
    // matching how filteredConversations() above already treats
    // CONVERSATIONS' existing array order as newest-first (new threads are
    // unshift()'d onto the front in sendComposerMessage()), this just
    // takes each person's FIRST-encountered thread in that same order as
    // their "most recent" for the row's time/preview text.
    function combinedRows() {
      const byPerson = new Map();
      for (const c of CONVERSATIONS) {
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const p = person(c);
          const nameMatch = p.name.toLowerCase().includes(q) || p.course.toLowerCase().includes(q) || c.subject.toLowerCase().includes(q);
          if (!nameMatch && !convoTextMatches(c, q)) continue;
        }
        if (!byPerson.has(c.personId)) byPerson.set(c.personId, []);
        byPerson.get(c.personId).push(c);
      }
      const rows = [...byPerson.entries()].map(([personId, threads]) => ({
        personId,
        threads,
        primary: threads[0],
        unread: threads.some(t => t.unread),
        pinned: threads.some(t => t.pinned),
      }));
      // Same pinned-floats-to-top rule as filteredConversations() -- if
      // any of a person's threads is pinned, their combined row is too.
      return rows.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }

    function combinedRowHtml(row) {
      const p = person(row.primary);
      const last = row.primary.messages[row.primary.messages.length - 1];
      const lastTimeLabel = last.sentAt ? relativeTime(last.sentAt) : last.time.split(' · ')[0];
      const isMulti = row.threads.length > 1;
      // A person with only one thread shows their real subject, same as a
      // normal row -- only an actual merge gets the "N conversations"
      // summary line, since no single subject applies once there's more
      // than one.
      const subjectLine = isMulti ? `${row.threads.length} conversations` : row.primary.subject;
      const isActive = row.threads.some(t => t.id === activeConvoId) || viewingAllSubjectsFor === row.personId;
      return `
        <div class="msgs-thread-row ${row.unread ? 'unread' : ''} ${isActive ? 'active' : ''}" data-id="${row.primary.id}" data-person-id="${row.personId}" data-combined="${isMulti ? '1' : '0'}" tabindex="0" role="button" aria-label="Open conversation with ${escapeHtml(p.name)}${row.pinned ? ' (pinned)' : ''}${isMulti ? `, ${row.threads.length} combined conversations` : ''}">
          <span class="msgs-avatar" style="background:${avatarBg(p)}">${avatarInitial(p.name)}</span>
          <div class="msgs-thread-row-text">
            <div class="msgs-thread-row-top">
              <span class="msgs-thread-row-name">${row.pinned ? `<span class="msgs-pin-icon" aria-hidden="true">${ICON_PIN}</span>` : ''}${escapeHtml(p.name)}</span>
              ${timeSpanHtml(lastTimeLabel, last.sentAt, 'msgs-thread-row-time')}
            </div>
            <div class="msgs-thread-row-subject">${escapeHtml(subjectLine)}</div>
            <div class="msgs-thread-row-preview">${last.from === 'me' ? 'You: ' : ''}${escapeHtml(last.text)}</div>
          </div>
          ${row.unread ? '<span class="msgs-unread-dot" aria-hidden="true"></span>' : ''}
        </div>
      `;
    }

    function updateSubtitle() {
      const n = CONVERSATIONS.filter(c => c.unread).length;
      document.getElementById('msgsSubtitle').textContent = n > 0 ? `${n} unread` : 'All caught up';
    }

    const threadList = document.getElementById('threadList');
    // The pinned "New Message" draft row (2026-09-04, per Martin: "the
    // people that are alr there stay there, make a New Message line...
    // name it New Message"). Rendered at the top of the SAME thread list
    // -- existing conversations are never hidden or swapped out for a
    // separate picker anymore -- whenever a compose draft is in
    // progress (pendingThread set, see startComposeMode/
    // startNewThreadWith/resumeComposeMode below). Formatted like a
    // normal thread row (avatar + name line + optional subject line) so
    // it reads as one of the list, just with "New Message" standing in
    // for a person's name and a generic "+" avatar since no recipient
    // may be chosen yet.
    function newMessageRowHtml() {
      if (!pendingThread) return '';
      return `
        <div class="msgs-thread-row active new-message" data-id="__new__" tabindex="0" role="button" aria-label="New Message draft">
          <span class="msgs-avatar msgs-avatar-new" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
          <div class="msgs-thread-row-text">
            <div class="msgs-thread-row-top">
              <span class="msgs-thread-row-name">New Message</span>
            </div>
            ${pendingThread.subject ? `<div class="msgs-thread-row-subject">${escapeHtml(pendingThread.subject)}</div>` : ''}
          </div>
        </div>
      `;
    }
    function renderThreadList() {
      // "Combined" (2026-09-05, per Martin) takes a completely different
      // shape -- one row per person instead of one row per thread -- so it
      // gets its own render path via combinedRows()/combinedRowHtml()
      // rather than being squeezed into the per-thread list below.
      if (currentFilter === 'combined') {
        const rows = combinedRows();
        const body = rows.length ? rows.map(combinedRowHtml).join('') : (pendingThread ? '' : `<p class="msgs-empty-hint">No conversations match.</p>`);
        threadList.innerHTML = newMessageRowHtml() + body;
        updateSubtitle();
        return;
      }
      const list = filteredConversations();
      const body = list.length ? list.map(c => {
        const p = person(c);
        const last = c.messages[c.messages.length - 1];
        const lastTimeLabel = last.sentAt ? relativeTime(last.sentAt) : last.time.split(' · ')[0];
        return `
          <div class="msgs-thread-row ${c.unread ? 'unread' : ''} ${c.id === activeConvoId ? 'active' : ''}" data-id="${c.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(c.subject)} with ${escapeHtml(p.name)}${c.pinned ? ' (pinned)' : ''}">
            <span class="msgs-avatar" style="background:${avatarBg(p)}">${avatarInitial(p.name)}</span>
            <div class="msgs-thread-row-text">
              <div class="msgs-thread-row-top">
                <span class="msgs-thread-row-name">${c.pinned ? `<span class="msgs-pin-icon" aria-hidden="true">${ICON_PIN}</span>` : ''}${escapeHtml(p.name)}</span>
                ${timeSpanHtml(lastTimeLabel, last.sentAt, 'msgs-thread-row-time')}
              </div>
              <div class="msgs-thread-row-subject">${escapeHtml(c.subject)}</div>
              <div class="msgs-thread-row-preview">${last.from === 'me' ? 'You: ' : ''}${escapeHtml(last.text)}</div>
            </div>
            ${c.unread ? '<span class="msgs-unread-dot" aria-hidden="true"></span>' : ''}
          </div>
        `;
      }).join('') : (pendingThread ? '' : `<p class="msgs-empty-hint">No conversations match.</p>`);
      threadList.innerHTML = newMessageRowHtml() + body;
      updateSubtitle();
    }

    const threadEmpty = document.getElementById('threadEmpty');
    const threadActive = document.getElementById('threadActive');
    const threadIdentity = document.getElementById('threadIdentity');
    const threadAvatar = document.getElementById('threadAvatar');
    const threadName = document.getElementById('threadName');
    const threadCourse = document.getElementById('threadCourse');
    const threadSubjectRow = document.getElementById('threadSubjectRow');
    const threadSubjectTrigger = document.getElementById('threadSubjectTrigger');
    const threadSubjectTriggerLabel = document.getElementById('threadSubjectTriggerLabel');
    const threadSubjectMenu = document.getElementById('threadSubjectMenu');
    const composerHint = document.getElementById('composerHint');
    const sendBtn = document.getElementById('sendBtn');
    // Set only while the merged "All subjects" view is open (see
    // showAllSubjectsFor) -- the personId being viewed, so the subject
    // dropdown can tell it apart from a single real thread (activeConvoId).
    let viewingAllSubjectsFor = null;
    const toBar = document.getElementById('toBar');
    const toInput = document.getElementById('toInput');
    const toResults = document.getElementById('toResults');
    const subjectBar = document.getElementById('subjectBar');
    const subjectInput = document.getElementById('subjectInput');
    const threadBubbles = document.getElementById('threadBubbles');
    const composerForm = document.getElementById('composerForm');
    const composerInput = document.getElementById('composerInput');
    const msgsShell = document.getElementById('msgsShell');

    // ------------------------------------------------------------------
    // Attach button (2026-09-02, per Martin) — sits next to Send in the
    // composer. Opens the OS file picker (a native <input type="file">
    // is the standard, reliable way to do this — unlike the native
    // color picker swapped out elsewhere in the app, there's no
    // cross-browser inconsistency to work around here); picked files are
    // held in `pendingAttachments` and previewed above the composer
    // until the message is actually sent (or a tile's × is clicked), at
    // which point they're attached to that message the same way a
    // message with real shared files works everywhere else (see
    // `attachments`/`attachment` on CONVERSATIONS messages,
    // attachmentsOf(), and renderBubbleAttachment) — so an attachment
    // sent this way shows up in the thread and in search's Docs category
    // exactly like the pre-authored ones do. Only each file's name is
    // used (this is a front-end mock with nowhere to actually upload a
    // file to); size/type aren't read.
    // 2026-09-04 (per Martin, with a Claude-attachment-UI screenshot as
    // reference): the file input now accepts multiple files at once
    // (`multiple` attribute), and `pendingAttachments` is an array
    // instead of a single object — each entry renders as its own small
    // square tile with its own remove button (see the CSS above), rather
    // than one attachment replacing the last. Real document preview
    // (thumbnails) is intentionally not implemented per Martin ("will
    // come out in later version") — each tile is just filename + a small
    // extension badge.
    // ------------------------------------------------------------------
    const attachBtn = document.getElementById('attachBtn');
    const attachFileInput = document.getElementById('attachFileInput');
    const pendingAttachmentBar = document.getElementById('pendingAttachmentBar');
    let pendingAttachments = [];

    function renderPendingAttachments() {
      if (!pendingAttachments.length) {
        pendingAttachmentBar.hidden = true;
        pendingAttachmentBar.innerHTML = '';
        return;
      }
      pendingAttachmentBar.innerHTML = pendingAttachments.map((att, i) => {
        const ext = fileExt(att.name);
        return `
          <div class="msgs-pending-attachment-tile">
            <span class="msgs-pending-attachment-tile-name">${escapeHtml(att.name)}</span>
            <span class="msgs-pending-attachment-tile-ext">${ext}</span>
            <button type="button" class="msgs-pending-attachment-tile-remove" aria-label="Remove ${escapeHtml(att.name)}" data-index="${i}">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        `;
      }).join('');
      pendingAttachmentBar.hidden = false;
    }
    // Delegated (not per-tile) since tiles are rebuilt on every add/remove.
    pendingAttachmentBar.addEventListener('click', e => {
      const btn = e.target.closest('.msgs-pending-attachment-tile-remove');
      if (!btn) return;
      pendingAttachments.splice(Number(btn.dataset.index), 1);
      renderPendingAttachments();
    });
    attachBtn.addEventListener('click', () => attachFileInput.click());
    attachFileInput.addEventListener('change', () => {
      const files = Array.from(attachFileInput.files);
      attachFileInput.value = ''; // so picking the same file(s) again still fires "change"
      if (!files.length) return;
      files.forEach(file => pendingAttachments.push({ kind: 'doc', name: file.name }));
      renderPendingAttachments();
    });

    // Renders the small attachment chip under a message that carries one
    // (see attachmentsOf() above and the `attachment`/`attachments`
    // fields on CONVERSATIONS messages) — reuses the same file/media
    // chip look the search panel uses (fileExt/fileExtColor/ICON_* are
    // defined further down but already initialized by the time any
    // message actually renders). A message with several attachments
    // (2026-09-04) renders one of these chips per attachment, stacked.
    // standaloneLabel/standaloneSentAt: passed only for the LAST
    // attachment of a message that has no text bubble (attachment(s)
    // sent with an empty message box, via the composer's attach button)
    // — the timestamp that would normally sit inside the bubble is shown
    // as its own small caption under that last chip instead, so it isn't
    // lost, and isn't repeated under every chip when there are several.
    function renderBubbleAttachment(a, standaloneLabel, standaloneSentAt) {
      if (!a) return '';
      let chip;
      if (a.kind === 'doc') {
        const ext = fileExt(a.name);
        chip = `<span class="msgs-file-chip" style="background:${fileExtColor(ext)}" aria-hidden="true">${ext}</span><span class="msgs-bubble-attachment-text"><span class="msgs-bubble-attachment-name">${escapeHtml(a.name)}</span></span>`;
      } else if (a.kind === 'link') {
        chip = `<span class="msgs-media-chip" aria-hidden="true">${ICON_LINK}</span><span class="msgs-bubble-attachment-text"><span class="msgs-bubble-attachment-name msgs-bubble-attachment-name-link">${escapeHtml(a.title)}</span></span>`;
      } else if (a.kind === 'video' || a.kind === 'audio') {
        chip = `<span class="msgs-media-chip" aria-hidden="true">${a.kind === 'video' ? ICON_VIDEO : ICON_AUDIO}</span><span class="msgs-bubble-attachment-text"><span class="msgs-bubble-attachment-name">${escapeHtml(a.name)}</span><span class="msgs-bubble-attachment-meta">${a.duration}</span></span>`;
      } else {
        return '';
      }
      const timeHtml = standaloneLabel ? timeSpanHtml(standaloneLabel, standaloneSentAt, 'msgs-bubble-attachment-time') : '';
      return `<div class="msgs-bubble-attachment">${chip}</div>${timeHtml}`;
    }

    // One message's markup -- shared by the normal single-thread view
    // (renderBubbles) and the merged "All subjects" timeline
    // (renderMergedBubbles below), so both stay in sync automatically.
    function renderBubbleRowHtml(m, i) {
      const atts = attachmentsOf(m);
      const timeLabel = m.sentAt ? relativeTime(m.sentAt) : m.time;
      const bubbleHtml = m.text ? `<div class="msgs-bubble">${escapeHtml(m.text)}${timeSpanHtml(timeLabel, m.sentAt, 'msgs-bubble-time')}</div>` : '';
      const attsHtml = atts.map((a, ai) => {
        const isLast = ai === atts.length - 1;
        return renderBubbleAttachment(a, (!m.text && isLast) ? timeLabel : '', (!m.text && isLast) ? m.sentAt : undefined);
      }).join('');
      return `
        <div class="msgs-bubble-row ${m.from}" data-msg-index="${i}">
          ${bubbleHtml}
          ${attsHtml}
        </div>
      `;
    }

    function renderBubbles(c) {
      threadBubbles.innerHTML = c.messages.map((m, i) => renderBubbleRowHtml(m, i)).join('');
      threadBubbles.scrollTop = threadBubbles.scrollHeight;
    }

    // Merged "All subjects" timeline (2026-09-04, per Martin: the top
    // option in the subject dropdown) -- every thread with one person,
    // concatenated in CONVERSATIONS order, each group of messages headed
    // by a small pill naming its subject (see .msgs-subject-divider) so
    // it still reads clearly which conversation each message came from
    // even though they're shown together. Read-only: see
    // setComposerEnabled, called by showAllSubjectsFor right after this.
    function renderMergedBubbles(threads) {
      threadBubbles.innerHTML = threads.map(c => `
        <div class="msgs-subject-divider"><span>${escapeHtml(c.subject)}</span></div>
        ${c.messages.map((m, i) => renderBubbleRowHtml(m, i)).join('')}
      `).join('');
      threadBubbles.scrollTop = threadBubbles.scrollHeight;
    }

    // Shows a REAL (already-existing-or-just-created) conversation --
    // restores the normal avatar/name header, in case a compose draft's
    // To bar/Subject bar were showing instead (see startComposeMode/
    // startNewThreadWith/resumeComposeMode below).
    function showThread(c) {
      const p = person(c);
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      toBar.hidden = true;
      subjectBar.hidden = true;
      threadIdentity.hidden = false;
      threadAvatar.textContent = avatarInitial(p.name);
      threadAvatar.style.background = avatarBg(p);
      threadName.textContent = p.name;
      threadCourse.textContent = p.course;
      viewingAllSubjectsFor = null;
      renderSubjectDropdown(c.personId, c.id);
      setComposerEnabled(true);
      renderBubbles(c);
    }

    // ------------------------------------------------------------------
    // Subject dropdown + "All subjects" merged view (2026-09-04, per
    // Martin: "under the persons name... a down arrow on the subject...
    // when clicked... every subject you messaged under and at the top an
    // all subjects option"). Lives entirely alongside showThread/
    // openConversation above -- threadsForPerson/renderSubjectDropdown
    // run every time a real thread opens, and showAllSubjectsFor is the
    // merged view's own entry point, parallel to showThread.
    // ------------------------------------------------------------------
    function threadsForPerson(personId) {
      return CONVERSATIONS.filter(c => c.personId === personId);
    }

    // activeThreadId: the currently-open thread's id, or null when the
    // merged "All subjects" view is what's open.
    function renderSubjectDropdown(personId, activeThreadId) {
      const threads = threadsForPerson(personId);
      threadSubjectTriggerLabel.textContent = activeThreadId === null
        ? 'All subjects'
        : (threads.find(t => t.id === activeThreadId) || {}).subject || '';
      threadSubjectMenu.innerHTML = `
        <button type="button" class="msgs-thread-subject-menu-item all-subjects ${activeThreadId === null ? 'active' : ''}" role="menuitem" data-thread-id="__all__">All subjects</button>
        ${threads.map(t => `<button type="button" class="msgs-thread-subject-menu-item ${t.id === activeThreadId ? 'active' : ''}" role="menuitem" data-thread-id="${t.id}">${escapeHtml(t.subject)}</button>`).join('')}
      `;
      threadSubjectMenu.dataset.personId = personId;
      threadSubjectRow.hidden = false;
    }

    function closeSubjectMenu() {
      threadSubjectMenu.hidden = true;
      threadSubjectTrigger.setAttribute('aria-expanded', 'false');
    }

    // Disables the composer while the merged "All subjects" view is open
    // -- there's no single thread to append a reply to (sendComposerMessage
    // already no-ops with activeConvoId left null, this just makes that
    // visible instead of the composer silently doing nothing).
    function setComposerEnabled(enabled) {
      composerInput.disabled = !enabled;
      attachBtn.disabled = !enabled;
      sendBtn.disabled = !enabled;
      composerHint.hidden = enabled;
    }

    function showAllSubjectsFor(personId) {
      const p = TEACHERS[personId];
      const threads = threadsForPerson(personId);
      if (!p || !threads.length) return;
      pendingThread = null;
      activeConvoId = null;
      viewingAllSubjectsFor = personId;
      threads.forEach(t => { if (t.unread) t.unread = false; });
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      toBar.hidden = true;
      subjectBar.hidden = true;
      threadIdentity.hidden = false;
      threadAvatar.textContent = avatarInitial(p.name);
      threadAvatar.style.background = avatarBg(p);
      threadName.textContent = p.name;
      threadCourse.textContent = p.course;
      renderSubjectDropdown(personId, null);
      renderMergedBubbles(threads);
      setComposerEnabled(false);
      renderThreadList();
      msgsShell.classList.add('thread-open');
    }

    threadSubjectTrigger.addEventListener('click', () => {
      const opening = threadSubjectMenu.hidden;
      if (opening) {
        threadSubjectMenu.hidden = false;
        threadSubjectTrigger.setAttribute('aria-expanded', 'true');
      } else {
        closeSubjectMenu();
      }
    });
    threadSubjectMenu.addEventListener('click', e => {
      const item = e.target.closest('.msgs-thread-subject-menu-item');
      if (!item) return;
      closeSubjectMenu();
      const threadId = item.dataset.threadId;
      if (threadId === '__all__') showAllSubjectsFor(threadSubjectMenu.dataset.personId);
      else openConversation(threadId);
    });
    document.addEventListener('click', e => {
      if (!threadSubjectMenu.hidden && !e.target.closest('.msgs-thread-subject-row')) closeSubjectMenu();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !threadSubjectMenu.hidden) { closeSubjectMenu(); threadSubjectTrigger.focus(); }
    });

    function openConversation(id) {
      const c = CONVERSATIONS.find(x => x.id === id);
      if (!c) return;
      pendingThread = null;
      activeConvoId = id;
      if (c.unread) c.unread = false;
      showThread(c);
      renderThreadList();
      msgsShell.classList.add('thread-open');
      composerInput.value = '';
    }

    // ------------------------------------------------------------------
    // New Message redesign (2026-09-04, per Martin) — replaces the old
    // single startNewThread(personId), which required a person to
    // already be chosen (from a separate people-picker panel) before the
    // thread panel would even open. Three entry points now:
    //
    //  - startComposeMode(): the "+" button. No recipient yet -- opens
    //    with the To dropdown empty, for the user to pick from (see
    //    populateToSelect()).
    //  - startNewThreadWith(personId): a specific person already known
    //    up front (currently only the Contacts deep-link -- see
    //    handleComposeDeepLink further down). Skips the To dropdown
    //    entirely and shows their identity normally, since asking the
    //    user to re-pick someone they just clicked "Message" on would be
    //    redundant. Still shows the required Subject field.
    //  - resumeComposeMode(): re-opens the thread panel on an
    //    already-in-progress draft (pendingThread already set) without
    //    resetting anything -- used when the pinned "New Message" row
    //    (see newMessageRowHtml()) is clicked again, e.g. after using the
    //    mobile back button.
    //
    // None of these add anything to CONVERSATIONS -- that only happens
    // once the composer is actually submitted (see sendComposerMessage()).
    // ------------------------------------------------------------------
    // Search-as-you-type replacement for the old "every person in the
    // district in one dropdown" picker (2026-09-05, per Martin: a real
    // district's directory can run into the hundreds of people, so
    // dumping the whole thing into one list doesn't scale and risks
    // overflowing the page). Matches anywhere in the name, case-
    // insensitive, and is capped to MAX_TO_RESULTS so the results box has
    // a fixed, predictable size no matter how many people match or how
    // big the district is.
    const MAX_TO_RESULTS = 6;

    function directoryMatches(query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      return Object.entries(TEACHERS)
        .filter(([, p]) => p.name.toLowerCase().includes(q))
        .sort((a, b) => a[1].name.localeCompare(b[1].name))
        .slice(0, MAX_TO_RESULTS);
    }

    let toHighlightIndex = -1;

    function closeToResults() {
      toResults.hidden = true;
      toResults.innerHTML = '';
      toHighlightIndex = -1;
      toInput.setAttribute('aria-expanded', 'false');
    }

    function renderToResults(query) {
      if (!query.trim()) { closeToResults(); return; }
      const matches = directoryMatches(query);
      toHighlightIndex = matches.length ? 0 : -1;
      toResults.innerHTML = matches.length
        ? matches.map(([id, p], i) => `
            <button type="button" class="msgs-to-result-item${i === 0 ? ' highlighted' : ''}" role="option" data-id="${id}">
              <span class="msgs-to-result-name">${escapeHtml(p.name)}</span>
              ${p.course ? `<span class="msgs-to-result-course">${escapeHtml(p.course)}</span>` : ''}
            </button>
          `).join('')
        : `<p class="msgs-to-no-results">No one in the district matches "${escapeHtml(query.trim())}".</p>`;
      toResults.hidden = false;
      toInput.setAttribute('aria-expanded', 'true');
    }

    function selectToPerson(id) {
      const p = TEACHERS[id];
      if (!p || !pendingThread) return;
      pendingThread.personId = id;
      toInput.value = p.name;
      closeToResults();
      threadBubbles.innerHTML = draftBubblesPlaceholder();
    }

    function draftBubblesPlaceholder() {
      const p = pendingThread && pendingThread.personId ? TEACHERS[pendingThread.personId] : null;
      return p
        ? `<p class="msgs-empty-hint">Start a new conversation with ${escapeHtml(p.name)}.</p>`
        : `<p class="msgs-empty-hint">Choose who to message, then start typing below.</p>`;
    }

    function startComposeMode() {
      activeConvoId = null;
      viewingAllSubjectsFor = null;
      pendingThread = { personId: null, subject: '' };
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      threadIdentity.hidden = true;
      threadSubjectRow.hidden = true; // no existing subject to pick from yet -- see #subjectBar below instead
      closeSubjectMenu();
      setComposerEnabled(true);
      toBar.hidden = false;
      subjectBar.hidden = false;
      toInput.value = '';
      closeToResults();
      subjectInput.value = '';
      threadBubbles.innerHTML = draftBubblesPlaceholder();
      renderThreadList();
      msgsShell.classList.add('thread-open');
      composerInput.value = '';
      toInput.focus();
    }

    function startNewThreadWith(personId) {
      const p = TEACHERS[personId];
      if (!p) return;
      activeConvoId = null;
      viewingAllSubjectsFor = null;
      pendingThread = { personId, subject: '' };
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      toBar.hidden = true;
      subjectBar.hidden = false;
      subjectInput.value = '';
      threadIdentity.hidden = false;
      threadSubjectRow.hidden = true; // no existing subject to pick from yet -- see #subjectBar below instead
      closeSubjectMenu();
      setComposerEnabled(true);
      threadAvatar.textContent = avatarInitial(p.name);
      threadAvatar.style.background = avatarBg(p);
      threadName.textContent = p.name;
      threadCourse.textContent = `${p.course} · New message`;
      threadBubbles.innerHTML = draftBubblesPlaceholder();
      renderThreadList();
      msgsShell.classList.add('thread-open');
      composerInput.value = '';
      composerInput.focus();
    }

    function resumeComposeMode() {
      if (!pendingThread) return;
      activeConvoId = null;
      viewingAllSubjectsFor = null;
      threadEmpty.hidden = true;
      threadActive.hidden = false;
      threadIdentity.hidden = true;
      threadSubjectRow.hidden = true;
      closeSubjectMenu();
      setComposerEnabled(true);
      toBar.hidden = false;
      subjectBar.hidden = false;
      toInput.value = pendingThread.personId ? TEACHERS[pendingThread.personId].name : '';
      closeToResults();
      subjectInput.value = pendingThread.subject || '';
      threadBubbles.innerHTML = draftBubblesPlaceholder();
      renderThreadList();
      msgsShell.classList.add('thread-open');
    }
    toInput.addEventListener('input', () => {
      if (!pendingThread) return;
      // Typing invalidates whatever was previously selected -- you can't
      // stay "sending to" someone whose name you've since edited away.
      pendingThread.personId = null;
      renderToResults(toInput.value);
    });
    toInput.addEventListener('focus', () => {
      if (toInput.value.trim() && !pendingThread?.personId) renderToResults(toInput.value);
    });
    toInput.addEventListener('keydown', e => {
      if (toResults.hidden) return;
      const items = Array.from(toResults.querySelectorAll('.msgs-to-result-item'));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (!items.length) return;
        toHighlightIndex = (toHighlightIndex + 1) % items.length;
        items.forEach((el, i) => el.classList.toggle('highlighted', i === toHighlightIndex));
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!items.length) return;
        toHighlightIndex = (toHighlightIndex - 1 + items.length) % items.length;
        items.forEach((el, i) => el.classList.toggle('highlighted', i === toHighlightIndex));
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const target = items[toHighlightIndex] || items[0];
        if (target) selectToPerson(target.dataset.id);
      } else if (e.key === 'Escape') {
        closeToResults();
      }
    });
    toResults.addEventListener('click', e => {
      const item = e.target.closest('.msgs-to-result-item');
      if (!item) return;
      selectToPerson(item.dataset.id);
    });
    document.addEventListener('click', e => {
      if (!toResults.hidden && !e.target.closest('#toSearchWrap')) closeToResults();
    });
    subjectInput.addEventListener('input', () => {
      if (pendingThread) pendingThread.subject = subjectInput.value;
    });

    // Scrolls to and briefly highlights a specific message within a
    // conversation — used by the search panel so picking a message match
    // jumps straight to it instead of just opening the thread at the
    // bottom.
    function jumpToMessage(id, msgIndex) {
      openConversation(id);
      requestAnimationFrame(() => {
        const row = threadBubbles.querySelector(`[data-msg-index="${msgIndex}"]`);
        if (!row) return;
        row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        row.classList.add('flash');
        setTimeout(() => row.classList.remove('flash'), 1500);
      });
    }

    // A "Combined" row (data-combined="1") represents more than one
    // subject thread with the same person -- opening it means the merged
    // "All subjects" timeline (showAllSubjectsFor), same as picking "All
    // subjects" from that person's own subject dropdown. A combined row
    // for someone with only one thread (data-combined="0", i.e. Combined
    // mode simply hasn't changed anything for them) still just opens
    // normally, same as clicking any other row -- routing that case
    // through showAllSubjectsFor would needlessly disable the composer
    // for a person who only has one conversation anyway.
    function openThreadRow(row) {
      if (row.dataset.id === '__new__') { resumeComposeMode(); return; } // the pinned New Message draft row
      if (row.dataset.combined === '1') { showAllSubjectsFor(row.dataset.personId); return; }
      openConversation(row.dataset.id);
    }
    threadList.addEventListener('click', e => {
      const row = e.target.closest('.msgs-thread-row');
      if (!row) return;
      openThreadRow(row);
    });
    threadList.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('.msgs-thread-row');
      if (!row) return;
      e.preventDefault();
      openThreadRow(row);
    });

    document.getElementById('threadBackBtn').addEventListener('click', () => {
      msgsShell.classList.remove('thread-open');
    });

    // ------------------------------------------------------------------
    // Pin / Delete context menu (2026-09-04, per Martin: right-click a
    // conversation in the left-side list -- not the pinned "New Message"
    // draft row -- add Pin/Unpin and Delete). Follows the same
    // open/close + outside-click + Escape pattern as #filterMenu and
    // #profileMenu further down, except this one is position:fixed and
    // anchored to the click coordinates (it can be triggered from any
    // row anywhere in the scrollable list, not a fixed wrapper).
    // ------------------------------------------------------------------
    const rowContextMenu = document.getElementById('rowContextMenu');
    const rowContextPinBtn = document.getElementById('rowContextPinBtn');
    const rowContextPinLabel = document.getElementById('rowContextPinLabel');
    const rowContextDeleteBtn = document.getElementById('rowContextDeleteBtn');
    let contextMenuConvoId = null;

    function closeRowContextMenu() {
      rowContextMenu.hidden = true;
      contextMenuConvoId = null;
    }

    function openRowContextMenu(convoId, x, y) {
      const c = CONVERSATIONS.find(v => v.id === convoId);
      if (!c) return;
      contextMenuConvoId = convoId;
      rowContextPinLabel.textContent = c.pinned ? 'Unpin' : 'Pin';
      rowContextMenu.hidden = false;
      // Clamp inside the viewport -- measure only after un-hiding so
      // offsetWidth/Height reflect the real rendered size.
      const menuW = rowContextMenu.offsetWidth;
      const menuH = rowContextMenu.offsetHeight;
      const maxX = window.innerWidth - menuW - 8;
      const maxY = window.innerHeight - menuH - 8;
      rowContextMenu.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
      rowContextMenu.style.top = `${Math.max(8, Math.min(y, maxY))}px`;
    }

    threadList.addEventListener('contextmenu', e => {
      const row = e.target.closest('.msgs-thread-row');
      if (!row || row.dataset.id === '__new__') return; // never on the draft row
      // Skip a genuinely-merged Combined row (more than one subject with
      // this person) -- Pin/Delete would be ambiguous about which of
      // their several threads it applies to. A Combined row for someone
      // with only one thread is unaffected (data-combined="0") and still
      // gets the normal menu.
      if (row.dataset.combined === '1') return;
      e.preventDefault();
      openRowContextMenu(row.dataset.id, e.clientX, e.clientY);
    });

    rowContextPinBtn.addEventListener('click', () => {
      const c = CONVERSATIONS.find(v => v.id === contextMenuConvoId);
      if (c) c.pinned = !c.pinned;
      closeRowContextMenu();
      renderThreadList();
    });

    rowContextDeleteBtn.addEventListener('click', () => {
      const id = contextMenuConvoId;
      closeRowContextMenu();
      if (!id) return;
      const idx = CONVERSATIONS.findIndex(v => v.id === id);
      if (idx === -1) return;
      CONVERSATIONS.splice(idx, 1);
      if (activeConvoId === id) {
        // The deleted conversation was open -- fall back to the empty
        // state rather than leaving a dangling thread panel open.
        activeConvoId = null;
        threadActive.hidden = true;
        threadEmpty.hidden = false;
        msgsShell.classList.remove('thread-open');
      }
      renderThreadList();
    });

    document.addEventListener('click', e => {
      if (!rowContextMenu.hidden && !e.target.closest('#rowContextMenu')) closeRowContextMenu();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !rowContextMenu.hidden) closeRowContextMenu();
    });
    // Closes the menu on scroll rather than letting it float disconnected
    // from the row it was opened on.
    threadList.addEventListener('scroll', () => { if (!rowContextMenu.hidden) closeRowContextMenu(); });

    // ------------------------------------------------------------------
    // Link detection (2026-09-04, per Martin: "when you type a link, make
    // it have the blue color and the underline and when sent turn it
    // into a link attachment"). #composerInput stays a plain <input>
    // (see the sandboxed-form comment above sendComposerMessage below)
    // rather than becoming contenteditable, so this is a light heuristic
    // rather than per-character styling: URL_RE matches ONE bare-ish URL
    // (protocol optional, matching how every existing sample link
    // attachment is already written -- e.g. "phet.colorado.edu/titration",
    // no "https://"), and while typing, the whole input goes blue +
    // underlined the moment its value looks like it contains one (see the
    // 'input' listener right below composerInput's declaration further
    // down). Only the FIRST match in a message is turned into an
    // attachment; a message with more than one URL is a rarer case this
    // mock doesn't handle specially.
    // ------------------------------------------------------------------
    const URL_RE = /\b((?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+(?:\/[^\s]*)?)\b/i;
    function extractLinkAttachment(text) {
      const m = text.match(URL_RE);
      if (!m) return { text, linkAttachment: null };
      const url = m[0];
      const remaining = (text.slice(0, m.index) + text.slice(m.index + url.length)).replace(/\s+/g, ' ').trim();
      return { text: remaining, linkAttachment: { kind: 'link', title: url, url } };
    }
    composerInput.addEventListener('input', () => {
      composerInput.classList.toggle('msgs-composer-link-active', URL_RE.test(composerInput.value));
    });

    // sendComposerMessage() used to be a <form> "submit" handler. Changed
    // 2026-09-04 (per Martin: sending "doesn't work" for him) -- he was
    // viewing the page in a sandboxed preview iframe, and a sandboxed
    // iframe without "allow-forms" blocks real <form> submission at the
    // browser level before any JS runs (confirmed via a Playwright repro:
    // Chrome logs "Blocked form submission... sandboxed and the
    // 'allow-forms' permission is not set" and the submit event never
    // fires at all, so e.preventDefault() never got a chance to matter).
    // The composer markup is a plain <div> now (see the HTML comment
    // above #composerForm), and this same logic runs off a direct
    // function call instead -- from the Send button's click listener and
    // the Enter-key listener on #composerInput just below -- which isn't
    // form submission and isn't subject to that sandbox restriction.
    // sentAt (real epoch ms, 2026-09-04 per Martin) drives the live-
    // updating relative label ("Just now" → "1 min ago" → ...) -- see the
    // relativeTime()/tickRelativeTimes() comment above escapeHtml(). The
    // static `time: 'Just now'` string is still set alongside it as a
    // harmless fallback/label for anything that doesn't know about
    // sentAt, but every render path here prefers sentAt when present.
    function sendComposerMessage() {
      const raw = composerInput.value.trim();
      const { text, linkAttachment } = extractLinkAttachment(raw);
      if (!text && pendingAttachments.length === 0 && !linkAttachment) return; // attachment(s)/link alone are a valid send, same as most messaging apps
      const msg = { from: 'me', text, time: 'Just now', sentAt: Date.now() };
      const attachments = pendingAttachments.slice();
      if (linkAttachment) attachments.push(linkAttachment);
      if (attachments.length) msg.attachments = attachments;
      if (pendingThread) {
        // A brand-new thread requires a recipient -- can't be sent until
        // one's chosen from the To search (see startComposeMode/toInput
        // above). Subject is required by the real Schoology API too
        // (per Martin); this mock doesn't hard-block on a blank one, it
        // just falls back to a generic label, same spirit as every other
        // non-blocking validation choice in this app.
        if (!pendingThread.personId) { toInput.focus(); return; }
        const subject = (pendingThread.subject || '').trim() || 'New conversation';
        const c = {
          id: `${pendingThread.personId}-${Date.now()}`,
          personId: pendingThread.personId,
          subject,
          unread: false,
          messages: [msg],
        };
        Object.assign(c, deriveMedia(c));
        CONVERSATIONS.unshift(c);
        pendingThread = null;
        activeConvoId = c.id;
        composerInput.value = '';
        composerInput.classList.remove('msgs-composer-link-active');
        pendingAttachments = [];
        renderPendingAttachments();
        showThread(c); // restores the normal avatar/name header now that it's a real thread
        renderThreadList();
        return;
      }
      if (!activeConvoId) return;
      const c = CONVERSATIONS.find(x => x.id === activeConvoId);
      c.messages.push(msg);
      Object.assign(c, deriveMedia(c)); // refresh docs/links/etc. so new attachment(s) show up in search right away
      composerInput.value = '';
      composerInput.classList.remove('msgs-composer-link-active');
      pendingAttachments = [];
      renderPendingAttachments();
      renderBubbles(c);
      renderThreadList();
    }
    sendBtn.addEventListener('click', sendComposerMessage);
    composerInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); sendComposerMessage(); }
    });

    // ------------------------------------------------------------------
    // Search — clicking/focusing the search box opens a categorized panel
    // (Messages / Docs / Links / Video / Audio, per Martin's 2026-09-01
    // request) instead of a single flat list. With no query it's a browse
    // view of recent items in each category; typing filters every category
    // at once and highlights the matched text, but the category headers
    // stay put even when a category has zero matches, rather than the
    // layout jumping around. If the query matches a teacher's name, every
    // category scopes down to just that person's thread(s) instead of
    // everyone's — same idea as Spotlight narrowing to one contact.
    // ------------------------------------------------------------------
    const msgsSearchInput = document.getElementById('msgsSearch');
    const searchResults = document.getElementById('searchResults');

    function highlightMatch(text, q) {
      const idx = text.toLowerCase().indexOf(q.toLowerCase());
      if (idx === -1) return escapeHtml(text);
      return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx + q.length)) + '</mark>' + escapeHtml(text.slice(idx + q.length));
    }

    function messageMatches(q) {
      const results = [];
      CONVERSATIONS.forEach(c => {
        c.messages.forEach((m, i) => {
          if (m.text.toLowerCase().includes(q)) results.push({ c, i, m });
        });
      });
      return results;
    }

    function allDocs() { return CONVERSATIONS.flatMap(c => c.docs.map(d => ({ ...d, c }))); }
    function allLinks() { return CONVERSATIONS.flatMap(c => c.links.map(l => ({ ...l, c }))); }
    function allVideo() { return CONVERSATIONS.flatMap(c => c.video.map(v => ({ ...v, c }))); }
    function allAudio() { return CONVERSATIONS.flatMap(c => c.audio.map(a => ({ ...a, c }))); }

    function matchedPersonId(q) {
      if (!q) return null;
      const hit = Object.entries(TEACHERS).find(([, t]) => t.name.toLowerCase().includes(q));
      return hit ? hit[0] : null;
    }

    function searchCategories(qRaw) {
      const q = qRaw.trim().toLowerCase();
      const personId = matchedPersonId(q);
      if (personId) {
        const scope = CONVERSATIONS.filter(c => c.personId === personId);
        return {
          personId, q,
          messages: scope.flatMap(c => c.messages.map((m, i) => ({ c, i, m }))).slice(-6).reverse(),
          docs: scope.flatMap(c => c.docs.map(d => ({ ...d, c }))),
          links: scope.flatMap(c => c.links.map(l => ({ ...l, c }))),
          video: scope.flatMap(c => c.video.map(v => ({ ...v, c }))),
          audio: scope.flatMap(c => c.audio.map(a => ({ ...a, c }))),
        };
      }
      if (!q) {
        return {
          personId: null, q,
          messages: CONVERSATIONS.map(c => ({ c, i: c.messages.length - 1, m: c.messages[c.messages.length - 1] })).slice(0, 6),
          docs: allDocs().slice(0, 4),
          links: allLinks().slice(0, 4),
          video: allVideo().slice(0, 4),
          audio: allAudio().slice(0, 4),
        };
      }
      return {
        personId: null, q,
        messages: messageMatches(q),
        docs: allDocs().filter(d => d.name.toLowerCase().includes(q)),
        links: allLinks().filter(l => l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)),
        video: allVideo().filter(v => v.name.toLowerCase().includes(q)),
        audio: allAudio().filter(a => a.name.toLowerCase().includes(q)),
      };
    }

    function fileExt(name) { return name.split('.').pop().toUpperCase(); }
    function fileExtColor(ext) {
      if (ext === 'PDF') return '#b23b2e';
      if (ext === 'DOCX') return '#2f5fa8';
      if (ext === 'PPTX') return '#c07a1f';
      return 'var(--accent)';
    }
    const ICON_LINK = '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l2-2a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 11a5 5 0 0 0-7.07 0l-2 2a5 5 0 0 0 7.07 7.07l1-1"/></svg>';
    const ICON_VIDEO = '<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20" fill="currentColor" stroke="none"/></svg>';
    const ICON_AUDIO = '<svg viewBox="0 0 24 24"><path d="M9 19V6l11-2v13"/><circle cx="6" cy="19" r="3"/><circle cx="17" cy="17" r="3"/></svg>';
    // Same glyph as #rowContextPinBtn's icon in the markup above -- kept
    // in sync by hand since this one gets stamped into thread-row HTML
    // by renderThreadList() while that one is static.
    const ICON_PIN = '<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';

    function renderMsgItem({ c, i, m }, q) {
      const p = person(c);
      return `
        <button class="msgs-search-result-row" type="button" data-kind="message" data-id="${c.id}" data-index="${i}">
          <span class="msgs-avatar" style="width:32px;height:32px;font-size:0.78rem;background:${avatarBg(p)}">${avatarInitial(p.name)}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${escapeHtml(p.name)}</span>
            <span class="msgs-search-result-snippet">${m.from === 'me' ? 'You: ' : ''}${q ? highlightMatch(m.text, q) : escapeHtml(m.text)}</span>
          </span>
        </button>`;
    }
    function renderDocItem(d, q) {
      const p = person(d.c);
      const ext = fileExt(d.name);
      return `
        <button class="msgs-search-result-row" type="button" data-kind="thread" data-id="${d.c.id}">
          <span class="msgs-file-chip" style="background:${fileExtColor(ext)}" aria-hidden="true">${ext}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${q ? highlightMatch(d.name, q) : escapeHtml(d.name)}</span>
            <span class="msgs-search-result-snippet">${escapeHtml(p.name)} · ${escapeHtml(d.time)}</span>
          </span>
        </button>`;
    }
    function renderLinkItem(l, q) {
      const p = person(l.c);
      const host = l.url.split('/')[0];
      return `
        <button class="msgs-search-result-row" type="button" data-kind="thread" data-id="${l.c.id}">
          <span class="msgs-media-chip" aria-hidden="true">${ICON_LINK}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${q ? highlightMatch(l.title, q) : escapeHtml(l.title)}</span>
            <span class="msgs-search-result-snippet">${escapeHtml(p.name)} · ${escapeHtml(host)}</span>
          </span>
        </button>`;
    }
    function renderMediaItem(item, q, kind) {
      const p = person(item.c);
      return `
        <button class="msgs-search-result-row" type="button" data-kind="thread" data-id="${item.c.id}">
          <span class="msgs-media-chip" aria-hidden="true">${kind === 'video' ? ICON_VIDEO : ICON_AUDIO}</span>
          <span class="msgs-search-result-text">
            <span class="msgs-search-result-name">${q ? highlightMatch(item.name, q) : escapeHtml(item.name)}</span>
            <span class="msgs-search-result-snippet">${escapeHtml(p.name)} · ${escapeHtml(item.duration)}</span>
          </span>
        </button>`;
    }
    function renderCategorySection(title, items, renderItem, q) {
      const body = items.length
        ? items.map(renderItem).join('')
        : `<p class="msgs-search-cat-empty">${q ? 'No matches' : 'Nothing yet'}</p>`;
      return `<div class="msgs-search-cat"><h4 class="msgs-search-cat-title">${title}</h4>${body}</div>`;
    }

    function renderSearchResults() {
      const { personId, q, messages, docs, links, video, audio } = searchCategories(searchQuery);
      const header = personId
        ? `<div class="msgs-search-scope">Showing results for <strong>${escapeHtml(TEACHERS[personId].name)}</strong></div>`
        : '';
      searchResults.innerHTML = header
        + renderCategorySection('Messages', messages, item => renderMsgItem(item, q), q)
        + renderCategorySection('Docs', docs, item => renderDocItem(item, q), q)
        + renderCategorySection('Links', links, item => renderLinkItem(item, q), q)
        + renderCategorySection('Video', video, item => renderMediaItem(item, q, 'video'), q)
        + renderCategorySection('Audio', audio, item => renderMediaItem(item, q, 'audio'), q);
      searchResults.hidden = false;
    }

    // ------------------------------------------------------------------
    // Search mode (2026-09-01 rework): clicking/focusing the search field
    // no longer opens a dropdown floating over the thread list — it
    // swaps the categorized results panel in for the thread list, in the
    // exact same slot (see .msgs-search-results next to #threadList in
    // the HTML and CSS above). The search bar itself "morphs": the input
    // is flex:1 inside .msgs-search-wrap, and the clear (X) button next
    // to it animates its own width from 0 up — so as the X grows in, the
    // input visibly shrinks to make room for it, while .msgs-search-wrap
    // itself (sized by the header's flex row) never changes width. The X
    // doubles as "cancel search": clicking it clears the query and
    // restores the normal thread list, same as Escape or picking a
    // result.
    // ------------------------------------------------------------------
    const searchWrap = document.getElementById('searchWrap');
    const searchClearBtn = document.getElementById('searchClearBtn');
    let searchActive = false;

    function enterSearchMode() {
      if (searchActive) return;
      searchActive = true;
      searchClearBtn.classList.add('show');
      threadList.hidden = true;
      renderSearchResults();
    }
    function exitSearchMode() {
      searchActive = false;
      searchClearBtn.classList.remove('show');
      searchResults.hidden = true;
      threadList.hidden = false;
      searchQuery = '';
      msgsSearchInput.value = '';
    }

    msgsSearchInput.addEventListener('focus', enterSearchMode);
    msgsSearchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      if (!searchActive) enterSearchMode();
      else renderSearchResults();
    });
    searchClearBtn.addEventListener('click', () => {
      exitSearchMode();
      msgsSearchInput.blur();
    });
    document.addEventListener('click', e => {
      if (searchActive && !e.target.closest('#searchWrap') && !e.target.closest('#searchResults')) {
        exitSearchMode();
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && searchActive) { exitSearchMode(); msgsSearchInput.blur(); }
    });
    searchResults.addEventListener('click', e => {
      const row = e.target.closest('.msgs-search-result-row');
      if (!row) return;
      if (row.dataset.kind === 'message') {
        jumpToMessage(row.dataset.id, Number(row.dataset.index));
      } else {
        openConversation(row.dataset.id);
      }
      exitSearchMode();
    });

    const filterBtn = document.getElementById('filterBtn');
    const filterMenu = document.getElementById('filterMenu');
    function openFilterMenu() { filterMenu.hidden = false; filterBtn.setAttribute('aria-expanded', 'true'); }
    function closeFilterMenu() { filterMenu.hidden = true; filterBtn.setAttribute('aria-expanded', 'false'); }
    filterBtn.addEventListener('click', () => { if (filterMenu.hidden) openFilterMenu(); else closeFilterMenu(); });
    document.addEventListener('click', e => { if (!filterMenu.hidden && !e.target.closest('.msgs-filter-wrap')) closeFilterMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !filterMenu.hidden) { closeFilterMenu(); filterBtn.focus(); } });
    document.querySelectorAll('.msgs-filter-item').forEach(item => {
      item.addEventListener('click', () => {
        currentFilter = item.dataset.filter;
        document.querySelectorAll('.msgs-filter-item').forEach(i => i.classList.toggle('active', i === item));
        renderThreadList();
        closeFilterMenu();
      });
    });

    renderThreadList();

    // The "+" button starts a brand-new compose draft (see
    // startComposeMode() above) — existing conversations stay visible in
    // the list underneath it, per Martin's 2026-09-04 redesign (see the
    // block comment above startComposeMode).
    document.getElementById('composeBtn').addEventListener('click', startComposeMode);

    // ------------------------------------------------------------------
    // Deep-link from contacts.html (2026-09-02, per Martin's district
    // directory — every contact gets a working Message button, not just
    // current teachers): a contact card's Message button links here as
    // messages.html?compose=<id>, plus &name=/&dept=/&color= for anyone
    // who isn't already one of this page's own TEACHERS. When <id> is a
    // known teacher those extra params are ignored and the existing
    // TEACHERS entry is used as-is; otherwise a TEACHERS entry is built
    // from the URL params on the fly (same {name, course, color} shape
    // every other entry has), so the rest of the app — avatarBg(),
    // person(), the thread header, etc. — treats a district contact
    // exactly like a current teacher without needing them hand-authored
    // here. Either way this reuses startNewThreadWith(), so arriving via
    // a deep link opens straight into that person's identity (no To
    // dropdown needed — see the comment above startNewThreadWith).
    // ------------------------------------------------------------------
    (function handleComposeDeepLink() {
      const params = new URLSearchParams(window.location.search);
      const composeId = params.get('compose');
      if (!composeId) return;
      if (!TEACHERS[composeId]) {
        const name = params.get('name');
        if (!name) return; // not a known teacher and no fallback info to build one from
        TEACHERS[composeId] = {
          name,
          course: params.get('dept') || '',
          color: params.get('color') || '#83849a',
        };
      }
      startNewThreadWith(composeId);
    })();

    // ------------------------------------------------------------------
    // Nav — Home/Courses/Grades/Assignments are real pages now; Calendar/
    // Settings stay visual-only placeholders, same convention used
    // everywhere else in the app.
    // ------------------------------------------------------------------
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
</body>
</html>
