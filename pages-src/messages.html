<html lang="en">
<head>
<meta charset="UTF-8">

<title>Schoolagy — Messages</title>

<style>
  /* ---------- Shared design system — copied verbatim from grades.html so
     this page reads as the same app, not a reskin. Grade-color tokens
     (--grade-good etc.) aren't needed here and are left out. See
     architecture-decisions.md for the note about promoting this to an
     actual shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    height: 100vh; /* fixed, not min -- body itself no longer scrolls */

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* kept as a fallback; in practice .msgs-shell
      below is height-capped and scrolls its own content internally
      (see .msgs-thread-list / .msgs-bubbles / etc.), so this almost
      never actually engages. Messages-specific (2026-09-04, per
      Martin): unlike the other pages in this app, a chat UI's list
      and conversation panes should behave like a real messaging app
      -- fixed header/search/composer chrome, only the middle scrolls
      -- so this page keeps the windowed pattern the rest of the app
      moved away from. */
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Messages shell (new 2026-09-01) — built from Martin's
     Messages.pdf rough wireframe: a "+" compose button and a filter
     icon above a search bar, a scrollable thread list (each row an
     avatar circle, the top one shown with a timestamp + sender name and
     highlighted when unread), and a right-hand pane with a header block,
     a right-aligned accent-colored sent bubble, and a rounded compose
     pill at the bottom. Kept as a two-pane master/detail layout on
     desktop; collapses to list-then-thread on narrow screens (see the
     mobile media query) since the wireframe didn't specify mobile
     behavior but every other page in this app supports it.
     Per site-map.md/architecture-decisions.md: Messages is an opt-in
     Social feature (off by default in Onboarding) and is meant to be
     backed by the real Schoology Messages API (GET /v1/messages/inbox,
     POST /v1/messages, etc.) — this static mock always shows the page
     rather than checking that toggle (there's no persisted settings
     state across these standalone pages yet), but a real build must
     hide this nav item / block this route when the user hasn't opted
     in. The compose recipient list below is deliberately sourced from
     the same six teachers used elsewhere in the app's sample data
     (grades.html's COURSES) rather than any broader directory — that
     mirrors the real API's GET /v1/messages/recipients, which is
     Schoology's own server-computed "who can I currently message" list
     already filtered by district policy (teacher-only vs. peer-to-peer),
     per the decision logged 2026-08-24. ---------- */
  /* Height-capped to whatever .page has left (flex: 1; min-height: 0)
     instead of growing to match content -- keeps both panels' frames
     (and their rounded corners) fixed on screen, matching login-style
     app chrome. Also fixes a real bug this caused before being capped:
     with the panel stretched taller than a short conversation's natural
     content and nothing set to grow into the leftover space, that space
     collected below .msgs-composer instead of the composer sitting
     flush with the panel's bottom edge. Capping the shell and letting
     .msgs-bubbles flex-grow (below) fixes both at once. max-height kept
     so this doesn't balloon on a very tall monitor. */
  .msgs-shell {
    display: flex;
    gap: 14px;
    align-items: stretch;
    flex: 1;
    min-height: 0;
    max-height: 660px;
  }
  .msgs-list-panel {
    width: 320px;
    flex-shrink: 0;
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .msgs-list-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 14px 10px;
    flex-shrink: 0;
  }
  .msgs-list-head[hidden] { display: none; }
  .msgs-compose-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .msgs-compose-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .msgs-compose-btn:hover { background: var(--accent-dark); }
  .msgs-compose-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Search bar "morph": .msgs-search-wrap's own width is fixed by the
     flex header row around it (flex:1) and never changes. What animates
     is the split INSIDE it — the input is flex:1 so it fills whatever
     space the clear button isn't using, and the clear button animates
     its own width from 0 up to full size. The two transitions together
     read as "the search bar shrinks to make room for an X", but the
     bar's overall footprint in the header is constant throughout. */
  .msgs-search-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  #msgsSearch {
    flex: 1 1 auto;
    min-width: 0;
    width: 100%;
    border: none;
    border-radius: 999px;
    background: var(--panel-inner);
    padding: 8px 14px;
    font: inherit;
    font-size: 0.82rem;
    color: var(--text-dark);
  }
  #msgsSearch::placeholder { color: var(--text-faint); }
  #msgsSearch:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-search-clear {
    flex: 0 0 auto;
    width: 0;
    height: 32px;
    padding: 0;
    border: none;
    background: none;
    color: var(--text-faint);
    cursor: pointer;
    opacity: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 0.22s ease, opacity 0.16s ease;
  }
  .msgs-search-clear.show { width: 30px; opacity: 1; }
  .msgs-search-clear svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.3; stroke-linecap: round; }
  .msgs-search-clear:hover { color: var(--text-dark); }
  .msgs-search-clear:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 50%; }

  /* Search results — replaces #threadList in the SAME slot (same
     flex:1/overflow-y:auto box, see .msgs-thread-list) rather than
     floating a dropdown over it, per Martin's request. Matches on message
     BODY text (not
     just conversation name/course), so a search for e.g. "Unit 2" can
     surface a specific message buried in a thread; picking a row jumps
     straight to that message (see jumpToMessage). */
  .msgs-search-results { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
  .msgs-search-results[hidden] { display: none; }
  /* Categorized results — Messages/Docs/Links/Video/Audio (2026-09-01):
     the section headers always render, even for a category with zero
     items, so the panel's shape stays stable as you type rather than
     sections popping in/out. */
  .msgs-search-scope { margin: 2px 4px 8px; padding: 7px 10px; background: var(--panel-inner); border-radius: var(--window-radius-sm); font-size: 0.78rem; font-weight: 600; color: var(--text-dark); }
  .msgs-search-cat { padding: 2px 0 6px; }
  .msgs-search-cat + .msgs-search-cat { border-top: 1px solid var(--border); }
  .msgs-search-cat-title { margin: 8px 8px 2px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); }
  .msgs-search-cat-empty { margin: 0 8px 4px; font-size: 0.76rem; color: var(--text-faint); font-weight: 600; }
  .msgs-file-chip {
    width: 34px; height: 34px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .msgs-media-chip {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel-inner);
    color: var(--text-muted);
  }
  .msgs-media-chip svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .msgs-search-result-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    padding: 8px;
    cursor: pointer;
    text-align: left;
    font: inherit;
  }
  .msgs-search-result-row:hover { background: var(--panel-inner); }
  .msgs-search-result-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }
  .msgs-search-result-text { min-width: 0; flex: 1; }
  /* display:block on both — as plain (inline-by-default) spans, the
     white-space:nowrap/overflow:hidden/text-overflow:ellipsis below
     didn't actually truncate anything: ellipsis truncation needs a
     block (or inline-block) box, since a bare inline span has no width
     of its own to clip against. Same fix already applied via <div> for
     the thread-list row's name/subject/preview (see .msgs-thread-row-*
     above) — this brings the search results panel in line with that so
     a long message truncates with "…" here too instead of overflowing
     or wrapping. */
  .msgs-search-result-name { display: block; font-weight: 700; font-size: 0.8rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msgs-search-result-snippet { display: block; font-size: 0.74rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msgs-search-result-snippet mark { background: rgba(217,74,43,0.22); color: inherit; border-radius: 3px; padding: 0 1px; }
  .msgs-filter-wrap { position: relative; flex-shrink: 0; }
  .msgs-filter-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
  }
  .msgs-filter-btn:hover { background: var(--panel-inner); }
  .msgs-filter-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-filter-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .msgs-filter-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 120px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .msgs-filter-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;

  /* Right-click context menu on a left-side thread row -- Pin/Unpin +
     Delete (2026-09-04, per Martin). position:fixed and anchored to the
     click coordinates in JS (see openRowContextMenu), not to a wrapper
     element like .profile-menu/.msgs-filter-menu above, since it can
     open from any row anywhere in the scrollable list. */
  .msgs-row-context-menu {
    position: fixed;
    min-width: 150px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);

    z-index: 30;

    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 10px;

  .msgs-row-context-menu-item:hover { background: var(--panel-inner); }
  .msgs-row-context-menu-item.delete { color: #b6432f; }
  /* stroke: currentColor (not a hardcoded color) so the icon always

     styling hit earlier this project (see architecture-decisions.md). */
  .msgs-row-context-menu-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* Scrolls on its own within the fixed-height panel -- .msgs-list-head
     (the + / search / filter row above it) stays put. */
  .msgs-thread-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }
  .msgs-thread-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-radius: var(--window-radius-md);

    margin-bottom: 2px;
  }
  .msgs-thread-row:hover { background: var(--panel-inner); }
  .msgs-thread-row:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }

  .msgs-thread-row.active .msgs-thread-row-subject,

  .msgs-avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    position: relative;
    overflow: hidden;
  }
  .msgs-thread-row-text { min-width: 0; flex: 1; }
  .msgs-thread-row-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .msgs-thread-row-name { font-weight: 700; font-size: 0.86rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Pin icon shown before a pinned conversation's name (2026-09-04, per
     Martin). Lives inside .msgs-thread-row-name so it inherits that
     span's color -- including the "color: #fff" override on .active
     rows above -- automatically via currentColor, same reasoning as the
     context-menu icons. */
  .msgs-pin-icon { display: inline-flex; vertical-align: -2px; margin-right: 3px; }
  .msgs-pin-icon svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .msgs-thread-row-subject { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msgs-thread-row-preview { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .msgs-unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .msgs-thread-row.active .msgs-unread-dot { background: #fff; }
  .msgs-empty-hint { font-size: 0.8rem; color: var(--text-faint); text-align: center; padding: 24px 12px; font-weight: 600; }

  .msgs-thread-panel {
    flex: 1;
    min-width: 0;
    background: #fdfdfe;
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .msgs-thread-empty {
    flex: 1;
    display: flex;
    flex-direction: column;

  .msgs-thread-empty p { margin: 0; max-width: 220px; line-height: 1.4; }
  .msgs-thread-empty .hint { font-size: 0.76rem; font-weight: 600; opacity: 0.8; }

  .msgs-thread-active { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .msgs-thread-empty[hidden], .msgs-thread-active[hidden] { display: none; }
  .msgs-thread-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .msgs-back-btn {
    display: none;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    margin-right: 2px;

  .msgs-back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .msgs-back-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 50%; }

  /* Subject dropdown under the person's name (2026-09-04, per Martin) --

  .msgs-thread-subject-row { position: relative; }

  #threadSubjectTriggerLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs-thread-subject-chevron { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; transition: transform 0.15s ease; }
  .msgs-thread-subject-trigger[aria-expanded="true"] .msgs-thread-subject-chevron { transform: rotate(180deg); }
  .msgs-thread-subject-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 200px;
    max-width: 280px;

  .msgs-thread-subject-menu-item {

    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--text-dark);
    padding: 8px 10px;

    overflow: hidden;

  .msgs-thread-subject-menu-item.all-subjects { border-bottom: 1px solid var(--border); border-radius: var(--window-radius-sm) var(--window-radius-sm) 0 0; margin-bottom: 4px; padding-bottom: 10px; }

  /* Divider pill between each person's threads in the merged "All
     subjects" timeline (see renderMergedBubbles) -- named by subject so

  .msgs-subject-divider span { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; color: var(--text-faint); background: var(--panel-inner); border-radius: 999px; padding: 4px 12px; }

  /* Composer hint shown in place of a working composer while the merged
     All Subjects view is open (see setComposerEnabled). */
  .msgs-composer-hint { padding: 8px 18px 0; margin: 0; font-size: 0.74rem; font-weight: 700; color: var(--text-faint); text-align: center; }
  .msgs-composer-hint[hidden] { display: none; }

  /* ---------- New Message redesign (2026-09-04, per Martin) — replaces
     the old separate "swap the whole list panel to a people picker"
     compose flow. Existing conversations now stay visible in the list at
     all times ("the people that are alr there stay there"); starting a
     new message instead pins a "New Message" row at the top of that same
     list (see the JS render logic) and, on the right, swaps the
     avatar/name header (.msgs-thread-identity above) for this To bar --
     a label plus a native <select> listing every person from the
     Contacts directory (not just current teachers) -- and reveals a
     required Subject field beneath it (Schoology requires a subject on
     every new thread). The send box at the bottom is untouched. ---------- */
  .msgs-to-bar { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .msgs-to-bar[hidden] { display: none; }
  .msgs-to-label { font-size: 0.78rem; font-weight: 800; color: var(--text-muted); flex-shrink: 0; }
  .msgs-to-search { position: relative; flex: 1; min-width: 0; }
  .msgs-to-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 10px;
    font: inherit;
    font-size: 0.84rem;
    color: var(--text-dark);
    background: var(--panel-bg);
  }
  .msgs-to-input::placeholder { color: var(--text-faint); }
  .msgs-to-input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-color: var(--accent); }
  /* Results dropdown for the To search (2026-09-05) -- capped to
     MAX_TO_RESULTS items in JS so this box has a fixed, predictable
     height no matter how many people match or how big the district is. */
  .msgs-to-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 20;
    max-height: 280px;
    overflow-y: auto;
  }
  .msgs-to-results[hidden] { display: none; }
  .msgs-to-result-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    padding: 8px 10px;
    cursor: pointer;
  }
  .msgs-to-result-item:hover,
  .msgs-to-result-item.highlighted { background: var(--panel-inner); }
  .msgs-to-result-name { font-weight: 700; font-size: 0.84rem; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs-to-result-course { font-size: 0.72rem; font-weight: 600; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs-to-no-results { padding: 8px 10px; font-size: 0.82rem; font-weight: 600; color: var(--text-faint); }
  .msgs-subject-bar { padding: 10px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .msgs-subject-bar[hidden] { display: none; }
  .msgs-subject-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.84rem;
    color: var(--text-dark);
    background: var(--panel-bg);
  }
  .msgs-subject-input::placeholder { color: var(--text-faint); }
  .msgs-subject-input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-color: var(--accent); }
  /* The pinned "New Message" row's icon avatar -- a plain "+" instead of
     a person's initial, since no recipient may be chosen yet. */
  .msgs-avatar-new { background: var(--accent); }
  .msgs-avatar-new svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; }

  /* Scrolls on its own within the fixed-height panel -- .msgs-thread-header
     (who you're texting) above and .msgs-composer (send box) below both
     stay put. flex:1/min-height:0 is also what makes it consume any
     leftover vertical space instead of that space collecting below the
     composer -- see the .msgs-shell comment above. */
  .msgs-bubbles { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  /* flex-direction:column so a message that also carries an attachment
     (see .msgs-bubble-attachment) stacks the attachment chip right below
     its bubble instead of side-by-side; a row with just a bubble looks
     identical to before. */
  .msgs-bubble-row { display: flex; flex-direction: column; gap: 6px; }
  .msgs-bubble-row.me { align-items: flex-end; }
  .msgs-bubble-row.them { align-items: flex-start; }
  .msgs-bubble { max-width: 74%; padding: 9px 13px; border-radius: 16px; font-size: 0.84rem; line-height: 1.42; }
  .msgs-bubble-row.them .msgs-bubble { background: var(--panel-inner); color: var(--text-dark); border-bottom-left-radius: 4px; }
  .msgs-bubble-row.me .msgs-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msgs-bubble-time { display: block; font-size: 0.62rem; font-weight: 700; margin-top: 4px; }
  .msgs-bubble-row.them .msgs-bubble-time { color: var(--text-faint); }
  .msgs-bubble-row.me .msgs-bubble-time { color: rgba(255,255,255,0.82); }
  /* A file/link/video/audio genuinely shared IN this message — renders
     right under it as its own small chip row, in the same panel style
     regardless of who sent it (unlike the text bubble, which flips
     color for "me"), matching how a real messaging app shows an
     attachment distinctly from the text around it. */
  .msgs-bubble-attachment { display: flex; align-items: center; gap: 9px; max-width: 74%; padding: 6px 12px 6px 6px; border-radius: 14px; background: var(--panel-inner); }
  .msgs-bubble-attachment .msgs-file-chip, .msgs-bubble-attachment .msgs-media-chip { width: 28px; height: 28px; font-size: 0.52rem; }
  .msgs-bubble-attachment .msgs-media-chip svg { width: 13px; height: 13px; }
  .msgs-bubble-attachment-text { min-width: 0; }
  .msgs-bubble-attachment-name { display: block; max-width: 170px; font-size: 0.76rem; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Link attachments read as blue + underlined everywhere they appear
     (2026-09-04, per Martin: "make all other link attachments blue and
     underlined") -- both the pre-authored sample threads' links and any
     newly auto-detected one (see extractLinkAttachment() further down)
     render through the same renderBubbleAttachment(), which adds this
     modifier class only when a.kind === 'link'. */
  .msgs-bubble-attachment-name-link { color: var(--accent); text-decoration: underline; }
  .msgs-bubble-attachment-meta { font-size: 0.66rem; font-weight: 600; color: var(--text-faint); }
  .msgs-bubble-attachment-time { display: block; font-size: 0.62rem; font-weight: 700; color: var(--text-faint); margin-top: -2px; }
  @keyframes msgsBubbleFlash {
    0% { box-shadow: 0 0 0 0 rgba(217,74,43,0); }
    25% { box-shadow: 0 0 0 4px rgba(217,74,43,0.6); }
    100% { box-shadow: 0 0 0 0 rgba(217,74,43,0); }
  }
  .msgs-bubble-row.flash .msgs-bubble { animation: msgsBubbleFlash 1.4s ease; }

  /* align-items:flex-end (not center) -- per Martin's 2026-09-04 request,
     an attachment preview now lives INSIDE this box (see
     .msgs-composer-box below) stacked above the text line, so the box
     can grow taller than the attach/send buttons beside it. flex-end
     keeps those buttons pinned to the bottom row instead of drifting to
     the vertical middle of a taller box, matching where your thumb
     expects Send to stay as the box grows. */
  .msgs-composer { display: flex; align-items: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
  /* The actual "message box" -- was just the bare <input> before; now a
     bordered/rounded container so a pending attachment (see
     .msgs-pending-attachment) can sit inside it, above the text line,
     as one visually unified box that extends upward to fit both rather
     than a separate chip floating above the whole composer row. With no
     attachment it's a single row and the 20px radius on a ~40px-tall
     box still reads as the original pill. */
  .msgs-composer-box {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--panel-bg);
    overflow: hidden;
  }
  .msgs-composer-box:focus-within { box-shadow: 0 0 0 2px var(--accent-ring); border-color: var(--accent); }
  /* Disabled while viewing the merged "All subjects" timeline (see
     setComposerEnabled) -- there's no single thread to reply into. */
  .msgs-composer-box:has(#composerInput:disabled) { background: var(--panel-inner); }
  #composerInput {
    border: none;
    border-radius: 0;
    padding: 10px 16px;
    font: inherit;
    font-size: 0.84rem;
    color: var(--text-dark);
    background: none;
  }
  #composerInput::placeholder { color: var(--text-faint); }
  #composerInput:focus-visible { outline: none; }
  #composerInput:disabled { color: var(--text-faint); cursor: not-allowed; }
  .msgs-send-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .msgs-send-btn:hover { background: var(--accent-dark); }
  .msgs-send-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-send-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .msgs-send-btn:disabled { background: var(--text-faint); cursor: not-allowed; }
  .msgs-attach-btn:disabled { cursor: not-allowed; opacity: 0.5; }
  .msgs-attach-btn:disabled:hover { background: none; color: var(--text-muted); }
  /* Sits between the input and the send button, per Martin's request. */
  .msgs-attach-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .msgs-attach-btn:hover { background: var(--panel-inner); color: var(--text-dark); }
  .msgs-attach-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-attach-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  /* Preview of files picked via the attach button, shown inside the
     message box (.msgs-composer-box) above the text line until sent (or
     removed individually). Lives inside the same bordered box as the
     input rather than as its own separate bar floating above the whole
     composer row; the box is fine extending upward to fit it.
     2026-09-04 (per Martin, with a Claude-attachment-UI screenshot as
     reference): now supports more than one pending attachment at once,
     each shrunk into its own small square tile with an ×-remove button
     sitting on its top-right corner, wrapping onto more rows as needed
     rather than one long horizontal chip. Real document preview
     (thumbnails) is explicitly out of scope per Martin ("will come out
     in later version") — each tile is just the filename plus its
     extension badge, same info the old single-chip version showed. */
  .msgs-pending-attachment {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 10px 10px 0;
    flex-shrink: 0;
  }
  .msgs-pending-attachment[hidden] { display: none; }
  .msgs-pending-attachment-tile {
    position: relative;
    width: 76px;
    height: 76px;
    border-radius: 14px;
    background: var(--panel-inner);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 6px;
    flex-shrink: 0;
  }
  .msgs-pending-attachment-tile-name {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--text-dark);
    text-align: center;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .msgs-pending-attachment-tile-ext {
    font-size: 0.56rem;
    font-weight: 900;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: var(--panel-bg);
    padding: 2px 7px;
    border-radius: 999px;
  }
  /* Sits on the tile's top-right corner (half overlapping, half clear
     of it), matching the reference screenshot's remove-button style. */
  .msgs-pending-attachment-tile-remove {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--panel-bg);
    background: var(--text-dark);
    color: #fff;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .msgs-pending-attachment-tile-remove:hover { background: var(--accent-dark); }
  .msgs-pending-attachment-tile-remove:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .msgs-pending-attachment-tile-remove svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; }

  /* Link detection while typing (2026-09-04, per Martin: "when you type
     a link, make it have the blue color and the underline"). #composerInput
     is a plain <input> (not contenteditable, to keep this simple and
     robust rather than reimplementing caret handling), so this colors
     the WHOLE typed line once it contains something URL-shaped, rather
     than styling just the matched substring -- a reasonable stand-in for
     a mock, and exactly matches the common case of a message that's
     nothing but a pasted link. See the composerInput 'input' listener
     (toggles this class) and URL_RE / extractLinkAttachment() further
     down in the script. */
  /* #composerInput (ID selector, higher specificity) also sets its own
     color -- this needs the ID repeated here too, or that rule wins and
     the text never visibly turns blue despite the class being applied. */
  #composerInput.msgs-composer-link-active { color: var(--accent); text-decoration: underline; }

  /* ---------- Bottom nav — copied verbatim ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }

  @media (max-width: 720px) {
    .msgs-list-panel { width: 100%; }
    .msgs-shell:not(.thread-open) .msgs-thread-panel { display: none; }
    .msgs-shell.thread-open .msgs-list-panel { display: none; }
    .msgs-shell.thread-open .msgs-thread-panel { display: flex; }
    .msgs-back-btn { display: inline-flex; align-items: center; }
  }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div>
        <h1 class="title">Messages</h1>
        <p class="subtitle" id="msgsSubtitle"></p>
      </div>
      <div class="profile-menu-wrap">
        <button class="profile-btn" id="profileBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Profile and settings">M</button>
        <div class="profile-menu" id="profileMenu" role="menu" hidden>
          <button class="profile-menu-item" type="button" role="menuitem" data-action="settings">Settings</button>
          <button class="profile-menu-item signout" type="button" role="menuitem" data-action="signout">Sign out</button>
        </div>
      </div>
    </div>

    <div class="msgs-shell" id="msgsShell">
      <div class="msgs-list-panel">
        <div class="msgs-list-head" id="listHeadDefault">
          <button class="msgs-compose-btn" id="composeBtn" type="button" aria-label="New message">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="msgs-search-wrap" id="searchWrap">
            <input type="search" id="msgsSearch" placeholder="Search" aria-label="Search messages" autocomplete="off">
            <button class="msgs-search-clear" id="searchClearBtn" type="button" aria-label="Clear search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="msgs-filter-wrap">
            <button class="msgs-filter-btn" id="filterBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Filter messages">
              <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="17" x2="14" y2="17"/></svg>
            </button>
            <div class="msgs-filter-menu" id="filterMenu" role="menu" hidden>
              <button class="msgs-filter-item active" type="button" role="menuitem" data-filter="all">All</button>
              <button class="msgs-filter-item" type="button" role="menuitem" data-filter="unread">Unread</button>
              <!-- 2026-09-05, per Martin -- combines every person's separate
                   subject threads into one row each, reusing the "All
                   subjects" merged view already built for the per-person
                   subject dropdown (see showAllSubjectsFor/renderMergedBubbles
                   above). A standalone filter choice, not a modifier on
                   All/Unread -- see combinedRows()/combinedRowHtml() below. -->
              <button class="msgs-filter-item" type="button" role="menuitem" data-filter="combined">Combined</button>
            </div>
          </div>
        </div>
        <div class="msgs-thread-list" id="threadList"></div>
        <div class="msgs-search-results" id="searchResults" hidden></div>
      </div>

      <!-- Right-click menu for a left-side thread row (2026-09-04, per
           Martin) -- Pin/Unpin + Delete. Never opens for the pinned "New
           Message" draft row (see the contextmenu listener on threadList
           further down). -->
      <div class="msgs-row-context-menu" id="rowContextMenu" role="menu" hidden>
        <button class="msgs-row-context-menu-item" type="button" role="menuitem" id="rowContextPinBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="rowContextPinLabel">Pin</span>
        </button>
        <button class="msgs-row-context-menu-item delete" type="button" role="menuitem" id="rowContextDeleteBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z"/><path d="M10 11v6M14 11v6"/></svg>
          Delete
        </button>
      </div>

      <div class="msgs-thread-panel">
        <div class="msgs-thread-empty" id="threadEmpty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <p>Select a conversation</p>
        </div>
        <div class="msgs-thread-active" id="threadActive" hidden>
          <div class="msgs-thread-header">
            <button class="msgs-back-btn" id="threadBackBtn" type="button" aria-label="Back to messages">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="msgs-thread-identity" id="threadIdentity">
              <span class="msgs-thread-avatar" id="threadAvatar"></span>
              <div class="msgs-thread-head-text">
                <span class="msgs-thread-name" id="threadName"></span>
                <span class="msgs-thread-course" id="threadCourse"></span>
                <!-- Subject dropdown (2026-09-04, per Martin: "a down
                     arrow on the subject... a dropdown with every
                     subject you messaged under and at the top an all
                     subjects option"). Shown only for a real opened
                     thread or the merged All Subjects view (see
                     renderSubjectDropdown/showThread/showAllSubjectsFor)
                     -- stays hidden during the New Message compose flows,
                     which use #subjectBar's text input instead since
                     there's no existing subject to pick from yet. -->
                <div class="msgs-thread-subject-row" id="threadSubjectRow" hidden>
                  <button type="button" class="msgs-thread-subject-trigger" id="threadSubjectTrigger" aria-haspopup="menu" aria-expanded="false">
                    <span id="threadSubjectTriggerLabel"></span>
                    <svg class="msgs-thread-subject-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                  </button>
                  <div class="msgs-thread-subject-menu" id="threadSubjectMenu" role="menu" hidden></div>
                </div>
              </div>
            </div>
            <div class="msgs-to-bar" id="toBar" hidden>
              <label class="msgs-to-label" for="toInput">To</label>
              <!-- Search-as-you-type recipient picker (2026-09-05, per
                   Martin: a plain list of every person in the district
                   doesn't scale -- a real district can have hundreds of
                   people, so this needs to filter down as you type rather
                   than dump the whole directory in a dropdown). See
                   renderToResults()/directoryMatches() below: results are
                   capped at MAX_TO_RESULTS so the list can never overflow
                   the page regardless of district size. -->
              <div class="msgs-to-search" id="toSearchWrap">
                <input type="text" id="toInput" class="msgs-to-input" placeholder="Type a name…" aria-label="Search for a person to message" autocomplete="off" role="combobox" aria-expanded="false" aria-haspopup="listbox" aria-controls="toResults">
                <div class="msgs-to-results" id="toResults" role="listbox" hidden></div>
              </div>
            </div>
          </div>
          <div class="msgs-subject-bar" id="subjectBar" hidden>
            <input type="text" id="subjectInput" class="msgs-subject-input" placeholder="Subject" aria-label="Subject">
          </div>
          <div class="msgs-bubbles" id="threadBubbles"></div>
          <!-- Plain div, not a <form> (changed 2026-09-04, per Martin's
               report that sending didn't work for him): this page gets
               opened inside a sandboxed preview iframe in some surfaces,
               and a sandboxed iframe without the "allow-forms" permission
               silently blocks real <form> submission at the browser
               level -- before our JS even runs, so e.preventDefault()
               never gets the chance to matter. Send now happens off a
               plain button click + a keydown listener on the input (see
               sendComposerMessage() in the script), which isn't form
               submission at all and isn't affected by that restriction. -->
          <!-- Shown instead of letting the composer just silently do
               nothing while viewing the merged "All subjects" timeline
