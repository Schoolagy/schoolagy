    const STARRED = { apchem: ['Syllabus.pdf'], algebra2: ['Syllabus.pdf'], english10: ['Syllabus.pdf'], ushistory: ['Syllabus.pdf'], spanish3: ['Syllabus.pdf'], pe: ['Syllabus.pdf'] };

    const root = MATERIALS[course.id] || MATERIALS.apchem;
    root.name = `${course.name} Materials`;

    // Every folder/file gets a stable `_id`, assigned once here — needed
    // once items can be renamed and dragged between folders (2026-08-26,
    // per Martin's request), since matching on `.name` alone would break
    // the moment two items share a name or an item gets renamed mid-drag.
    let idCounter = 0;
    (function assignIds(node) {
      node._id = 'n' + (idCounter++);
      node.folders.forEach(assignIds);
      node.files.forEach(f => { f._id = 'n' + (idCounter++); });
    })(root);

    // Starred is seeded by name (the sample data's own convention) but
    // resolved to real `_id`s once at load, so a later rename doesn't
    // silently un-star a file.
    const starredIds = new Set();
    (function markStarred(node) {
      const names = STARRED[course.id] || [];
      node.files.forEach(f => { if (names.includes(f.name)) starredIds.add(f._id); });
      node.folders.forEach(markStarred);
    })(root);

    // Browser-style history: an array of nodes plus a pointer, so Back
    // and Forward behave like real navigation instead of just Back
    // popping a stack with no way to redo.
    let history = [root];
    let pointer = 0;
    let mode = 'browse'; // 'browse' | 'recents' | 'starred'
    let view = 'grid';
    let selectedId = null;
    let renamingId = null;

    function currentNode() { return history[pointer]; }

    function findNodeById(id) {
      if (root._id === id) return root;
      function walk(node) {
        for (const f of node.folders) { if (f._id === id) return f; const found = walk(f); if (found) return found; }
        return null;
      }
      return walk(root);
    }

    function isDescendant(folder, maybeChild) {
      return folder.folders.some(f => f._id === maybeChild._id || isDescendant(f, maybeChild));
    }

    // Finds the *real* folder a given child `_id` lives in by walking the
    // actual tree, rather than assuming `currentNode()` — needed because
    // the right-click menu (2026-08-27, per Martin's request: "let the
    // user right click anything") now also works on tiles rendered from
    // Recents/Starred, which are computed flat lists with no folder of
    // their own; `currentNode()` there would be the wrong parent (or not
    // a real one at all) for actions like Rename/Duplicate/Move to Trash
    // that need to splice the item out of its actual containing array.
    function findParentOf(childId) {
      function walk(node) {
        if (node.folders.some(f => f._id === childId) || node.files.some(f => f._id === childId)) return node;
        for (const f of node.folders) { const found = walk(f); if (found) return found; }
        return null;
      }
      return walk(root);
    }

    function allFilesFlat(node) {
      let out = node.files.slice();
      node.folders.forEach(f => { out = out.concat(allFilesFlat(f)); });
      return out;
    }

    // Finds any item — file OR folder — anywhere in the tree by `_id`,
    // returning both the item and whether it's a folder. Used by the
    // toolbar's "More options" button below (2026-08-28: reworked to act
    // on whatever's selected, not just assignment files) so it works the
    // same way findParentOf()/the right-click menu already do — from any
    // course folder, subfolder, or quick-access view.
    function findItemById(id) {
      if (!id) return null;
      function walk(node) {
        for (const f of node.folders) {
          if (f._id === id) return { item: f, isFolder: true };
          const found = walk(f);
          if (found) return found;
        }
        for (const f of node.files) {
          if (f._id === id) return { item: f, isFolder: false };
        }
        return null;
      }
      return walk(root);
    }

    function fileBadgeColor(ext) {
      if (ext === 'pdf') return '#c1443a';
      if (ext === 'docx') return '#3b6fd1';
      if (ext === 'pptx') return '#d1852f';
      return '#7c7c86';
    }

    // Icon fills read the finder-window's own CSS custom properties (via
    // `style="fill:var(...)"`, which SVG honors from an inline style
    // attribute) rather than being hardcoded, so the file "page" shape
    // stays legible without regenerating markup if the theme tokens ever
    // change again — a light page needs a visible border to read against
    // a light window, so --finder-icon-border is a soft gray now (it was
    // transparent back when this page had a dark theme).
    // A file's icon takes the whole file object (not just its ext) so it
    // can also read `f.assignment` — files with `assignment: true` (work
    // to actually turn in, e.g. a worksheet or lab report) get a few
    // short handwriting-style lines drawn right on the page, so an
    // assignment reads as "something's been written on this" versus a
    // blank page of plain course material (slides, notes, the syllabus).
    // An earlier version marked this with a small pencil badge instead —
    // replaced per Martin's follow-up ("remove the pencil, if its a
    // assignment put writting on the paper") in favor of putting the
    // cue directly on the paper itself. Accepts a bare ext string too
    // (defensive — some callers only have the extension on hand) and
    // simply skips the lines in that case.
    function writingLinesSVG() {
      return [[10, 10, 15], [10, 14.5, 11], [10, 19, 14]]
        .map(([x, y, w]) => `<rect x="${x}" y="${y}" width="${w}" height="1.6" rx="0.8" fill="var(--finder-icon-ink)"/>`)
        .join('');
    }
    function smallWritingLinesSVG() {
      return [[4, 4, 7], [4, 6.6, 5], [4, 9.2, 6.5]]
        .map(([x, y, w]) => `<rect x="${x}" y="${y}" width="${w}" height="0.9" rx="0.45" fill="var(--finder-icon-ink)"/>`)
        .join('');
    }
    // Quiz icon (2026-09-03, per Martin: "the icon should be the paper
    // with a b c d and lines to show its a quiz") — an A/B/C/D multiple-
    // choice answer sheet drawn right on the same page shape every other
    // file uses, instead of the usual colored PDF/DOCX/PPTX badge (a quiz
    // item has no real `ext` — it isn't a document at all, it's taken
    // inside Schoology itself; see the redirect notice on assignment.html
    // — so there's no file-type badge to show here in the first place).
    // **Made more obvious, same-day follow-up** — the first version drew
    // the letters in the same neutral ink color the plain assignment
    // "writing lines" already use, so at actual icon size a quiz read as
    // just another vague scribbled page, not clearly different from a
    // regular assignment. Each letter is now a small solid color badge
    // (white text on a filled circle) using a new `QUIZ_COLOR` purple —
    // deliberately a hue none of the other file-type badges use
    // (PDF red / DOCX blue / PPTX orange / generic gray) — so a quiz
    // pops with real color instead of blending into the page.
    const QUIZ_COLOR = '#7c5cd6';
    function quizAnswerRowsSVG() {
      return [['A', 12, 13], ['B', 17.5, 10], ['C', 23, 12], ['D', 28.5, 8]]
        .map(([letter, y, w]) => `<circle cx="11" cy="${y}" r="3" fill="${QUIZ_COLOR}"/><text x="11" y="${y + 1.3}" font-size="3.8" font-weight="800" fill="#fff" text-anchor="middle" font-family="-apple-system, sans-serif">${letter}</text><rect x="16.5" y="${y - 0.85}" width="${w}" height="1.7" rx="0.85" fill="var(--finder-icon-ink)"/>`)
        .join('');
    }
    function smallQuizAnswerRowsSVG() {
      return [['A', 5, 6], ['B', 8.3, 4.5], ['C', 11.6, 5.5]]
        .map(([letter, y, w]) => `<circle cx="4.3" cy="${y}" r="1.5" fill="${QUIZ_COLOR}"/><text x="4.3" y="${y + 0.6}" font-size="2" font-weight="800" fill="#fff" text-anchor="middle" font-family="-apple-system, sans-serif">${letter}</text><rect x="6.6" y="${y - 0.5}" width="${w}" height="1" rx="0.5" fill="var(--finder-icon-ink)"/>`)
        .join('');
    }
    function fileIconSVG(f) {
      const isQuiz = typeof f === 'object' && f && f.quiz;
      const ext = typeof f === 'string' ? f : f.ext;
      const isAssignment = typeof f === 'object' && f && f.assignment;
      // Quiz items skip the colored ext badge entirely — the A/B/C/D rows
      // above are the whole point of the icon, not an addition to it.
      if (isQuiz) {
        return `<svg viewBox="0 0 42 42" aria-hidden="true">
          <path d="M9 3h17l7 7v27a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" style="fill:var(--finder-icon-page);stroke:var(--finder-icon-border)"/>
          <path d="M26 3v7h7z" style="fill:var(--finder-icon-fold)"/>
          ${quizAnswerRowsSVG()}
        </svg>`;
      }
      const c = fileBadgeColor(ext);
      return `<svg viewBox="0 0 42 42" aria-hidden="true">
        <path d="M9 3h17l7 7v27a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" style="fill:var(--finder-icon-page);stroke:var(--finder-icon-border)"/>
        <path d="M26 3v7h7z" style="fill:var(--finder-icon-fold)"/>
        ${isAssignment ? writingLinesSVG() : ''}
        <rect x="9" y="26" width="18" height="9" rx="2" fill="${c}"/>
        <text x="18" y="32.5" font-size="7" font-weight="800" fill="#fff" font-family="-apple-system, sans-serif" text-anchor="middle">${ext.toUpperCase()}</text>
      </svg>`;
    }
    // `color` is an optional Folder Color hex (see the right-click menu
    // below) — when set, it replaces the default blue as the folder's
    // main body fill, with the lighter top-flap shade derived from it via
    // `lightenHex()` rather than needing a hardcoded pair per color.
    function folderIconSVG(color) {
      const body = color || '#4f8fd6', flap = color ? lightenHex(color, 0.35) : '#63a6e8';
      return `<svg viewBox="0 0 42 42" aria-hidden="true">
        <path d="M4 11a2 2 0 0 1 2-2h9l3 3h18a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V11z" fill="${flap}"/>
        <path d="M4 15h34v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V15z" fill="${body}"/>
      </svg>`;
    }
    function smallFileIconSVG(f) {
      const isQuiz = typeof f === 'object' && f && f.quiz;
      if (isQuiz) {
        return `<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="1" width="14" height="18" rx="2" style="fill:var(--finder-icon-page);stroke:var(--finder-icon-border)"/>${smallQuizAnswerRowsSVG()}</svg>`;
      }
      const ext = typeof f === 'string' ? f : f.ext;
      const isAssignment = typeof f === 'object' && f && f.assignment;
      const c = fileBadgeColor(ext);
      return `<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="1" width="14" height="18" rx="2" style="fill:var(--finder-icon-page);stroke:var(--finder-icon-border)"/>${isAssignment ? smallWritingLinesSVG() : ''}<rect x="2" y="14" width="14" height="5" rx="2" fill="${c}"/></svg>`;
    }
    function smallFolderIconSVG(color) {
      return `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5a1 1 0 0 1 1-1h5l1.4 1.4H17a1 1 0 0 1 1 1V15a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z" fill="${color || '#5b9dd9'}"/></svg>`;
    }
    // Small filled-star badge for a starred file (2026-08-27, per
    // Martin's "add to starred" request) — same star outline as the
    // sidebar's own Starred nav icon, so it reads as the same concept.
    function starBadgeSVG() {
      return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.9 6.3.7-4.7 4.4 1.3 6.4-5.6-3.2-5.6 3.2 1.3-6.4-4.7-4.4 6.3-.7z"/></svg>`;
    }
    function starBadgeMarkup(f) {
      return starredIds.has(f._id) ? `<span class="item-star-badge" aria-hidden="true">${starBadgeSVG()}</span>` : '';
    }
    // Sidebar "Course Folders" list — every drop-target attribute here
    // matches the grid/list tiles' own scheme (`data-folder-target` +
    // `data-id`) so dropTargetFromPoint() can treat a sidebar folder and
    // an on-screen folder tile identically.
    function renderUnitList() {
      const wrap = document.getElementById('unitList');
      wrap.innerHTML = '';
      root.folders.forEach(f => {
        const btn = document.createElement('button');
        btn.className = 'fs-item';
        btn.type = 'button';
        btn.dataset.folderTarget = 'true';
        btn.dataset.id = f._id;
        btn.innerHTML = smallFolderIconSVG(f.tagColor) + `<span>${f.name}</span>`;
        btn.addEventListener('click', () => openNode(f, true));
        wrap.appendChild(btn);
      });
    }

    function setActiveSidebar(key) {
      document.querySelectorAll('.fs-item[data-quick]').forEach(b => b.classList.toggle('active', b.dataset.quick === key));
    }

    function openNode(node, pushHistory) {
      mode = 'browse';
      renamingId = null;
      setActiveSidebar('all');
      if (pushHistory) {
        history = history.slice(0, pointer + 1);
        history.push(node);
        pointer = history.length - 1;
      }
      render();
    }

    // ------------------------------------------------------------------
    // Drag-to-move (2026-08-26, per Martin's request: "let users make
    // folders and move things around by dragging"). Built on Pointer
    // Events rather than native HTML5 Drag-and-Drop — same reliability/
    // touch-support reasoning already documented for the Courses page's
    // reorder tool in architecture-decisions.md (native DnD there was
    // found to silently cancel instead of firing `drop`, and has no
    // touch equivalent at all, which matters for a mockup of a phone
    // app). A move is a straight splice-out/push-into on the real
    // `folders`/`files` arrays, using `_id` so it's correct even when
    // names collide. Only active in 'browse' mode — Recents/Starred are
    // computed views with no single real parent to drag out of.
    // ------------------------------------------------------------------
    let dragCtx = null;
    let lastDropEl = null;

    function attachDragHandlers(el, item, isFolder) {
      el.addEventListener('pointerdown', e => {
        if (mode !== 'browse') return;
        if (e.button !== undefined && e.button !== 0) return;
        if (e.target.closest('.item-edit-btn') || e.target.tagName === 'INPUT') return;
        dragCtx = { item, isFolder, parent: currentNode(), startX: e.clientX, startY: e.clientY, dragging: false, ghost: null };
        document.addEventListener('pointermove', onDragMove);
        document.addEventListener('pointerup', onDragEnd);
      });
      el.addEventListener('contextmenu', e => {
        // **No longer gated to browse mode (2026-08-27, per Martin's
        // request — "it wont let you right click unless your in a
        // folder... let the user right click anything")**: right-click
        // now works on every tile everywhere, including Recents/Starred,
        // by resolving the item's real parent via `findParentOf()` below
        // instead of assuming `currentNode()` (which is only correct in
        // browse mode — Recents/Starred are computed lists, not a real
        // folder). Dragging above is unaffected and stays browse-only,
        // since "move this into that folder" has no sensible meaning
        // from a Recents/Starred list.
        e.preventDefault();
        selectedId = item._id;
        const parent = findParentOf(item._id) || currentNode();
        render();
        openContextMenu(e.clientX, e.clientY, item, isFolder, parent);
      });
    }

    function onDragMove(e) {
      if (!dragCtx) return;
      const dx = e.clientX - dragCtx.startX, dy = e.clientY - dragCtx.startY;
      if (!dragCtx.dragging && Math.hypot(dx, dy) > 6) {
        dragCtx.dragging = true;
        const ghost = document.createElement('div');
        ghost.className = 'drag-ghost';
        ghost.innerHTML = `<span class="item-icon">${dragCtx.isFolder ? folderIconSVG(dragCtx.item.tagColor) : fileIconSVG(dragCtx.item)}</span><span class="item-name">${dragCtx.item.name}</span>`;
        document.body.appendChild(ghost);
        dragCtx.ghost = ghost;
      }
      if (dragCtx.dragging) {
        dragCtx.ghost.style.left = e.clientX + 'px';
        dragCtx.ghost.style.top = e.clientY + 'px';
        updateDropTargetHighlight(e.clientX, e.clientY);
      }
    }

    function dropTargetFromPoint(x, y) {
      if (!dragCtx) return null;
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const hit = el.closest('[data-folder-target="true"]');
      if (!hit) return null;
      const id = hit.dataset.id;
      if (id === dragCtx.item._id) return null; // a folder can't be dropped onto itself
      const folder = id === 'root' ? root : findNodeById(id);
      if (!folder) return null;
      if (dragCtx.isFolder && isDescendant(dragCtx.item, folder)) return null; // no cycles
      return { folder, el: hit };
    }

    // Whether the point (x, y) is over open drop space — not a folder
    // drop target, but still inside the browsable content pane — which is
    // what makes free-drop-anywhere possible (below). This checks against
    // `.finder-content` (the whole scrollable pane) rather than
    // `#itemGrid` itself: the grid element's own box is only as tall as
    // however many rows are currently in flow, so checking against it
    // only let a dragged item land in a thin band near its original row
    // instead of truly anywhere on the visible page.
    function overFreeDropZone(x, y) {
      if (view !== 'grid' || mode !== 'browse') return false;
      const rect = document.querySelector('.finder-content').getBoundingClientRect();
      return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    }

    function updateDropTargetHighlight(x, y) {
      const target = dropTargetFromPoint(x, y);
      const newEl = target ? target.el : null;
      if (lastDropEl && lastDropEl !== newEl) lastDropEl.classList.remove('drop-target');
      if (newEl) newEl.classList.add('drop-target');
      lastDropEl = newEl;
      document.querySelector('.finder-content').classList.toggle('free-drop-active', !target && overFreeDropZone(x, y));
    }
    function clearDropTargetHighlight() {
      if (lastDropEl) lastDropEl.classList.remove('drop-target');
      lastDropEl = null;
      document.querySelector('.finder-content').classList.remove('free-drop-active');
    }

    function moveItemTo(item, isFolder, sourceParent, destFolder) {
      if (destFolder._id === sourceParent._id) return; // already there
      const arr = isFolder ? sourceParent.folders : sourceParent.files;
      const idx = arr.findIndex(x => x._id === item._id);
      if (idx === -1) return;
      arr.splice(idx, 1);
      delete item.pos; // a free position is relative to the grid it was dropped in — moving to a different folder drops it back into normal flow there, rather than reusing coordinates that may not even fit
      (isFolder ? destFolder.folders : destFolder.files).push(item);
      selectedId = item._id;
    }

    function onDragEnd(e) {
      document.removeEventListener('pointermove', onDragMove);
      document.removeEventListener('pointerup', onDragEnd);
      if (!dragCtx) return;
      clearDropTargetHighlight();
      const wasDragging = dragCtx.dragging;
      if (wasDragging) {
        if (dragCtx.ghost) dragCtx.ghost.remove();
        const target = dropTargetFromPoint(e.clientX, e.clientY);
        if (target) {
          moveItemTo(dragCtx.item, dragCtx.isFolder, dragCtx.parent, target.folder);
        } else if (overFreeDropZone(e.clientX, e.clientY)) {
          // Free-drop-anywhere (2026-08-26, per Martin's request): landing
          // on open space (not a folder) parks the item exactly there —
          // same idiom as real Finder icon view, where you can scatter
          // icons freely instead of only ever filing them into folders or
          // having them stay lined up in a row. A drop outside the pane
          // entirely still just snaps back (falls through with neither
          // branch running).
          //
          // The item's `pos` is stored relative to #itemGrid (its
          // positioning container), but the *bounds* it's clamped to come
          // from `.finder-content` — the whole visible/scrollable pane —
          // not from itemGrid's own box, which is only as tall as
          // whatever's currently laid out in flow. Clamping to itemGrid's
          // own height is what previously kept a "freely" dropped item
          // stuck in a thin band near its original row instead of letting
          // it land anywhere on the page (2026-08-26, follow-up fix).
          const gridRect = document.getElementById('itemGrid').getBoundingClientRect();
          const contentRect = document.querySelector('.finder-content').getBoundingClientRect();
          const TILE_W = 84, TILE_H = 96;
          const maxX = Math.max(0, gridRect.width - TILE_W);
          const maxY = Math.max(0, (contentRect.bottom - gridRect.top) - TILE_H);
          const x = Math.max(0, Math.min(e.clientX - gridRect.left - TILE_W / 2, maxX));
          const y = Math.max(0, Math.min(e.clientY - gridRect.top - TILE_H / 2, maxY));
          dragCtx.item.pos = { x, y };
        }
      }
      dragCtx = null;
      if (wasDragging) { render(); renderUnitList(); }
    }

    // ------------------------------------------------------------------
    // New folder (2026-08-26, per Martin's request — the toolbar "+"
    // button). Drops a fresh, empty folder into whatever folder is
    // currently open and immediately starts renaming it, matching real
    // Finder's own "new folder starts in rename mode" behavior. Switches
    // out of Recents/Starred back to All Materials first, since a new
    // folder needs a real parent to live in.
    // ------------------------------------------------------------------
    document.getElementById('newFolderBtn').addEventListener('click', () => {
      if (mode !== 'browse') { mode = 'browse'; setActiveSidebar('all'); history = [root]; pointer = 0; }
      const node = currentNode();
      let name = 'New Folder', n = 1;
      while (node.folders.some(f => f.name === name)) { n++; name = `New Folder ${n}`; }
      // `userCreated: true` marks this as something the current user
      // made, as opposed to the teacher-provided sample data — see the
      // Move to Trash / Get Info notes near buildContextMenu below for
      // what that flag now gates.
      const newFolder = { _id: 'n' + (idCounter++), name, folders: [], files: [], userCreated: true };
      node.folders.push(newFolder);
      selectedId = newFolder._id;
      renamingId = newFolder._id;
      render();
      renderUnitList();
    });

    // ------------------------------------------------------------------
    // Rename (the pencil icon, 2026-08-26, per Martin's request — "make
    // the assignments have a pencil"). Swaps the tile/row's name span
    // for a text input in place; commits on Enter/blur, cancels on
    // Escape. Works by `_id`, so it's safe even mid-Recents/Starred view.
    // ------------------------------------------------------------------
    function commitRename(item, value) {
      const trimmed = value.trim();
      if (trimmed) item.name = trimmed;
      renamingId = null;
      render();
      renderUnitList();
    }
    function bindRenameInput(input, item) {
      input.addEventListener('click', e => e.stopPropagation());
      input.addEventListener('pointerdown', e => e.stopPropagation());
      input.addEventListener('keydown', e => {
        // stopPropagation is the important part here: without it, this
        // same Enter keydown bubbles up to the tile's own keydown
        // listener (which opens the folder) — by the time it gets
        // there, input.blur() below has already committed the rename
        // and reset renamingId to null, so the tile's `renamingId !==
        // f._id` guard passes and it navigates straight into the
        // folder that was just renamed (or into a still-empty new
        // folder, showing nothing). Caught via Playwright reproducing
        // that exact "renamed then silently navigated" sequence.
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        else if (e.key === 'Escape') { e.preventDefault(); renamingId = null; render(); }
      });
      input.addEventListener('blur', () => { if (renamingId === item._id) commitRename(item, input.value); });
    }

    // ------------------------------------------------------------------
    // Delete via Backspace/Delete (2026-08-26, per Martin's request).
    // Selecting a folder or file and pressing Backspace (or Delete) asks
    // for confirmation before removing it — a folder's confirmation
    // spells out everything nested inside it, since deleting a folder
    // deletes its whole contents too, not just the folder itself.
    // ------------------------------------------------------------------
    function countContents(folder) {
      let files = folder.files.length, folders = folder.folders.length;
      folder.folders.forEach(sub => {
        const c = countContents(sub);
        files += c.files;
        folders += c.folders;
      });
      return { files, folders };
    }

    let deleteCtx = null; // { item, isFolder, parent }
    const deleteOverlay = document.getElementById('deleteOverlay');
    const deleteModalTitle = document.getElementById('deleteModalTitle');
    const deleteModalMsg = document.getElementById('deleteModalMsg');
    const deleteCancelBtn = document.getElementById('deleteCancelBtn');
    const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');

    function requestDelete(item, isFolder, parent) {
      deleteCtx = { item, isFolder, parent };
      deleteModalTitle.textContent = `Delete "${item.name}"?`;
      if (isFolder) {
        const { files, folders } = countContents(item);
        const parts = [];
        if (folders) parts.push(`${folders} folder${folders === 1 ? '' : 's'}`);
        if (files) parts.push(`${files} file${files === 1 ? '' : 's'}`);
        deleteModalMsg.textContent = parts.length
          ? `This will delete "${item.name}" and every file inside of it — ${parts.join(' and ')} in total. This can't be undone.`
          : `"${item.name}" is empty. This can't be undone.`;
      } else {
        deleteModalMsg.textContent = `This can't be undone.`;
      }
      deleteOverlay.hidden = false;
      deleteConfirmBtn.focus();
    }
    function closeDeleteModal() {
      deleteOverlay.hidden = true;
      deleteCtx = null;
    }
    deleteCancelBtn.addEventListener('click', closeDeleteModal);
    deleteOverlay.addEventListener('click', e => { if (e.target === deleteOverlay) closeDeleteModal(); });
    deleteConfirmBtn.addEventListener('click', () => {
      if (!deleteCtx) return;
      const { item, isFolder, parent } = deleteCtx;
      const arr = isFolder ? parent.folders : parent.files;
      const idx = arr.findIndex(x => x._id === item._id);
      if (idx !== -1) arr.splice(idx, 1);
      if (selectedId === item._id) selectedId = null;
      // Drops any Forward history that led into the now-deleted folder
      // (or a folder nested inside it) — the current position (Back and
      // everything before it) is always safe, since you can only delete
      // an item that's a direct child of the folder you're looking at,
      // never the folder you're currently looking at itself.
      history = history.slice(0, pointer + 1);
      closeDeleteModal();
      render();
      renderUnitList();
    });

    // ------------------------------------------------------------------
    // Right-click menu (2026-08-26, per Martin's request, originally
    // modeled on his own uploaded Finder context-menu screenshot).
    // **Trimmed down (2026-08-27)** to just the actions this page
    // genuinely supports, then **grown back out the same day** as each
    // one below was made real: Rename and Duplicate (reusing the exact
    // rename-in-place and duplicate logic), Add to Starred (reuses the
    // same `starredIds` set the sidebar's Starred view already reads),
    // Folder Color, Quick Look, Get Info (all new — see their own
    // functions below), and Move to Trash (reusing the
    // same delete-confirmation flow as Backspace/Delete, and — per
    // Martin's request — now only enabled for items the user actually
    // created, not the original teacher-provided course materials).
    // **No longer gated to browse mode** (2026-08-27, per Martin's
    // report that right-click "wont let you right click unless your in a
    // folder") — see `findParentOf()` above and the `contextmenu`
    // listener in `attachDragHandlers` for how every action here now
    // resolves the item's real parent even from Recents/Starred.
    // ------------------------------------------------------------------
    const contextMenu = document.getElementById('contextMenu');
    const FOLDER_TAG_COLORS = ['#ff453a', '#ff9f0a', '#ffd60a', '#32d74b', '#0a84ff', '#bf5af2', '#98989d'];
    // Mixes a hex color toward white by `amt` (0-1) — used to derive the
    // folder icon's lighter top-flap shade from whatever solid color the
    // Folder Color menu sets, the same relationship the two hardcoded
    // blues in the default folder icon already have to each other.
    function lightenHex(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const mix = c => Math.round(c + (255 - c) * amt);
      const r = mix((n >> 16) & 255), g = mix((n >> 8) & 255), b = mix(n & 255);
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    }

    // Clamp to Grid (2026-08-29, per Martin's request) — snaps every
    // free-positioned item in the CURRENT folder to its NEAREST grid cell,
    // rather than clearing `.pos` outright. An earlier version deleted
    // `.pos` entirely, which dropped every dragged item back into default
    // flow order — that could teleport an item clear across the window to
    // wherever it would have landed alphabetically/by-array-order, which
    // isn't what "clean up" should feel like. Real Finder's own "Clean Up"
    // has the same distinction (snap in place vs. "Clean Up By" which
    // re-sorts) — this is the snap-in-place one. `CLAMP_STEP_X`/`_Y` match
    // the tile's own footprint (84px width + the grid's 4px gap = 88;
    // `_Y` reuses the 96px row-height assumption `render()`'s own
    // `maxBottom` calc below already makes when growing the grid's
    // `minHeight` to fit free-positioned tiles). Scoped to the current
    // folder rather than the whole tree, since that's the only layout the
    // user can actually see and judge "did this work" against. Lives in
    // the one shared `buildContextMenu()` below, so it's available from
    // both dropdowns (right-click and the "..." More Options button) for
    // free, same as every other menu item — but unlike the per-item
    // actions around it, it ignores which item was clicked entirely and
    // acts on the whole folder. Snapped positions aren't de-collided
    // against each other — two tiles dragged very close together can snap
    // to the same cell — matching the simple "align, don't re-lay-out"
    // scope Martin asked for rather than a full grid-packing algorithm.
    const CLAMP_STEP_X = 88;
    const CLAMP_STEP_Y = 96;
    function hasFreePositions() {
      const node = currentNode();
      return node.folders.some(f => f.pos) || node.files.some(f => f.pos);
    }
    function clampToGrid() {
      const node = currentNode();
      [...node.folders, ...node.files].forEach(f => {
        if (!f.pos) return;
        f.pos = {
          x: Math.max(0, Math.round(f.pos.x / CLAMP_STEP_X) * CLAMP_STEP_X),
          y: Math.max(0, Math.round(f.pos.y / CLAMP_STEP_Y) * CLAMP_STEP_Y),
        };
      });
      render();
    }

    function cmItem(label, action, opts) {
      opts = opts || {};
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'context-menu-item';
      btn.setAttribute('role', 'menuitem');
      btn.innerHTML = `<span>${label}</span>${opts.chevron ? CM_CHEVRON : ''}`;
      btn.addEventListener('click', () => { closeContextMenu(); if (action) action(); });
      return btn;
    }

    // Finder's own "copy" naming: insert " copy" before the extension for
    // files ("Lab Report #4.pdf" -> "Lab Report #4 copy.pdf"), right at
    // the end of the name for folders — then " copy 2", " copy 3", etc.
    // if that name's already taken by a sibling.
    function duplicateName(name, ext, siblings) {
      let base = name, tail = '';
      if (ext && name.toLowerCase().endsWith('.' + ext.toLowerCase())) {
        base = name.slice(0, name.length - ext.length - 1);
        tail = name.slice(name.length - ext.length - 1);
      }
      let candidate = `${base} copy${tail}`, n = 2;
      while (siblings.some(x => x.name === candidate)) { candidate = `${base} copy ${n}${tail}`; n++; }
      return candidate;
    }
    // Every node in a duplicated folder's whole subtree gets
    // `userCreated: true` — it's now a distinct copy that's yours, not
    // the teacher's original, whatever the original files inside it were
    // (see the Move to Trash gating in buildContextMenu below for why
    // that flag matters).
    function cloneWithNewIds(node) {
      const copy = JSON.parse(JSON.stringify(node));
      delete copy.pos;
      (function reassign(n) {
        n._id = 'n' + (idCounter++);
        n.userCreated = true;
        n.folders.forEach(reassign);
        n.files.forEach(f => { f._id = 'n' + (idCounter++); f.userCreated = true; delete f.pos; });
      })(copy);
      return copy;
    }
    function duplicateItem(item, isFolder, parent) {
      const arr = isFolder ? parent.folders : parent.files;
      const idx = arr.findIndex(x => x._id === item._id);
      if (idx === -1) return;
      const copy = isFolder ? cloneWithNewIds(item) : { ...JSON.parse(JSON.stringify(item)), _id: 'n' + (idCounter++), userCreated: true };
      delete copy.pos;
      copy.name = duplicateName(item.name, isFolder ? null : item.ext, arr);
      arr.splice(idx + 1, 0, copy);
      selectedId = copy._id;
      render();
      renderUnitList();
    }

    // Add to Starred (2026-08-27, per Martin's request) — files only,
    // same scope as the existing Starred quick-access view (which is
    // built from `allFilesFlat()`, so it only ever lists files anyway).
    // Toggles membership in the same `starredIds` set that view already
    // reads, so the change shows up there immediately with no separate
    // "starred" data model needed.
    function toggleStarred(item) {
      if (starredIds.has(item._id)) starredIds.delete(item._id);
      else starredIds.add(item._id);
      render();
    }

    // Quick Look (2026-08-27, per Martin's request — "quick peek shows a
    // popup of whats inside"). A folder's peek lists its immediate
    // contents (not a full recursive tree — a peek, not a full browse);
    // a file's peek is a preview card, since there's no real file
    // content in this mock to actually display.
    const quickLookOverlay = document.getElementById('quickLookOverlay');
    const qlIcon = document.getElementById('qlIcon');
    const qlTitle = document.getElementById('qlTitle');
    const qlSubtitle = document.getElementById('qlSubtitle');
    const qlBody = document.getElementById('qlBody');
    const qlCloseBtn = document.getElementById('qlCloseBtn');
    function qlRow(f, isFolderRow) {
      const row = document.createElement('div');
      row.className = 'ql-row';
      row.innerHTML = `<span class="ql-row-icon">${isFolderRow ? smallFolderIconSVG(f.tagColor) : smallFileIconSVG(f)}</span><span class="ql-row-name">${escapeHtml(f.name)}</span>`;
      return row;
    }
    function openQuickLook(item, isFolder) {
      qlTitle.textContent = item.name;
      qlBody.innerHTML = '';
      if (isFolder) {
        qlIcon.innerHTML = folderIconSVG(item.tagColor);
        const { files, folders } = countContents(item);
        const parts = [];
        if (folders) parts.push(`${folders} folder${folders === 1 ? '' : 's'}`);
        if (files) parts.push(`${files} file${files === 1 ? '' : 's'}`);
        qlSubtitle.textContent = parts.length ? parts.join(', ') : 'Empty folder';
        if (!item.folders.length && !item.files.length) {
          qlBody.innerHTML = '<p class="ql-empty">This folder is empty.</p>';
        } else {
          item.folders.forEach(f => qlBody.appendChild(qlRow(f, true)));
          item.files.forEach(f => qlBody.appendChild(qlRow(f, false)));
        }
      } else {
        qlIcon.innerHTML = fileIconSVG(item);
        // Quiz items have no real `ext` (not a document — see the icon
        // helpers above) and a different "why no preview" reason: not
        // because this mock is missing a viewer, but because a quiz is
        // genuinely taken in Schoology, not previewed here at all.
        qlSubtitle.textContent = item.quiz ? 'Quiz' : `${item.ext.toUpperCase()} Document${item.assignment ? ' · Assignment' : ''}`;
        qlBody.innerHTML = item.quiz
          ? '<p class="ql-empty">Taken in Schoology, not in Schoolagy — open this item for a link over there.</p>'
          : `<p class="ql-empty">Updated ${item.updated || '—'}. No preview available in this mock.</p>`;
      }
      quickLookOverlay.hidden = false;
      qlCloseBtn.focus();
    }
    function closeQuickLook() { quickLookOverlay.hidden = true; }
    qlCloseBtn.addEventListener('click', closeQuickLook);
    quickLookOverlay.addEventListener('click', e => { if (e.target === quickLookOverlay) closeQuickLook(); });

    // Get Info (2026-08-27, per Martin's request — including whether the
    // item is teacher- or student-created).
    const infoOverlay = document.getElementById('infoOverlay');
    const infoTitle = document.getElementById('infoTitle');
    const infoBody = document.getElementById('infoBody');
    const infoCloseBtn = document.getElementById('infoCloseBtn');
    function infoRow(label, valueHtml) {
      return `<div class="info-row"><span class="info-row-label">${label}</span><span class="info-row-value">${valueHtml}</span></div>`;
    }
    function openInfoModal(item, isFolder) {
      infoTitle.textContent = item.name;
      const rows = [infoRow('Kind', isFolder ? 'Folder' : (item.quiz ? 'Quiz' : `${item.ext.toUpperCase()} Document`))];
      if (isFolder) {
        const { files, folders } = countContents(item);
        rows.push(infoRow('Contains', `${folders} folder${folders === 1 ? '' : 's'}, ${files} file${files === 1 ? '' : 's'}`));
      } else if (item.assignment) {
        rows.push(infoRow('Type', 'Assignment'));
      } else if (item.quiz) {
        rows.push(infoRow('Type', 'Taken in Schoology'));
      }
      rows.push(infoRow('Updated', item.updated || '—'));
      // Anything the user made themselves (New Folder, Duplicate) is
      // `userCreated: true`; everything from the original sample data is
      // the teacher-provided course materials this whole page is for —
      // see the Move to Trash gating below for the other place this
      // flag matters.
      const isStudent = !!item.userCreated;
      rows.push(infoRow('Created by', `<span class="info-creator-badge ${isStudent ? 'student' : 'teacher'}">${isStudent ? 'Student (you)' : 'Teacher'}</span>`));
      infoBody.innerHTML = rows.join('');
      infoOverlay.hidden = false;
      infoCloseBtn.focus();
    }
    function closeInfoModal() { infoOverlay.hidden = true; }
    infoCloseBtn.addEventListener('click', closeInfoModal);
    infoOverlay.addEventListener('click', e => { if (e.target === infoOverlay) closeInfoModal(); });

    // Real client-side download (2026-09-03, per Martin's material-types
    // scoping decision: real file preview/editing waits for the Drive/
    // Canva integrations already on the roadmap for Release 1.0.0, but
    // "for now we should just have a download option"). There's no real
    // backend holding actual file bytes in this mock, so this generates a
    // small placeholder text blob and downloads it under the file's real
    // name/extension via a throwaway <a download> link — the download
    // itself genuinely fires (a real Save/Downloads-folder event), only
    // the file's *content* is a stand-in, same honesty convention Quick
    // Look already uses ("No preview available in this mock").
    function downloadPlaceholderFile(item) {
      const content = `${item.name}\n\nThis is a placeholder file from the Schoolagy mockup — no real file content is stored yet.\nReal file delivery is coming with the Drive/Canva integrations (Release 1.0.0).`;
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = item.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Whole-folder download (2026-09-03, per Martin: "Allow users to save
    // the whole folder to their computer") — builds a real .zip client-
    // side via JSZip (loaded from cdnjs, see the <script> tag in <head>),
    // recursing through the folder's own `folders`/`files` tree so the
    // zip's own internal structure matches what's on screen. Each file
    // inside gets the same placeholder-text-blob treatment
    // downloadPlaceholderFile() uses for a single file — the zip itself
    // is completely real and genuinely downloads, only each file's
    // *content* inside it is a stand-in.
    function addFolderToZip(zipFolder, node) {
      (node.files || []).forEach(f => {
        const content = `${f.name}\n\nThis is a placeholder file from the Schoolagy mockup — no real file content is stored yet.\nReal file delivery is coming with the Drive/Canva integrations (Release 1.0.0).`;
        zipFolder.file(f.name, content);
      });
      (node.folders || []).forEach(sub => addFolderToZip(zipFolder.folder(sub.name), sub));
    }
    async function downloadFolderAsZip(folder) {
      // JSZip loads with `defer` from cdnjs — if this sandboxed preview
      // (or any offline browser) can't reach it, there's nothing to zip
      // with. Reuses the existing Get Info overlay for the message rather
      // than a native alert(), so it looks like the rest of this app.
      if (typeof JSZip === 'undefined') {
        infoTitle.textContent = folder.name;
        infoBody.innerHTML = '<p class="info-row-value">Downloading a folder needs an internet connection (to load the zip tool) — try again once you\'re back online.</p>';
        infoOverlay.hidden = false;
        infoCloseBtn.focus();
        return;
      }
      const zip = new JSZip();
      addFolderToZip(zip, folder);
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${folder.name}.zip`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function buildContextMenu(item, isFolder, parent) {
      contextMenu.innerHTML = '';
      const add = el => contextMenu.appendChild(el);
      const divider = () => { const d = document.createElement('div'); d.className = 'context-menu-divider'; add(d); };

      add(cmItem('Quick Look', () => openQuickLook(item, isFolder)));
      // Download — real files only. A folder gets its own "Download
      // Folder" (a real .zip, see downloadFolderAsZip() above — added
      // 2026-09-03 per Martin's "save the whole folder to their
      // computer" request). A quiz item gets neither: it isn't a
      // document at all, it's taken in Schoology (see the redirect
      // notice on assignment.html), so there's nothing here to download.
      if (isFolder) {
        add(cmItem('Download Folder', () => downloadFolderAsZip(item)));
      } else if (!item.quiz) {
        add(cmItem('Download', () => downloadPlaceholderFile(item)));
      }
      add(cmItem('Get Info', () => openInfoModal(item, isFolder)));
      divider();
      add(cmItem('Rename', () => { selectedId = item._id; renamingId = item._id; render(); }));
      add(cmItem('Duplicate', () => duplicateItem(item, isFolder, parent)));
      if (!isFolder) {
        const starred = starredIds.has(item._id);
        add(cmItem(starred ? 'Remove from Starred' : 'Add to Starred', () => toggleStarred(item)));
      }

      // Folder Color (2026-08-27, per Martin's request) — folders only,
      // since a file's icon doesn't have a body fill to recolor. Clicking
      // a swatch sets `item.tagColor` and re-renders; clicking the swatch
      // that's already applied clears it back to the default blue, same
      // toggle-off behavior real Finder tags have. Labeled with an actual
      // word (per Martin's follow-up) rather than just an unlabeled row
      // of dots, so it's clear what the row does at a glance.
      if (isFolder) {
        divider();
        const tagsLabel = document.createElement('div');
        tagsLabel.className = 'context-menu-tags-label';
        tagsLabel.textContent = 'Folder Color';
        add(tagsLabel);
        const tagsRow = document.createElement('div');
        tagsRow.className = 'context-menu-tags';
        FOLDER_TAG_COLORS.forEach(c => {
          const dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'tag-dot' + (item.tagColor === c ? ' active' : '');
          dot.style.background = c;
          dot.setAttribute('aria-label', 'Set folder color');
          dot.setAttribute('aria-pressed', item.tagColor === c ? 'true' : 'false');
          dot.addEventListener('click', () => {
            item.tagColor = item.tagColor === c ? undefined : c;
            closeContextMenu();
            render();
            renderUnitList();
          });
          tagsRow.appendChild(dot);
        });
        add(tagsRow);
      }

      divider();
      // Only meaningful in the real folder actually being shown — Recents/
      // Starred/Assignments have no folder of their own for a position to
      // be relative to (same reasoning `useFreePos` uses when rendering),
      // and there's nothing to do if nothing in this folder has actually
      // been dragged off the grid.
      const canClamp = mode === 'browse' && hasFreePositions();
      const clampBtn = cmItem('Clamp to Grid', () => { if (canClamp) clampToGrid(); });
      clampBtn.disabled = !canClamp;
      if (!canClamp) {
        clampBtn.setAttribute('aria-label', mode === 'browse'
          ? 'Clamp to Grid (nothing has been moved off the grid)'
          : 'Clamp to Grid (only available in a real folder)');
      }
      add(clampBtn);
      divider();
      // Move to Trash (2026-08-27, per Martin's request — "only let them
      // add file to trash if its user created"): disabled for anything
      // from the original teacher-provided sample data, real only for
      // items the user made (New Folder, Duplicate) — see `userCreated`.
      // The Backspace/Delete shortcut gets the same check, below.
      const canTrash = !!item.userCreated;
      const trashBtn = cmItem('Move to Trash', () => { if (canTrash) requestDelete(item, isFolder, parent); });
      trashBtn.disabled = !canTrash;
      if (!canTrash) trashBtn.setAttribute('aria-label', 'Move to Trash (only items you created can be deleted)');
      add(trashBtn);
    }

    function openContextMenu(x, y, item, isFolder, parent) {
      buildContextMenu(item, isFolder, parent);
      contextMenu.hidden = false;
      // Measured after showing so it can be flipped away from the
      // right/bottom edge instead of running off-screen near the
      // window's own borders.
      const rect = contextMenu.getBoundingClientRect();
      const left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
      const top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
      contextMenu.style.left = left + 'px';
      contextMenu.style.top = top + 'px';
    }
    function closeContextMenu() { contextMenu.hidden = true; }
    document.addEventListener('pointerdown', e => {
      if (!contextMenu.hidden && !contextMenu.contains(e.target)) closeContextMenu();
    });
    document.getElementById('itemGrid').addEventListener('contextmenu', e => {
      // Right-clicking open grid space (not an item) — no reference item
      // to build a menu around, so just let it close like any other
      // outside click instead of leaving a stale menu open.
      if (e.target.id === 'itemGrid') closeContextMenu();
    });

    // "More options" toolbar button (2026-08-28, per Martin's request —
    // "make the three dots when clicked on bring down the same dropdown
    // as right clicking but make them only work when a assignment is
    // selected") — opens the exact same `buildContextMenu`/
    // `openContextMenu` a right-click on an item already opens, just
    // anchored under this button instead of at the cursor. **Widened
    // 2026-08-28 (per Martin's request: "make the share and three dot
    // buttons work on every page of the materials hub, not just on the
    // assignment tab") from assignment-files-only to any selected file OR
    // folder** — the original assignment-only gating meant these stayed
    // disabled the moment you selected an ordinary file/folder anywhere
    // outside the Assignments quick-access view, which read as broken
    // rather than intentional. `selectedItem()` below resolves whatever's
    // currently selected (via the whole-tree `findItemById()` above) the
    // same way `findParentOf()` already does for the right-click handler,
    // so this button works identically from any course folder, subfolder,
    // or quick-access view — not just Assignments.
    const moreOptionsBtn = document.getElementById('moreOptionsBtn');
    function selectedItem() {
      return findItemById(selectedId);
    }
    moreOptionsBtn.addEventListener('click', () => {
      const sel = selectedItem();
      if (!sel) return;
      const parent = findParentOf(sel.item._id) || currentNode();
      const rect = moreOptionsBtn.getBoundingClientRect();
      openContextMenu(rect.left, rect.bottom + 4, sel.item, sel.isFolder, parent);
    });

    document.addEventListener('keydown', e => {
      if (!contextMenu.hidden) {
        if (e.key === 'Escape') { e.preventDefault(); closeContextMenu(); }
        return;
      }
      if (!quickLookOverlay.hidden) {
        if (e.key === 'Escape') { e.preventDefault(); closeQuickLook(); }
        return;
      }
      if (!infoOverlay.hidden) {
        if (e.key === 'Escape') { e.preventDefault(); closeInfoModal(); }
        return;
      }
      if (!deleteOverlay.hidden) {
        if (e.key === 'Escape') { e.preventDefault(); closeDeleteModal(); }
        return;
      }
      if (e.key !== 'Backspace' && e.key !== 'Delete') return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; // typing in search or a rename box shouldn't delete anything
      if (!selectedId || renamingId || mode !== 'browse') return;
      const node = currentNode();
      const folderMatch = node.folders.find(x => x._id === selectedId);
      const fileMatch = !folderMatch && node.files.find(x => x._id === selectedId);
      // Only items the user actually created can be deleted this way too
      // (2026-08-27, per Martin's request) — same `userCreated` check as
      // the right-click menu's Move to Trash.
      if (folderMatch && folderMatch.userCreated) { e.preventDefault(); requestDelete(folderMatch, true, node); }
      else if (fileMatch && fileMatch.userCreated) { e.preventDefault(); requestDelete(fileMatch, false, node); }
    });

    document.getElementById('finderBack').addEventListener('click', () => {
      if (pointer > 0) { pointer--; mode = 'browse'; renamingId = null; setActiveSidebar('all'); render(); }
    });
    document.getElementById('finderFwd').addEventListener('click', () => {
      if (pointer < history.length - 1) { pointer++; mode = 'browse'; renamingId = null; setActiveSidebar('all'); render(); }
    });

    document.querySelectorAll('.fs-item[data-quick]').forEach(btn => {
      btn.addEventListener('click', () => {
        // The "All Materials" sidebar item's own data-quick is "all", but
        // every mode check elsewhere in the file (back/forward buttons,
        // drag-and-drop, free positioning, and now the "+" New Folder
        // gating below) tests for the real state name "browse" — using
        // the raw "all" string here left `mode` stuck out of sync with
        // those checks whenever a user returned to All Materials via the
        // sidebar rather than by paging back through folder history
        // (2026-08-28 fix, found while wiring up New Folder's gating).
        const quick = btn.dataset.quick;
        mode = quick === 'all' ? 'browse' : quick;
        renamingId = null;
        setActiveSidebar(quick);
        if (mode === 'browse') { history = [root]; pointer = 0; }
        render();
      });
    });

    document.querySelectorAll('.view-btn[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        view = btn.dataset.view;
        document.querySelectorAll('.view-btn[data-view]').forEach(b => {
          b.classList.toggle('active', b === btn);
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        render();
      });
    });

    const searchInput = document.getElementById('finderSearch');
    const searchClearBtn = document.getElementById('searchClearBtn');
    searchInput.addEventListener('input', () => {
      searchClearBtn.hidden = !searchInput.value;
      render();
    });
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchClearBtn.hidden = true;
      searchInput.focus();
      render();
    });

    // "Aug 6" -> a comparable timestamp, against the same mock year
    // (2026) every other page's sample "due"/"updated" strings assume —
    // only used to sort the Assignments quick-access view soonest-due
    // first, same convention as home.html's Overdue-list sort.
    function parseMockDue(str) {
      return new Date(`${str}, 2026`).getTime();
    }

    function currentItems() {
      if (mode === 'recents') {
        return { folders: [], files: allFilesFlat(root).slice(-8).reverse() };
      }
      if (mode === 'starred') {
        return { folders: [], files: allFilesFlat(root).filter(f => starredIds.has(f._id)) };
      }
      // Assignments (2026-08-28, per Martin's request) — a flat,
      // course-wide list of every file flagged `assignment: true`,
      // regardless of which folder it lives in, same "computed view"
      // idiom Recents/Starred already use. Sorted soonest-due-first so
      // the table reads like a real to-do list rather than tree order.
      if (mode === 'assignments') {
        return { folders: [], files: allFilesFlat(root).filter(f => f.assignment).sort((a, b) => parseMockDue(a.due) - parseMockDue(b.due)) };
      }
      const node = currentNode();
      return { folders: node.folders, files: node.files };
    }

    function matchesSearch(name) {
      const q = searchInput.value.trim().toLowerCase();
      return !q || name.toLowerCase().includes(q);
    }

    // Wraps every occurrence of the current search text inside `name` in
    // a blue <mark>, so a match is visibly obvious rather than just
    // implied by the item surviving the filter (2026-08-26, per Martin's
    // request). Escapes the name first (this was interpolated raw into
    // markup before — piggybacking that fix onto this change rather than
    // leaving the new <mark> tags as the only escaped part of the name).
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function highlightMatch(name) {
      const q = searchInput.value.trim();
      const escaped = escapeHtml(name);
      if (!q) return escaped;
      const escapedQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return escaped.replace(new RegExp(escapedQ, 'ig'), m => `<mark class="search-highlight">${m}</mark>`);
    }

    function render() {
      document.getElementById('finderBack').disabled = pointer === 0 || mode !== 'browse';
      document.getElementById('finderFwd').disabled = pointer >= history.length - 1 || mode !== 'browse';
      document.getElementById('finderTitle').textContent =
        mode === 'recents' ? 'Recents' : mode === 'starred' ? 'Starred' : mode === 'assignments' ? 'Assignments' : currentNode().name;

      // Assignments (2026-08-28) is a table-only view — per Martin's
      // request it never shows as a grid, and the Grid/List toggle
      // itself is hidden while it's active rather than left sitting
      // there pointing at a mode it can't actually switch away from.
      // `effectiveView` (not the underlying `view` state) drives every
      // grid-vs-table decision below, so a user's own Grid/List
      // preference is preserved and restored the moment they leave
      // Assignments for any other quick-access item or folder.
      const inAssignments = mode === 'assignments';
      const effectiveView = inAssignments ? 'list' : view;
      document.getElementById('viewToggleGroup').hidden = inAssignments;
      document.getElementById('listThirdColHeader').textContent = inAssignments ? 'Due' : 'Updated';

      // "+" New folder only makes sense in All Materials (2026-08-28, per
      // Martin's request) — Recents/Starred/Assignments are computed,
      // read-only views over the real tree with no folder of their own to
      // drop a new one into, so the button is greyed out there rather than
      // silently redirecting the user back to All Materials on click.
      const newFolderBtn = document.getElementById('newFolderBtn');
      newFolderBtn.disabled = mode !== 'browse';
      newFolderBtn.setAttribute('aria-label', mode === 'browse' ? 'New folder' : 'New folder (switch to All Materials)');

      // "More options" toolbar button lights up whenever anything is
      // selected — any file or folder, on any page of the Materials hub,
      // not just an assignment in the Assignments view (see the click
      // handler above for the 2026-08-28 widening). Re-checked on every
      // render (not just on click) so it stays in sync as `selectedId`
      // changes from any of the several places that set it (a tile/row
      // click, right-click, etc.).
      const moreBtn = document.getElementById('moreOptionsBtn');
      const sel = selectedItem();
      const selEnabled = !!sel;
      moreBtn.disabled = !selEnabled;
      moreBtn.setAttribute('aria-label', selEnabled ? `More options for ${sel.item.name}` : 'More options (select an item first)');

      const { folders, files } = currentItems();
      const visibleFolders = folders.filter(f => matchesSearch(f.name));
      const visibleFiles = files.filter(f => matchesSearch(f.name));
      const grid = document.getElementById('itemGrid');
      const list = document.getElementById('itemList');
      const listBody = document.getElementById('itemListBody');
      const empty = document.getElementById('emptyState');

      const total = visibleFolders.length + visibleFiles.length;
      empty.hidden = total > 0;
      grid.hidden = effectiveView !== 'grid' || total === 0;
      list.hidden = effectiveView !== 'list' || total === 0;

      // Builds the name span/input shared by both grid tiles and list
      // rows. **The hover-reveal pencil button is gone (2026-08-27, per
      // Martin's request — "remove the pencil icon and let users use
      // rename from there")** — "from there" being the right-click menu's
      // own Rename item (see buildContextMenu below), which sets the same
      // `renamingId` this always read from. Renaming itself is otherwise
      // unchanged: the same in-place `<input>` swap, the same
      // commit/cancel behavior.
      function nameAndEditMarkup(item) {
        if (renamingId === item._id) {
          return `<input type="text" class="item-name-input" value="${item.name.replace(/"/g, '&quot;')}">`;
        }
        return `<span class="item-name">${highlightMatch(item.name)}</span>`;
      }
      function wireNameAndEdit(container, item) {
        if (renamingId === item._id) {
          const input = container.querySelector('.item-name-input');
          bindRenameInput(input, item);
          input.focus();
          input.select();
        }
      }

      if (effectiveView === 'grid') {
        grid.innerHTML = '';
        // A grid tile is a <div role="button"> rather than a real
        // <button> — it needs to contain a rename <input> and a nested
        // pencil <button>, and interactive content can't nest inside a
        // real <button> per the HTML spec (browsers "repair" it by
        // hoisting the nested control out, which broke the pencil
        // icon's position). tabindex + click/keydown handlers keep it
        // keyboard-operable in place of native button semantics.
        //
        // Free positions (`.pos`) only apply in browse mode — Recents and
        // Starred are computed views with no folder of their own for a
        // position to be relative to, and dragging is already disabled
        // there (see attachDragHandlers), so a stray leftover `.pos` from
        // browsing shouldn't be honored if one of these files shows up
        // in one of those lists too.
        const useFreePos = mode === 'browse';
        visibleFolders.forEach(f => {
          const tile = document.createElement('div');
          tile.setAttribute('role', 'button');
          tile.tabIndex = 0;
          tile.dataset.id = f._id;
          tile.dataset.folderTarget = 'true';
          tile.className = 'item-tile' + (selectedId === f._id ? ' selected' : '') + (useFreePos && f.pos ? ' free-pos' : '');
          if (useFreePos && f.pos) { tile.style.left = f.pos.x + 'px'; tile.style.top = f.pos.y + 'px'; }
          tile.innerHTML = `<span class="item-icon">${folderIconSVG(f.tagColor)}</span>${nameAndEditMarkup(f)}`;
          tile.addEventListener('click', () => { if (renamingId !== f._id) { selectedId = f._id; render(); } });
          tile.addEventListener('dblclick', () => openNode(f, true));
          tile.addEventListener('keydown', e => { if (e.key === 'Enter' && renamingId !== f._id) openNode(f, true); });
          attachDragHandlers(tile, f, true);
          grid.appendChild(tile);
          wireNameAndEdit(tile, f);
        });
        visibleFiles.forEach(f => {
          const tile = document.createElement('div');
          tile.setAttribute('role', 'button');
          tile.tabIndex = 0;
          tile.dataset.id = f._id;
          tile.className = 'item-tile' + (selectedId === f._id ? ' selected' : '') + (useFreePos && f.pos ? ' free-pos' : '');
          if (useFreePos && f.pos) { tile.style.left = f.pos.x + 'px'; tile.style.top = f.pos.y + 'px'; }
          tile.innerHTML = `<span class="item-icon">${fileIconSVG(f)}</span>${nameAndEditMarkup(f)}${starBadgeMarkup(f)}`;
          tile.addEventListener('click', () => { if (renamingId !== f._id) { selectedId = f._id; render(); } });
          // Assignment-flagged files open their own detail page (added
          // 2026-08-29, so this page's Assignments quick-access view and
          // the app-level assignments.html both lead somewhere real);
          // plain course-material files still just select, same as ever.
          // Quiz items (2026-09-03) route the same way — assignment.html
          // is exactly where the "taken in Schoology" redirect notice
          // already lives, so a quiz material here should land on it too
          // rather than needing its own separate destination.
          if (f.assignment || f.quiz) {
            tile.addEventListener('dblclick', () => openAssignmentDetail(f));
            tile.addEventListener('keydown', e => { if (e.key === 'Enter' && renamingId !== f._id) openAssignmentDetail(f); });
          }
          attachDragHandlers(tile, f, false);
          grid.appendChild(tile);
          wireNameAndEdit(tile, f);
        });
        // Grow the grid's own box to actually wrap any free-positioned
        // tiles instead of leaving it sized to just the in-flow rows —
        // otherwise the container visually ends above tiles dropped
        // further down the page even though they're still there.
        if (useFreePos) {
          const maxBottom = [...visibleFolders, ...visibleFiles]
            .reduce((m, f) => f.pos ? Math.max(m, f.pos.y + 96) : m, 0);
          grid.style.minHeight = Math.max(40, maxBottom + 12) + 'px';
        } else {
          grid.style.minHeight = '';
        }
      } else {
        listBody.innerHTML = '';
        visibleFolders.forEach(f => {
          const tr = document.createElement('tr');
          tr.dataset.id = f._id;
          tr.dataset.folderTarget = 'true';
          tr.className = selectedId === f._id ? 'selected' : '';
          tr.innerHTML = `<td class="name-cell"><span class="item-icon">${smallFolderIconSVG(f.tagColor)}</span>${nameAndEditMarkup(f)}</td><td class="kind-cell">Folder</td><td class="size-cell">—</td>`;
          tr.addEventListener('click', () => { if (renamingId !== f._id) { selectedId = f._id; render(); } });
          tr.addEventListener('dblclick', () => openNode(f, true));
          attachDragHandlers(tr, f, true);
          listBody.appendChild(tr);
          wireNameAndEdit(tr, f);
        });
        visibleFiles.forEach(f => {
          const tr = document.createElement('tr');
          tr.dataset.id = f._id;
          tr.className = selectedId === f._id ? 'selected' : '';
          const kindLabel = f.quiz ? 'Quiz' : `${f.ext.toUpperCase()} Document${f.assignment ? ' · Assignment' : ''}`;
          tr.innerHTML = `<td class="name-cell"><span class="item-icon">${smallFileIconSVG(f)}</span>${nameAndEditMarkup(f)}${starBadgeMarkup(f)}</td><td class="kind-cell">${kindLabel}</td><td class="size-cell">${inAssignments ? (f.due || '—') : (f.updated || '—')}</td>`;
          tr.addEventListener('click', () => { if (renamingId !== f._id) { selectedId = f._id; render(); } });
          if (f.assignment || f.quiz) tr.addEventListener('dblclick', () => openAssignmentDetail(f));
          attachDragHandlers(tr, f, false);
          listBody.appendChild(tr);
          wireNameAndEdit(tr, f);
        });
      }
    }

    renderUnitList();
    render();

    // ------------------------------------------------------------------
    // Bottom app nav — same behavior as course-home.html (Home/Courses
    // are real links, the rest stay visual-only placeholders).
    // ------------------------------------------------------------------
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });
  </script>
</body>
</html>
