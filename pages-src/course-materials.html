<style>
  /* ---------- Shared design system — copied verbatim from course-home.html
     so this page reads as the same app. See architecture-decisions.md re:
     promoting this to a real shared stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --course-color: #a67a22;
    --course-color-dark: #8a6519;
    --course-color-tint: rgba(166, 122, 34, 0.14);
  }

  /* Finder-window palette (2026-08-28: unified with the rest of the app —
     see below) — every --finder-* token is now a direct reference to the
     same global tokens the rest of this page (and Home/Courses/the Course
     Hub) already use, rather than its own separate set of hardcoded
     values. `--finder-selected`/`--finder-icon-*` are the only tokens
     that don't map onto an existing global one-for-one, since selection
     highlighting and paper-icon rendering aren't really "chrome" — kept
     as their own small, self-contained values (still deriving from
     --accent/--border where that makes sense) rather than forcing a
     global token to do a job it isn't really for. Still scoped to
     `.finder-window` (not :root) purely so it's easy to find/read as one
     block, not because the values themselves differ from :root anymore. */
  .finder-window {
    --finder-bg: var(--panel-bg);
    --finder-titlebar-bg: var(--panel-inner);
    --finder-sidebar-bg: var(--panel-inner);
    --finder-border: var(--border);
    --finder-text: var(--text-dark);
    --finder-text-muted: var(--text-muted);
    --finder-hover: var(--panel-bg);
    --finder-selected: rgb(from var(--accent) r g b / 0.16);
    --finder-icon-page: #ffffff;
    --finder-icon-fold: var(--panel-inner);
    --finder-icon-border: var(--border);
    --finder-control-bg: var(--panel-inner);
    --finder-control-active-bg: var(--panel-bg);
    --finder-control-active-text: var(--text-dark);
    --finder-disabled: var(--text-faint);
    --finder-icon-ink: var(--text-faint);
  }
  /* A per-page dark/white mode toggle used to live here (2026-08-26) but
     was removed 2026-08-28: several of this page's popups (Get Info,
     Share, the delete confirmation) intentionally use the app's global
     panel tokens rather than these --finder-* ones, so they always
     rendered light even with the toggle set to dark — reading as a bug
     rather than the deliberate "system dialogs look the same in either
     Finder theme" choice it actually was. Per Martin's decision, this
     page no longer offers its own theme switch. **Then unified with the
     rest of the site's theme (2026-08-28, same-day follow-up)**: rather
     than leave the Finder chrome's colors as its own separate palette
     that merely happened to resemble the app's light theme, every
     --finder-* token above now points straight at the same --panel-bg/
     --text-dark/--border/etc. tokens the rest of the app (and this
     page's own popups) already use — so Materials isn't a visually
     distinct "file browser surface" anymore, it's the same surface as
     the rest of the site. This also means it's future-proofed for real
     app-wide dark mode: whenever a Settings page exists and actually
     swaps those global tokens (the same way onboarding.html's preview
     toggle already does for its own page), Materials will pick up the
     change automatically through this same variable chain, with no
     Materials-specific dark-mode work needed later — see
     architecture-decisions.md.  */

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .page {
    width: 100%;
    max-width: 1120px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- .finder-window
      grows to its natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar — same .back-link convention as course-home.html's
     "‹ All Courses" breadcrumb. ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 14px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  /* ---------- Finder-style window ---------- */
  .finder-window {
    background: var(--finder-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    /* Grows to its natural content height; display:flex/column so
       .finder-titlebar stays a fixed-height strip above .finder-body. */
    display: flex;
    flex-direction: column;
  }

  .finder-titlebar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--finder-titlebar-bg);
    border-bottom: 1px solid var(--finder-border);
  }
  .finder-nav-btns { display: flex; gap: 2px; }
  .finder-chevron {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--finder-text-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .finder-chevron:hover:not(:disabled) { background: var(--finder-hover); color: var(--finder-text); }
  .finder-chevron:disabled { color: var(--finder-disabled); cursor: default; }
  .finder-chevron svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .finder-chevron:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-title { font-weight: 800; font-size: 0.92rem; color: var(--finder-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .finder-toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .view-toggle { display: flex; background: var(--finder-control-bg); border-radius: 8px; padding: 2px; }
  /* Same equal-specificity gotcha as .edit-fab[hidden] elsewhere in this
     mock: a plain `.view-toggle { display: flex }` class rule and the
     browser's own `[hidden] { display: none }` rule tie on specificity,
     so without this override the later-declared `display: flex` above
     would win and the group would stay visibly flexed even with its
     `hidden` attribute set (2026-08-28, caught while hiding this group
     for the Assignments quick-access view — see below). */
  .view-toggle[hidden] { display: none; }
  .view-btn {
    width: 28px; height: 24px;
    border: none; background: none;
    color: var(--finder-text-muted);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .view-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .view-btn:hover:not(:disabled) { color: var(--finder-text); }
  .view-btn.active { background: var(--finder-control-active-bg); color: var(--finder-control-active-text); }
  .view-btn:disabled { color: var(--finder-disabled); cursor: default; }
  .view-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-icon-btn {
    width: 26px; height: 26px;
    border: none; background: none;
    color: var(--finder-text-muted);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .finder-icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .finder-icon-btn:hover:not(:disabled) { background: var(--finder-hover); color: var(--finder-text); }
  .finder-icon-btn.active { background: var(--finder-control-active-bg); color: var(--finder-control-active-text); }
  .finder-icon-btn:disabled { color: var(--finder-disabled); cursor: default; }

  .finder-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-search-wrap {
    display: flex; align-items: center; gap: 6px;
    background: var(--finder-control-bg);
    border-radius: 8px;
    padding: 5px 10px;
    width: 150px;
  }
  .finder-search-wrap svg { width: 13px; height: 13px; stroke: var(--finder-text-muted); fill: none; stroke-width: 2; flex-shrink: 0; }
  .finder-search-wrap input {
    background: none; border: none; outline: none;
    color: var(--finder-text);
    font-family: inherit; font-size: 0.76rem;
    width: 100%;
  }
  .finder-search-wrap input::placeholder { color: var(--finder-text-muted); }
  /* The browser's own native "clear search" X (from type="search") comes
     out a faint, semi-transparent gray that doesn't match anything else
     in this UI — hidden here in favor of a custom button below so its
     color is deliberate and consistent instead of whatever the browser
     defaults to. */
  input[type="search"]::-webkit-search-cancel-button { display: none; -webkit-appearance: none; }
  .search-clear-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 14px; height: 14px;
    padding: 0;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--finder-text-muted);
    flex-shrink: 0;
  }
  .search-clear-btn svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .search-clear-btn:hover { color: var(--finder-text); }
  .search-clear-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 3px; }
  /* Search-match highlighting (2026-08-26, per Martin's request) — every
     occurrence of the current search text inside a visible item's name
     gets wrapped in this, so it's obvious at a glance *why* an item
     matched, not just that it did. Blue is deliberately not var(--accent)
     (which is this app's warm orange/red) — it reads as a distinct
     "search hit" marker the same way find-in-page highlighting does in
     most browsers/editors, rather than looking like a selection state. */
  mark.search-highlight {
    background: #2f7dfa;
    color: #fff;
    border-radius: 2px;
    padding: 0 1px;
  }

  /* Right-click item menu (2026-08-26) — modeled on Martin's own Finder
     screenshot; uses --finder-* tokens (see comment on the markup) so it
     matches whichever theme the window is currently in. */
  .context-menu {
    position: fixed;
    z-index: 250;
    min-width: 226px;
    background: var(--finder-bg);
    border: 1px solid var(--finder-border);
    border-radius: 10px;
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.55);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .context-menu[hidden] { display: none; }
  .context-menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--finder-text);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .context-menu-item:hover, .context-menu-item:focus-visible { background: var(--accent); color: #fff; outline: none; }
  .context-menu-item .cm-chevron { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; flex-shrink: 0; }
  /* Move to Trash when the item isn't user-created (2026-08-27) — reads
     as unavailable rather than just missing, so it's still discoverable
     as "this exists but isn't allowed here" instead of silently absent. */
  .context-menu-item:disabled { color: var(--finder-text-muted); cursor: default; opacity: 0.55; }
  .context-menu-item:disabled:hover, .context-menu-item:disabled:focus-visible { background: none; color: var(--finder-text-muted); }
  .context-menu-divider { height: 1px; background: var(--finder-border); margin: 5px 4px; flex-shrink: 0; }
  .context-menu-tags-label { padding: 4px 10px 2px; font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--finder-text-muted); }
  .context-menu-tags { display: flex; justify-content: center; gap: 7px; padding: 6px 10px 8px; }
  .context-menu-tags .tag-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); padding: 0; cursor: pointer; }
  .context-menu-tags .tag-dot:hover, .context-menu-tags .tag-dot:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Marks whichever swatch is the folder's current color (2026-08-27) —
     a ring outside the dot rather than an inner checkmark, so it stays
     legible against every swatch color including the lightest (yellow). */
  .context-menu-tags .tag-dot.active { box-shadow: 0 0 0 2px var(--finder-bg), 0 0 0 4px var(--finder-text); }

  .finder-body { display: flex; align-items: stretch; }

  .finder-sidebar {
    width: 190px;
    flex-shrink: 0;
    background: var(--finder-sidebar-bg);
    border-right: 1px solid var(--finder-border);
    padding: 14px 10px;
  }
  .fs-heading {
    font-size: 0.64rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--finder-text-muted);
    margin: 14px 8px 6px;
  }
  .fs-heading:first-child { margin-top: 2px; }
  .fs-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: none;
    border: none;
    color: var(--finder-text-muted);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
    text-align: left;
  }
  .fs-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
  .fs-item:hover { background: var(--finder-hover); color: var(--finder-text); }
  .fs-item.active { background: var(--accent); color: #fff; }
  .fs-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .finder-content { flex: 1; padding: 18px 20px; }
  .finder-empty { color: var(--finder-text-muted); font-size: 0.82rem; padding: 30px 4px; text-align: center; }

  /* Grid view */
  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    grid-auto-rows: min-content;
    align-content: start;
    gap: 4px;
    position: relative; /* anchors free-positioned tiles below */
    min-height: 40px;
  }
  /* Free-drop-anywhere (2026-08-26, per Martin's request) — dragging a
     tile and releasing it over empty space (not onto a folder) drops it
     exactly there, like real Finder icon view, instead of only snapping
     back to its old spot or being confined to a thin band near its
     original row. `.free-drop-active` is a live "you can drop here"
     outline shown on the whole content pane while dragging over open
     space, so the affordance doesn't just appear silently on drop — it's
     on `.finder-content` rather than `.item-grid` so it covers the full
     droppable area, not just however tall the grid's in-flow rows are. */
  .finder-content.free-drop-active { outline: 2px dashed var(--accent); outline-offset: -3px; border-radius: 8px; }
  .item-tile.free-pos { position: absolute; width: 84px; z-index: 4; }
  .item-tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 4px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: none;
    cursor: pointer;
    font-family: inherit;
    color: var(--finder-text);
  }
  .item-tile:hover { background: var(--finder-hover); }
  .item-tile.selected { background: var(--finder-selected); border-color: rgb(from var(--accent) r g b / 0.5); }
  .item-tile:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  /* Drag-over state — a folder tile currently under a dragged item, so
     dropping reads as "into this folder" rather than "reorder near it". */
  .item-tile.drop-target { background: var(--finder-selected); box-shadow: 0 0 0 2px var(--accent) inset; }
  .item-tile.dragging { opacity: 0.35; }
  .item-icon { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; }
  .item-icon svg { width: 100%; height: 100%; }
  .item-name { font-size: 0.7rem; font-weight: 600; text-align: center; line-height: 1.25; word-break: break-word; }
  .item-name-input {
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 600;
    text-align: center;
    width: 100%;
    background: var(--finder-bg);
    color: var(--finder-text);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 1px 3px;
  }
  .file-badge {
    font-size: 0.5rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    color: #fff;
    border-radius: 3px;
    padding: 1px 3px;
  }
  /* Starred badge (2026-08-27, per Martin's "add to starred" request) —
     top-right corner of a grid tile (the spot the rename pencil used to
     occupy, now free since that button was removed), inline after the
     name in list view. */
  .item-star-badge { position: absolute; top: 2px; right: 2px; width: 15px; height: 15px; color: #f2b400; pointer-events: none; }
  .item-star-badge svg { width: 100%; height: 100%; fill: currentColor; }
  .item-list .item-star-badge { position: static; display: inline-block; width: 12px; height: 12px; margin-left: 6px; vertical-align: middle; }
  /* List view */
  .item-list { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  .item-list thead th {
    text-align: left;
    font-size: 0.62rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--finder-text-muted);
    padding: 4px 8px 8px;
    border-bottom: 1px solid var(--finder-border);
  }
  .item-list tbody tr {
    cursor: pointer;
    border-radius: 6px;
  }
  .item-list tbody tr:hover { background: var(--finder-hover); }
  .item-list tbody tr.selected { background: var(--finder-selected); }
  .item-list tbody tr.drop-target { background: var(--finder-selected); box-shadow: 0 0 0 2px var(--accent) inset; }
  .item-list tbody tr.dragging { opacity: 0.35; }
  .item-list td { padding: 6px 8px; color: var(--finder-text); vertical-align: middle; }
  .item-list .name-cell { display: flex; align-items: center; gap: 8px; }
  .item-list .name-cell .item-icon { width: 20px; height: 20px; }
  .item-list .kind-cell, .item-list .size-cell { color: var(--finder-text-muted); }
  .item-grid[hidden], .item-list[hidden] { display: none; }

  /* Drag-over highlight for sidebar drop targets (Course Folders items
     and "All Materials", so a dragged item can be filed into a folder
     — or moved back to the root — without opening it first). */
  .fs-item.drop-target { background: var(--accent); color: #fff; }

  /* Ghost element that follows the pointer during a drag — built fresh
     per drag rather than using native HTML5 DnD, per the same
     reliability/touch-support reasoning documented for the Courses
     page's reorder tool in architecture-decisions.md. */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    opacity: 0.9;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 70px;
    transform: translate(-50%, -50%);
  }
  .drag-ghost .item-icon { width: 34px; height: 34px; }
  .drag-ghost .item-name { font-size: 0.66rem; font-weight: 700; color: #fff; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  /* Delete confirmation (2026-08-26) — sits outside .finder-window, so it
     uses the app's own global panel tokens (same convention as the
     Course Hub's "Course info" modal) rather than --finder-* — a system
     dialog like this isn't really part of the Finder chrome, and this
     way it looks the same regardless of the page's light/dark toggle. */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 6, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 200;
  }
  .confirm-overlay[hidden] { display: none; }
  .confirm-modal {
    background: var(--panel-bg);
    color: var(--text-dark);
    border-radius: var(--window-radius-md);
    padding: 22px;
    width: min(360px, 100%);
    box-shadow: 0 24px 60px -12px rgba(0,0,0,0.55);
  }
  .confirm-modal h3 { margin: 0 0 8px; font-size: 1.02rem; }
  .confirm-modal p { margin: 0 0 20px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.45; }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .confirm-btn { font-family: inherit; font-size: 0.8rem; font-weight: 700; padding: 9px 16px; border-radius: 9px; border: none; cursor: pointer; }
  .confirm-btn-secondary { background: var(--panel-inner); color: var(--text-dark); }
  .confirm-btn-secondary:hover { background: var(--border); }
  .confirm-btn-danger { background: #d1373c; color: #fff; }
  .confirm-btn-danger:hover { background: #b52e33; }
  .confirm-btn-primary { background: var(--accent); color: #fff; }
  .confirm-btn-primary:hover { filter: brightness(1.08); }
  .confirm-btn:disabled { opacity: 0.5; cursor: default; }
  .confirm-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }

  /* Quick Look (2026-08-27, per Martin's request — "quick peek shows a
     popup of whats inside"). A folder's peek lists its immediate
     contents; a file's peek is a preview card, since there's no real
     file content in this mock to actually display. */
  .quicklook-modal { width: min(400px, 100%); }
  .ql-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .ql-icon { width: 40px; height: 40px; flex-shrink: 0; }
  .ql-icon svg { width: 100%; height: 100%; }
  .ql-header h3 { margin: 0; font-size: 0.98rem; word-break: break-word; }
  .ql-subtitle { margin: 2px 0 0; font-size: 0.76rem; color: var(--text-muted); }
  .ql-close { margin-left: auto; flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; border: none; background: var(--panel-inner); color: var(--text-muted); font-size: 1rem; line-height: 1; cursor: pointer; }
  .ql-close:hover { background: var(--border); }
  .ql-body { max-height: 260px; overflow-y: auto; }
  .ql-empty { font-size: 0.8rem; color: var(--text-muted); padding: 8px 0; }
  .ql-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; color: var(--text-dark); }
  .ql-row:last-child { border-bottom: none; }
  .ql-row .ql-row-icon { width: 22px; height: 22px; flex-shrink: 0; }
  .ql-row .ql-row-icon svg { width: 100%; height: 100%; }
  .ql-row-name { flex: 1; word-break: break-word; }

  /* Get Info (2026-08-27, per Martin's request — including a Teacher/
     Student "created by" line). */
  .info-body { margin-bottom: 18px; }
  .info-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; }
  .info-row:last-child { border-bottom: none; }
  .info-row-label { color: var(--text-muted); }
  .info-row-value { color: var(--text-dark); font-weight: 600; text-align: right; }
  .info-creator-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
  .info-creator-badge.teacher { background: rgb(from var(--accent) r g b / 0.16); color: var(--accent); }
  .info-creator-badge.student { background: rgba(50, 160, 90, 0.16); color: #2e9e5b; }

  @media (max-width: 640px) {
    .finder-body { flex-direction: column; }
    .finder-sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--finder-border); display: flex; flex-wrap: wrap; gap: 4px; }
    .fs-heading { display: none; }
    /* The titlebar's icon-button row plus a fixed-width search box never
       fit on one line on a phone-size screen — past a certain width the
       row just ran out of horizontal space and got clipped by
       .finder-window's own overflow:hidden, cutting the search box off
       instead of shrinking it. Wrapping the toolbar onto its own line and
       letting the search box fill it (rather than pinning it to a tiny
       fixed width) fixes both the clipping and the cramped input. */
    .finder-titlebar { flex-wrap: wrap; row-gap: 8px; }
    .finder-title { min-width: 0; }
    .finder-toolbar { margin-left: 0; width: 100%; flex-wrap: wrap; row-gap: 8px; justify-content: flex-end; }
    .finder-search-wrap { width: 100%; flex: 1 1 100%; }
  }

  /* ---------- Bottom nav — permanently visible, copied verbatim from
     course-home.html so navigation stays consistent across pages. ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    padding: 0 20px max(20px, env(safe-area-inset-bottom));
    z-index: 10;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }
  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
</style>
</head>
<body>
  <div class="page">
    <button class="back-link" type="button" id="backToHubBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Course Hub
    </button>

    <div class="finder-window">
      <div class="finder-titlebar">
