<style>
  /* ---------- Shared design system — copied verbatim from home.html /
     courses.html so this page reads as the same app. See
     architecture-decisions.md re: promoting this to a real shared
     stylesheet once there's a build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    /* Set per-course at load (see JS setCourseVars) — everything specific
       to "whose hub this is" (banner, active nav, grade hero, calendar
       dots, assignment ticks) reads from these two instead of a fixed
       color, so the same page serves any of the six sample courses via
       ?course=. */
    --course-color: #a67a22;
    --course-color-dark: #8a6519;
    --course-color-tint: rgba(166, 122, 34, 0.14);
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .page {
    width: 100%;
    max-width: 1120px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- the hub cards
      grow to their natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar ---------- */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 6px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 18px;
  }

  .title-wrap { min-width: 0; }
  h1.title {
    color: #ffffff;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
    border-bottom: 3px solid var(--course-color);
    padding-bottom: 3px;
  }
  .subtitle {
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    font-style: italic;
    font-size: 0.85rem;
    margin: 5px 0 0 2px;
  }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- Card shell, same as every other page ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    padding: 6px;
  }
  .card-inner {
    padding: 20px 22px;
  }
  .card h2 {
    font-size: 0.92rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0 0 12px;
  }

  /* ---------- Hub layout: sidebar / grade+calendar / assignments ---------- */
  /* Each column just takes its own natural content height; .page (above)
     scrolls as a whole when the stack runs taller than the viewport. */
  .hub-grid {
    display: grid;
    grid-template-columns: 208px 1fr 300px;
    gap: 18px;
    align-items: start;
  }
  .hub-middle, .hub-right { display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Sidebar: banner + course nav ---------- */
  .course-banner {
    position: relative;
    border-radius: var(--window-radius-lg);
    padding: 16px 14px 14px;
    min-height: 128px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background: linear-gradient(155deg, var(--course-color) 0%, var(--course-color-dark) 100%);
    box-shadow: 0 20px 40px -18px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .course-banner::before {
    content: '';
    position: absolute;
    top: -30%; right: -20%;
    width: 70%; height: 140%;
    background: rgba(255,255,255,0.12);
    transform: rotate(18deg);
  }
  .banner-icon {
    width: 30px; height: 30px;
    color: rgba(255,255,255,0.9);
    margin-bottom: 8px;
  }
  .banner-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .banner-name { color: #fff; font-weight: 800; font-size: 1rem; font-style: italic; line-height: 1.15; position: relative; }
  .banner-code { color: rgba(255,255,255,0.78); font-weight: 700; font-size: 0.68rem; margin-top: 3px; position: relative; }
  .banner-info-btn {
    position: absolute;
    top: 10px; right: 10px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-weight: 800;
    font-size: 0.72rem;
    font-style: normal;
  }
  .banner-info-btn:hover { background: rgba(255,255,255,0.34); }
  .banner-info-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .course-nav { margin-top: 12px; background: var(--panel-bg); border-radius: var(--window-radius-lg); box-shadow: 0 20px 40px -18px rgba(0,0,0,0.4); padding: 8px; }
  .course-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    padding: 10px 10px;
    font-family: inherit;
    font-weight: 800;
    font-style: italic;
    font-size: 0.85rem;
    color: var(--text-muted);
    cursor: pointer;
    text-align: left;
  }
  .course-nav-item svg { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .course-nav-item:hover { background: var(--panel-inner); color: var(--text-dark); }
  /* Full ring around the whole item (not just a left accent bar) — a
     box-shadow rather than a real border so it can't shift layout or
     get clipped into a partial "bracket" shape by the item's own
     border-radius the way a one-sided border does. Same ring idiom the
     calendar's .cal-day.today uses below. */
  .course-nav-item.active {
    background: var(--course-color-tint);
    color: var(--text-dark);
    box-shadow: 0 0 0 2px var(--course-color) inset;
  }
  .course-nav-item.active svg { color: var(--course-color); }
  .course-nav-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring) inset; }

  /* ---------- Grade hero ---------- */
  .grade-hero-row { display: flex; align-items: stretch; gap: 14px; }
  .grade-hero-block { flex: 1; background: var(--panel-inner); border-radius: var(--window-radius-md); padding: 14px 16px; }
  .grade-hero-label { font-size: 0.64rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 0 0 4px; }
  .grade-hero-val { font-size: 1.9rem; font-weight: 900; line-height: 1; }
  .grade-hero-val.good { color: var(--grade-good); }
  .grade-hero-val.mid { color: var(--grade-mid); }
  .grade-hero-val.bad { color: var(--grade-bad); }
  .grade-hero-pct { font-size: 0.78rem; font-weight: 700; color: var(--text-faint); margin-left: 6px; }
  .grade-hero-predicted { cursor: help; }
  .grade-hero-predicted:hover, .grade-hero-predicted:focus-visible { filter: brightness(0.96); }
  .grade-hero-predicted:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .grade-hero-trend { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; }
  .grade-hero-trend .arrow { width: 13px; display: inline-flex; justify-content: center; font-size: 1rem; }
  .grade-hero-trend.up .arrow { color: var(--grade-good); }
  .grade-hero-trend.down .arrow { color: var(--grade-bad); }
  .grade-hero-trend.flat .arrow { color: var(--text-faint); }
  .grade-hero-updated { font-size: 0.7rem; color: var(--text-faint); margin-top: 10px; text-align: right; }

  /* ---------- Predicted-grade popup — same component as courses.html ---------- */
  .grade-popup {
    position: fixed;
    z-index: 50;
    width: 272px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 22px 48px -16px rgba(0,0,0,0.5);
    padding: 14px 16px 10px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.12s ease, transform 0.12s ease;
    pointer-events: none;
  }
  .grade-popup.show { opacity: 1; visibility: visible; transform: translateY(0); pointer-events: auto; }
  .grade-popup h3 { margin: 0 0 2px; font-size: 0.82rem; font-weight: 800; color: var(--text-dark); }
  .grade-popup .popup-sub { font-size: 0.7rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.4; }
  .grade-popup .popup-sub strong { color: var(--text-dark); }
  .grade-popup svg { display: block; overflow: visible; }
  .grade-popup .popup-foot { font-size: 0.62rem; color: var(--text-faint); margin: 6px 0 0; text-align: right; font-style: italic; }
  @media (prefers-reduced-motion: reduce) { .grade-popup { transition: none; } }

  /* ---------- Calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .cal-month { font-size: 0.8rem; font-weight: 800; color: var(--text-muted); min-width: 96px; text-align: center; }
  .cal-nav-btn {
    background: var(--panel-inner);
    border: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    color: var(--text-muted);
    font-weight: 800;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .cal-nav-btn:hover { color: var(--text-dark); background: var(--course-color-tint); }
  .cal-nav-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 0.6rem; font-weight: 800; color: var(--text-faint); text-transform: uppercase; padding-bottom: 4px; }
  .cal-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: var(--window-radius-sm);
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--text-dark);
    cursor: pointer;
  }
  .cal-day.pad { visibility: hidden; cursor: default; }
  .cal-day:hover { background: var(--panel-inner); }
  .cal-day.today { box-shadow: 0 0 0 2px var(--course-color) inset; }
  .cal-day.selected { background: var(--accent); color: #fff; }
  .cal-day .dot { width: 14px; height: 3px; border-radius: 2px; background: var(--course-color); margin-top: 2px; }
  .cal-day.selected .dot { background: #fff; }
  .cal-day:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .cal-selected-info {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .cal-selected-date { font-size: 0.7rem; font-weight: 800; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px; }
  .cal-selected-item { display: flex; align-items: baseline; gap: 8px; font-size: 0.78rem; padding: 4px 0; }
  .cal-selected-item .type { font-size: 0.62rem; font-weight: 800; text-transform: uppercase; color: var(--text-faint); }
  .cal-selected-item .name { font-weight: 700; color: var(--text-dark); flex: 1; min-width: 0; }
  .cal-selected-empty { font-size: 0.78rem; color: var(--text-faint); font-style: italic; }

  /* ---------- Assignment list ---------- */
  .assign-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .assign-filter {
    background: var(--panel-inner);
    border: none;
    border-radius: 999px;
    padding: 5px 11px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.68rem;
    color: var(--text-muted);
    cursor: pointer;
  }
  .assign-filter:hover { color: var(--text-dark); }
  .assign-filter.active { background: var(--course-color); color: #fff; }
  .assign-filter:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  .assign-group-label { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 14px 0 2px; }
  .assign-group-label:first-child { margin-top: 0; }
  .hub-assign-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .hub-assign-item:last-child { border-bottom: none; }
  .hub-assign-tick { width: 4px; align-self: stretch; min-height: 32px; border-radius: 999px; flex-shrink: 0; background: var(--text-faint); }
  .hub-assign-item.overdue .hub-assign-tick { background: var(--grade-bad); }
  .hub-assign-item.graded .hub-assign-tick { background: var(--grade-good); }
  .hub-assign-item.upcoming .hub-assign-tick { background: var(--course-color); }
  .hub-assign-text { flex: 1; min-width: 0; }
  .hub-assign-title { font-weight: 700; font-size: 0.82rem; color: var(--text-dark); margin: 0; }
  .hub-assign-meta { font-size: 0.7rem; color: var(--text-muted); margin: 1px 0 0; }
  .hub-assign-meta .type { text-transform: uppercase; letter-spacing: 0.03em; font-weight: 800; color: var(--text-faint); }
  .hub-assign-due { font-size: 0.72rem; font-weight: 700; color: var(--text-faint); white-space: nowrap; text-align: right; flex-shrink: 0; }
  .hub-assign-item.overdue .hub-assign-due { color: var(--grade-bad); }
  .hub-assign-item.graded .hub-assign-due { color: var(--grade-good); }
  .assign-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 10px 0; }

  /* ---------- Announcements widget — new card in the middle column,
     above Current + Predicted Grade, since teacher posts are the most
     time-sensitive thing on a course hub. (The sidebar used to also
     have an "Updates" sub-nav tab this widget was meant to stay
     distinct from — that tab was removed 2026-08-28 per Martin's
     request, so this widget is now the only "recent activity" surface
     on the Home tab.) Pinned posts float to the top; clicking a post
     marks it read and clears its dot, same lightweight interaction as
     the rest of this mock (no backend). */
  .announce-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .announce-head-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .announce-count {
    background: var(--course-color);
    color: #fff;
    font-size: 0.62rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    line-height: 1.3;
    flex-shrink: 0;
  }
  .announce-see-all {
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.72rem;
    color: var(--course-color);
    cursor: pointer;
    padding: 0;
  }
  .announce-see-all:hover { color: var(--course-color-dark); text-decoration: underline; }
  .announce-see-all:focus-visible { outline: none; text-decoration: underline; }
  .announce-see-all[hidden] { display: none; }
  /* Modal reuses the same .modal-overlay/.modal-box "course info" popup
     component below — dark full-page backdrop, click on the backdrop
     (not the box) closes it, Escape closes it. This is the standing
     popup convention for the whole app now (see architecture-decisions
     .md): a popup darkens everything else so the popup itself reads as
     the brightest thing on screen, and a click anywhere outside the
     popup box dismisses it. Only new pieces here are the wider box and
     a scrollable list, since the default .modal-box isn't built to hold
     an arbitrarily long list. */
  .modal-box.announce-modal-box { max-width: 440px; }
  .announce-modal-list { max-height: 60vh; overflow-y: auto; margin: 8px -4px 0; padding: 0 4px 2px; }
  .announce-item { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; font: inherit; }
  .announce-item:last-child { border-bottom: none; }
  .announce-item:hover .announce-text { color: var(--text-dark); }
  .announce-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: var(--window-radius-sm); }
  .announce-item-head { display: flex; align-items: center; gap: 8px; }
  .announce-avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--course-color);
    color: #fff;
    font-weight: 800;
    font-size: 0.66rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .announce-author { font-weight: 800; font-size: 0.78rem; color: var(--text-dark); }
  .announce-pin-icon { width: 12px; height: 12px; color: var(--course-color); flex-shrink: 0; }
  .announce-pin-icon svg { width: 100%; height: 100%; fill: currentColor; }
  .announce-time { font-size: 0.66rem; color: var(--text-faint); margin-left: auto; white-space: nowrap; flex-shrink: 0; }
  .announce-unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--course-color); flex-shrink: 0; }
  .announce-text { font-size: 0.78rem; color: var(--text-muted); line-height: 1.45; margin: 4px 0 0; padding-left: 32px; }
  .announce-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 10px 0; }

  /* ---------- Course info modal — "course info pop-out" from site-map's
     Course-page spec: darkens the rest of the page except this box. ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 60;
    opacity: 0; visibility: hidden; transition: opacity 0.15s ease;
  }
  .modal-overlay.show { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    max-width: 380px; width: 100%;
    padding: 22px 24px;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    transform: translateY(8px);
    transition: transform 0.15s ease;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-close {
    float: right;
    background: var(--panel-inner);
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text-dark); }
  .modal-box h3 { margin: 2px 0 2px; font-size: 1.1rem; font-weight: 900; font-style: italic; color: var(--text-dark); }
  .modal-code { font-size: 0.76rem; font-weight: 700; color: var(--text-faint); margin: 0 0 14px; }

  /* Course-name editor — an <input> standing in for the old plain <h3>,
     styled to look identical to it at rest so the modal doesn't read as
     "a form" until you interact with it. A dashed underline on hover and
     a solid accent one while focused are the only hints it's editable,
     matching the color swatch's own low-key, inline-editing feel below.
     Live-updates on `input` (same reasoning as the color picker) so the
     banner name and hub title track every keystroke rather than only
     the eventual blur/Enter. */
  .modal-name-input {
    display: block;
    width: 100%;
    margin: 2px 0 2px;
    padding: 0 0 2px;
    border: none;
    border-bottom: 1px dashed transparent;
    background: none;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 900;
    font-style: italic;
    color: var(--text-dark);
  }
  .modal-name-input:hover { border-bottom-color: var(--border); }
  .modal-name-input:focus-visible { outline: none; border-bottom-color: var(--accent); }
  .modal-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .modal-row:last-of-type { border-bottom: none; }
  .modal-row .k { color: var(--text-faint); font-weight: 700; }
  .modal-row .v { color: var(--text-dark); font-weight: 700; text-align: right; }
  .modal-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; margin: 12px 0 0; }

  /* Course-color picker — a small round swatch button that opens a
     popup grid of preset colors, replacing the native
     <input type="color"> (which doesn't behave consistently everywhere
     it's used — see the shared popup component below). Pre-filled with
     the current value; picking a swatch calls applyCourseColor(hex)
     live, same as the native input's old `input`-event wiring did. */
  .modal-color-btn {
    width: 26px;
    height: 26px;
    padding: 0;
    border: 2px solid var(--panel-bg);
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--border);
    cursor: pointer;
    background: none;
    vertical-align: middle;
  }
  .modal-color-btn:focus-visible { outline: none; box-shadow: 0 0 0 1.5px var(--border), 0 0 0 4px var(--accent-ring); }

  /* Reusable color-swatch popup — flat 48-color grid (4 rows of 12: vivid
     / pastel / deep / grayscale), this app's own style rather than any
     OS color panel. Shared markup/behavior for every color picker on
     this page (currently just the course-color swatch above). */
  .color-swatch-wrap { position: relative; display: inline-block; }
  /* position:fixed with top/left set by JS (see initColorSwatchPopup's
     reposition()) rather than a static CSS offset — this popup lives
     inside the Course Info modal, and a static top/right-anchored popup
     could run past the modal's own bottom edge (and overlap the
     description text below it) depending on which row triggers it. JS
     measures the popup and clamps it fully on-screen on open. Columns
     are a fixed 16px (matching .color-swatch-cell) rather than 1fr with
     a separately-guessed container width — those two had drifted out of
     sync (236px fit 1fr tracks ~13px wide, but the cells were fixed at
     16px), so cells overflowed past the white background box on the
     right. Fixed-position elements with no explicit width shrink-wrap
     to their content, so leaving width unset now sizes the box to
     exactly match the grid every time. */
  .color-swatch-popup {
    position: fixed;
    z-index: 60;
    display: none;
    grid-template-columns: repeat(12, 16px);
    gap: 5px;
    padding: 12px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 0 0 1px rgba(0, 0, 0, 0.06);
  }
  .color-swatch-popup.show { display: grid; }
  .color-swatch-cell {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
    border: none;

  <script>
    // ------------------------------------------------------------------
    // Reusable color-swatch popup (replaces native <input type="color">,
    // which doesn't behave consistently everywhere it's used). A flat
    // 48-color grid — 4 rows (vivid / pastel / deep / grayscale) of 12
    // hues each — in this app's own flat style, not a copy of any OS
    // color panel. initColorSwatchPopup(button, popupEl, onPick) wires a
    // trigger button to a popup grid built from this palette; returns
    // { close() } so callers can dismiss it programmatically.
    // ------------------------------------------------------------------
    const SWATCH_PALETTE = [
      ['#e52e2e', '#e58a2e', '#e5e52e', '#8ae52e', '#2ee52e', '#2ee58a', '#2ee5e5', '#2e8ae5', '#2e2ee5', '#8a2ee5', '#e52ee5', '#e52e8a'],
      ['#f1b1b1', '#f1d1b1', '#f1f1b1', '#d1f1b1', '#b1f1b1', '#b1f1d1', '#b1f1f1', '#b1d1f1', '#b1b1f1', '#d1b1f1', '#f1b1f1', '#f1b1d1'],
      ['#812222', '#815222', '#818122', '#528122', '#228122', '#228152', '#228181', '#225281', '#222281', '#522281', '#812281', '#812252'],
      ['#f5f5f5', '#e0e0e0', '#cccccc', '#b8b8b8', '#a3a3a3', '#8f8f8f', '#7a7a7a', '#666666', '#525252', '#3d3d3d', '#292929', '#141414'],
    ];
    function initColorSwatchPopup(btn, popup, onPick) {
      SWATCH_PALETTE.flat().forEach(hex => {
        const cell = document.createElement('button');
        cell.type = 'button';
        cell.className = 'color-swatch-cell';
        cell.style.background = hex;
        cell.setAttribute('aria-label', hex);
        cell.addEventListener('click', () => {
          btn.style.background = hex;
          onPick(hex);
          closePopup();
        });
        popup.appendChild(cell);
      });
      function outsideClick(e) {
        if (!popup.contains(e.target) && e.target !== btn) closePopup();
      }
      function onKeydown(e) {
        if (e.key === 'Escape') closePopup();
      }
      // Fixed-position, clamped to the viewport: anchors under the
      // button (right-aligned to it) by default, but flips above the
      // button if there isn't room below, and never lets the popup's
      // left/right/bottom edges pass the viewport margins — so it can't
      // run past the modal it's nested in or off screen.
      function reposition() {
        const margin = 10;
        const b = btn.getBoundingClientRect();
        const p = popup.getBoundingClientRect();
        let left = b.right - p.width;
        left = Math.min(left, window.innerWidth - p.width - margin);
        left = Math.max(margin, left);
        let top = b.bottom + 8;
        if (top + p.height > window.innerHeight - margin) {
          top = b.top - p.height - 8;
          if (top < margin) top = margin;
        }
        popup.style.left = left + 'px';
        popup.style.top = top + 'px';
        // A transformed ancestor (the Course Info modal box slides in via
        // CSS `transform`) makes a position:fixed descendant relative to
        // THAT ancestor instead of the viewport, per spec — so the values
        // above can land in the wrong place. Measure where it actually
        // rendered and nudge by the difference; a no-op when there's no
        // such ancestor.
        const rendered = popup.getBoundingClientRect();
        const dx = left - rendered.left;
        const dy = top - rendered.top;
        if (dx || dy) {
          popup.style.left = (left + dx) + 'px';
          popup.style.top = (top + dy) + 'px';
        }
      }
      function openPopup() {
        popup.classList.add('show');
        btn.setAttribute('aria-expanded', 'true');
        reposition();
        document.addEventListener('click', outsideClick, true);
        document.addEventListener('keydown', onKeydown);
        window.addEventListener('scroll', reposition, true);
        window.addEventListener('resize', reposition);
      }
      function closePopup() {
        popup.classList.remove('show');
        btn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', outsideClick, true);
        document.removeEventListener('keydown', onKeydown);
        window.removeEventListener('scroll', reposition, true);
        window.removeEventListener('resize', reposition);
      }
      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (popup.classList.contains('show')) closePopup();
        else openPopup();
      });
      return { close: closePopup };
    }

    // ------------------------------------------------------------------
    // Same six sample courses as home.html/courses.html (same id/name/
    // color/grade/predicted/updated values), plus the course-code/period/
    // teacher/section fields courses.html added. Kept in sync by hand
    // across the three files for now — see architecture-decisions.md's
    // note about promoting shared sample data once there's a build step.
    //
    // ------------------------------------------------------------------
    // Course customization persistence — added 2026-09-08. Same
    // schoolagy_course_custom (per-course name/color overrides, keyed by
    // course id, only actually-customized courses present) and
    // schoolagy_course_order (full custom ordering of course ids) keys
    // home.html's Customize editor uses — see that file for the fuller
    // note. This page's own info pop-out (course name field + color
    // swatch below) is the other place that WRITES
    // schoolagy_course_custom — it never reorders, so it doesn't write
    // schoolagy_course_order. applyCourseCustomizationsInPlace() is
    // called right after the raw array literal below, mutating COURSES
    // in place, so `course` (found from COURSES right below) already
    // reflects any saved rename/recolor before this page renders
    // anything. Same defensive try/catch-per-key style as
    // SCHOOLAGY_DARK_MODE_KEY in settings.html.
    // ------------------------------------------------------------------
    const SCHOOLAGY_COURSE_CUSTOM_KEY = 'schoolagy_course_custom';
    const SCHOOLAGY_COURSE_ORDER_KEY = 'schoolagy_course_order';
    function loadCourseCustom() {
      try {
        const raw = localStorage.getItem(SCHOOLAGY_COURSE_CUSTOM_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return {};
    }
    function saveCourseCustom(id, patch) {
      const all = loadCourseCustom();
      all[id] = Object.assign({}, all[id], patch);
      try { localStorage.setItem(SCHOOLAGY_COURSE_CUSTOM_KEY, JSON.stringify(all)); } catch {}
    }
    function loadCourseOrder() {
      try {
        const raw = localStorage.getItem(SCHOOLAGY_COURSE_ORDER_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return null;
    }
    function applyCourseCustomizationsInPlace(courses) {
      const custom = loadCourseCustom();
      // Mutates each course object's own fields in place (never clones,
      // never reassigns `courses` itself) so the `const COURSES = [...]`
      // literal a few lines below stays exactly that — a literal array —
      // for scripts/port-pages.mjs's data-overrides transform to match
      // and rewrite for live Schoology data. This function only edits
      // the array's contents/order after that binding already exists.
      courses.forEach(c => Object.assign(c, custom[c.id] || {}));
      const order = loadCourseOrder();
      if (order && order.length) {
        const byId = new Map(courses.map(c => [c.id, c]));
        const ordered = order.filter(id => byId.has(id)).map(id => byId.get(id));
        // A course not present in the saved order (e.g. added to the demo
        // data after the order was saved) still shows up, just appended.
        courses.forEach(c => { if (!order.includes(c.id)) ordered.push(c); });
        courses.splice(0, courses.length, ...ordered);
      }
    }
    const COURSES = [
      { id: 'apchem', name: 'AP Chemistry', code: '76_M0431', period: 2, teacher: 'Mr. Alvarez', section: '1204', color: '#a67a22', grade: 'B+', pct: 87, predicted: 'A-', predictedPct: 91, trend: 'up', updated: '2h ago', desc: 'Lab-based introduction to chemical reactions, stoichiometry, and gas laws, with weekly lab reports.' },
      { id: 'algebra2', name: 'Algebra II', code: '76_S0512', period: 3, teacher: 'Mr. Whitfield', section: '1188', color: '#5b6ea3', grade: 'A', pct: 95, predicted: 'A', predictedPct: 95, trend: 'flat', updated: '1d ago', desc: 'Functions, systems of equations, and factoring, building toward Pre-Calculus.' },
      { id: 'english10', name: 'English 10', code: '76_F0288', period: 4, teacher: 'Ms. Cho', section: '1350', color: '#6b8f5e', grade: 'C+', pct: 78, predicted: 'C', predictedPct: 74, trend: 'down', updated: '3h ago', desc: 'Reading and composition, with weekly reading journals and discussion posts.' },
      { id: 'ushistory', name: 'U.S. History', code: '76_R0367', period: 1, teacher: 'Mrs. Bennett', section: '1092', color: '#a15c4f', grade: 'A-', pct: 91, predicted: 'A-', predictedPct: 91, trend: 'flat', updated: '5h ago', desc: 'Colonial era through Reconstruction, with primary-source analysis and a timeline project.' },
      { id: 'spanish3', name: 'Spanish III', code: '76_G0295', period: 5, teacher: 'Sra. Ortiz', section: '1417', color: '#8a6ba1', grade: 'B', pct: 84, predicted: 'B+', predictedPct: 88, trend: 'up', updated: '1d ago', desc: 'Intermediate conversation and composition, with weekly listening checks.' },
      { id: 'pe', name: 'PE', code: '76_P0300', period: 6, teacher: 'Coach Reyes', section: '1125', color: '#4f8c8a', grade: 'A', pct: 97, predicted: 'A', predictedPct: 97, trend: 'flat', updated: '2d ago', desc: 'Fitness training and team sports, graded on participation and fitness logs.' },
    ];
    applyCourseCustomizationsInPlace(COURSES);

    // Which course this hub is showing — from ?course=<id> in the URL,
    // same route shape as site-map.md's /courses/{course_id}. Falls back
    // to AP Chemistry (this draft's own "Your Ap Chem Hub" example) for
    // a bare visit with no query string.
    const courseId = new URLSearchParams(location.search).get('course') || 'apchem';
    const course = COURSES.find(c => c.id === courseId) || COURSES[0];

    function lighten(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.min(255, (n >> 16) + amt), g = Math.min(255, ((n >> 8) & 255) + amt), b = Math.min(255, (n & 255) + amt);
      return `rgb(${r},${g},${b})`;
    }
    function darken(hex, amt) { return lighten(hex, -amt); }

    // Everything specific to "whose hub this is" hangs off these three
    // CSS variables — read everywhere else in the CSS above (banner,
    // active course-nav item, calendar dots, assignment ticks, filter
    // pills). Pulled into a function (not just set once at load) so the
    // info modal's color picker below can call it again live as the
    // user drags — also updates `course.color` itself so the Predicted
    // popup's SVG chart, which reads that value directly rather than
    // the CSS var, picks up the change too.
    function applyCourseColor(hex) {
      course.color = hex;
      document.documentElement.style.setProperty('--course-color', hex);
      document.documentElement.style.setProperty('--course-color-dark', darken(hex, 28));
      document.documentElement.style.setProperty('--course-color-tint', lighten(hex, 210).replace('rgb', 'rgba').replace(')', ', 0.16)'));
    }
    applyCourseColor(course.color);

    document.getElementById('hubTitle').textContent = `Your ${course.name} Hub`;
    document.getElementById('hubSubtitle').textContent = `${course.code} · Pd:${course.period} ${course.teacher} - ${course.section}`;
    document.getElementById('bannerName').textContent = course.name;
    document.getElementById('bannerCode').textContent = course.code;
    document.title = `Schoolagy — ${course.name} Hub`;

    // ------------------------------------------------------------------
    // Announcements widget — teacher posts for this course, newest
    // first with pinned posts always floating to the top. Front-end
    // only, kept in-memory: clicking a post just clears its own unread
    // dot and re-renders, no backend to actually mark anything read.
    // ------------------------------------------------------------------
    const ANNOUNCEMENTS = {
      apchem: [
        { id: 'a1', text: 'Titration lab moved to Friday — bring safety goggles and your lab notebook.', time: '2h ago', pinned: true, unread: true },
        { id: 'a2', text: 'Great averages on the Gas Laws Test! Quiz corrections are due Monday for anyone under 80%.', time: '1d ago', pinned: false, unread: true },
        { id: 'a3', text: 'Molarity Worksheet answer key posted under Materials.', time: '3d ago', pinned: false, unread: false },
        { id: 'a4', text: 'Reminder: bring your calculator for Thursday\'s stoichiometry practice, we\'re not sharing this time.', time: '4d ago', pinned: false, unread: false },
        { id: 'a5', text: 'Lab Report #3 grades are posted — see me during tutorial if you want to talk about your rubric score.', time: '6d ago', pinned: false, unread: false },
        { id: 'a6', text: 'Safety contract signatures are still missing from a few of you — check the folder by Friday.', time: '7d ago', pinned: false, unread: false },
        { id: 'a7', text: 'Extra office hours added Thursday morning before school for anyone behind on labs.', time: '8d ago', pinned: false, unread: false },

    // ------------------------------------------------------------------
    // Predicted-grade reasoning popup — same component as home.html /
    // courses.html, triggered from the grade-hero's Predicted block
    // instead of a table cell. Own SVG pattern id (predStripesHub) so
    // it can never collide if this page is ever combined with the
    // others.
    // ------------------------------------------------------------------
    function niceBounds(values) {
      const min = Math.min(...values), max = Math.max(...values);
      let lo = Math.floor((min - 6) / 10) * 10;
      let hi = Math.ceil((max + 6) / 10) * 10;
      lo = Math.max(0, lo);
      hi = Math.min(100, hi);
      if (hi - lo < 20) { hi = Math.min(100, lo + 20); }
      return [lo, hi];
    }
    function buildGradeChartSVG(c) {
      const h = HISTORY[c.id];
      const allLabels = h.dates.concat(['Predicted']);
      const allValues = h.points.concat([c.predictedPct]);
      const [yLo, yHi] = niceBounds(allValues);
      const W = 240, H = 108;
      const padL = 26, padR = 6, padT = 10, padB = 16;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const xFor = i => padL + (i / (allLabels.length - 1)) * plotW;
      const yFor = v => padT + plotH - ((v - yLo) / (yHi - yLo)) * plotH;
      const yTicks = [yLo, Math.round((yLo + yHi) / 2), yHi];
      const gridlines = yTicks.map(t => `
        <line x1="${padL}" x2="${W - padR}" y1="${yFor(t)}" y2="${yFor(t)}" stroke="var(--border)" stroke-width="1"/>
        <text x="${padL - 6}" y="${yFor(t) + 3}" text-anchor="end" font-size="8" fill="var(--text-faint)">${t}%</text>
      `).join('');
      const actualPts = h.points.map((v, i) => [xFor(i), yFor(v)]);
      const actualLine = actualPts.map(p => p.join(',')).join(' ');
      const actualMarkers = actualPts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="${c.color}" stroke="var(--panel-bg)" stroke-width="2"/>`).join('');
      const predX = xFor(allLabels.length - 1), predY = yFor(c.predictedPct);
      const lastActual = actualPts[actualPts.length - 1];
      const predictedBand = `x="${lastActual[0]}" y="${padT}" width="${predX - lastActual[0]}" height="${plotH}"`;
      const stripeDefs = `
        <pattern id="predStripesHub" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="${c.color}" fill-opacity="0.08"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="${c.color}" stroke-width="2.2"/>
        </pattern>
      `;
      const xLabels = allLabels.map((lab, i) => `<text x="${xFor(i)}" y="${H - 2}" text-anchor="middle" font-size="7.5" fill="var(--text-faint)">${lab === 'Predicted' ? 'Pred.' : lab}</text>`).join('');
      return `
        <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Line chart of ${c.name} assignment scores trending toward a predicted grade of ${c.predictedPct} percent">
          <defs>${stripeDefs}</defs>
          ${gridlines}
          <rect ${predictedBand} fill="url(#predStripesHub)" stroke="none"/>
          <polyline points="${actualLine}" fill="none" stroke="${c.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="${lastActual[0]}" y1="${lastActual[1]}" x2="${predX}" y2="${predY}" stroke="${c.color}" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
          ${actualMarkers}
          <circle cx="${predX}" cy="${predY}" r="4.5" fill="var(--panel-bg)" stroke="${c.color}" stroke-width="2"/>
          <text x="${predX}" y="${predY - 10}" text-anchor="end" font-size="8.5" font-weight="800" fill="var(--text-dark)">${c.predictedPct}%</text>
          ${xLabels}
        </svg>
      `;
    }
    function renderGradePopup(c) {
      const h = HISTORY[c.id];

        ${buildGradeChartSVG(c)}
        <p class="popup-foot">Predicted grade extrapolates this trend — not a copy of the current grade.</p>
      `;
    }

    // ------------------------------------------------------------------
    // Upcoming Calendar — a real month grid, built from Date objects
    // rather than a hand-typed layout so the weekday-per-day-number can
    // never drift out of sync with the due dates above. Only Overdue/
    // Upcoming days get a dot (not graded days) — this card is about
    // what's still ahead, same as the wireframe's "Upcoming Calendar"
    // label. Today (Aug 24, 2026 — the same mock "today" home.html's
    // Today card uses) gets a ring; clicking any day updates the info
    // panel underneath.
    //
    // Back/forward month navigation (added 2026-08-26, per Martin's
    // request to browse past/future events): the grid starts on August
    // 2026 (the month every sample due-date string in the app already
    // assumes) but `calYear`/`calMonthIdx` can move independently —
    // renderCalendar() rebuilds the grid for whatever month is current,
    // and the "today" ring / due-date dots only ever apply when that's
    // actually August 2026, since that's the only month the sample
    // data covers. Browsing to another month just shows an empty
    // month, same as a real calendar with nothing scheduled yet.
    // ------------------------------------------------------------------
    const TODAY_DAY = 24, TODAY_MONTH = 7, TODAY_YEAR = 2026; // Aug 24, 2026
    const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const dueDays = new Map(); // day -> [{title, type, status}] — all within August 2026
    overdueItems.concat(upcomingItems).forEach(i => {
      if (!dueDays.has(i.day)) dueDays.set(i.day, []);
      dueDays.get(i.day).push(i);
    });

    let calYear = TODAY_YEAR, calMonthIdx = TODAY_MONTH;
    const calGrid = document.getElementById('calGrid');
    const calMonthLabel = document.getElementById('calMonthLabel');

    function renderCalendar() {
      const firstWeekday = new Date(calYear, calMonthIdx, 1).getDay();
      const daysInMonth = new Date(calYear, calMonthIdx + 1, 0).getDate();
      const isSampleMonth = calYear === TODAY_YEAR && calMonthIdx === TODAY_MONTH;
      calMonthLabel.textContent = `${MONTH_NAMES[calMonthIdx]} ${calYear}`;
      let calHTML = DOW.map(d => `<div class="cal-dow">${d[0]}</div>`).join('');
      for (let i = 0; i < firstWeekday; i++) calHTML += '<div class="cal-day pad"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = isSampleMonth && d === TODAY_DAY;
        const hasDue = isSampleMonth && dueDays.has(d);
        calHTML += `<button class="cal-day${isToday ? ' today' : ''}" type="button" data-day="${d}">${d}${hasDue ? '<span class="dot"></span>' : ''}</button>`;
      }
      calGrid.innerHTML = calHTML;
    }

    function selectDay(day) {
      document.querySelectorAll('.cal-day').forEach(el => el.classList.toggle('selected', Number(el.dataset.day) === day));
      const d = new Date(calYear, calMonthIdx, day);
      document.getElementById('calSelDate').textContent = `${DOW[d.getDay()]}, ${MONTH_NAMES[calMonthIdx]} ${day}`;
      const isSampleMonth = calYear === TODAY_YEAR && calMonthIdx === TODAY_MONTH;
      const items = isSampleMonth ? (dueDays.get(day) || []) : [];
      const box = document.getElementById('calSelItems');
      box.innerHTML = items.length
        ? items.map(i => `<div class="cal-selected-item"><span class="type">${TYPE_LABEL[i.type]}</span><span class="name">${i.title}</span></div>`).join('')
        : '<p class="cal-selected-empty">Nothing due this day.</p>';
    }
    calGrid.addEventListener('click', e => {
      const btn = e.target.closest('.cal-day:not(.pad)');
      if (!btn) return;
      selectDay(Number(btn.dataset.day));
    });
    function goToMonth(delta) {
      calMonthIdx += delta;
      if (calMonthIdx < 0) { calMonthIdx = 11; calYear--; }
      else if (calMonthIdx > 11) { calMonthIdx = 0; calYear++; }
      renderCalendar();
      document.getElementById('calSelDate').textContent = '';
      document.getElementById('calSelItems').innerHTML = '<p class="cal-selected-empty">Pick a day to see what’s due.</p>';
    }
    document.getElementById('calPrevBtn').addEventListener('click', () => goToMonth(-1));
    document.getElementById('calNextBtn').addEventListener('click', () => goToMonth(1));

    renderCalendar();
    selectDay(TODAY_DAY);

    // ------------------------------------------------------------------
    // Course info pop-out — the "course info pop-out (shows course
    // info, darkens rest of page)" line from site-map.md's Course-page
    // spec, which the draft PDF itself didn't sketch but the site map
    // already calls for.
    // ------------------------------------------------------------------
    const infoModal = document.getElementById('infoModal');
    const modalNameInput = document.getElementById('modalCourseName');
    modalNameInput.value = course.name;
    // Live-renames the course everywhere its name shows on this page —
    // banner, hub title, and tab title — same "propagate on every
    // keystroke" convention as the color swatch above. An empty box
    // (mid-edit, before the user's typed anything) is left as-is
    // everywhere else rather than blanking those out.
    modalNameInput.addEventListener('input', () => {
      const name = modalNameInput.value;
      if (!name) return;
      course.name = name;
      saveCourseCustom(course.id, { name });
      document.getElementById('hubTitle').textContent = `Your ${name} Hub`;
      document.getElementById('bannerName').textContent = name;
      document.title = `Schoolagy — ${name} Hub`;
    });
    document.getElementById('modalCode').textContent = course.code;
    document.getElementById('modalTeacher').textContent = course.teacher;
    document.getElementById('modalPeriod').textContent = course.period;
    document.getElementById('modalSection').textContent = course.section;
    document.getElementById('modalGrade').textContent = `${course.grade} (${course.pct}%)`;
    document.getElementById('modalDesc').textContent = course.desc;
    const modalColorBtn = document.getElementById('modalColorBtn');
    const modalColorPopup = document.getElementById('modalColorPopup');
    modalColorBtn.style.background = course.color;
    initColorSwatchPopup(modalColorBtn, modalColorPopup, hex => {
      applyCourseColor(hex);
      saveCourseCustom(course.id, { color: hex });
    });
    function openInfoModal() { infoModal.classList.add('show'); document.getElementById('modalCloseBtn').focus(); }
    function closeInfoModal() { infoModal.classList.remove('show'); document.getElementById('infoBtn').focus(); }
    document.getElementById('infoBtn').addEventListener('click', openInfoModal);
    document.getElementById('modalCloseBtn').addEventListener('click', closeInfoModal);
    infoModal.addEventListener('click', e => { if (e.target === infoModal) closeInfoModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && infoModal.classList.contains('show')) closeInfoModal(); });

    // ------------------------------------------------------------------
    // Course sub-nav (Home/Materials/Gradebook) — Materials has a real
    // page (course-materials.html, 2026-08-26, built from Martin's own
    // Finder-style draft), and Gradebook now does too (gradebook.html,
    // 2026-08-31, built from Martin's Gradebook.pdf draft) — both use
    // the same data-href="…"?course={id} pattern below. The Updates item
    // that used to sit here was removed 2026-08-28 per Martin's request —
    // see architecture-decisions.md.
    // ------------------------------------------------------------------
    document.querySelectorAll('.course-nav-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.href) { window.location.href = `${item.dataset.href}?course=${course.id}`; return; }
        document.querySelectorAll('.course-nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Bottom app nav — permanently visible (2026-08-26, per Martin's
    // request; previously hidden by default and revealed by an
    // up-arrow tab). Home/Courses are real links since both pages
    // exist; the rest stay visual-only, matching home.html/courses.html.
    // ------------------------------------------------------------------
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as home.html/courses.html.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    // Shared profile photo/name (2026-09-07) — settings.html's Edit
    // Profile modal is the only place this is ever set, but every other
    // page's top-right profile button used to just show a fixed "M" no
    // matter what was saved there: the button never read anything back,
    // so a photo you set in Settings was invisible the moment you left
    // it. schoolagy_profile is the same localStorage record
    // settings.html writes on every save; this is read-only here.
    (function () {
      var profile = null;
      try {
        var raw = localStorage.getItem('schoolagy_profile');
        if (raw) profile = JSON.parse(raw);
      } catch (e) {}
      if (!profile) return;
      if (profile.photo) {
        profileBtn.style.backgroundImage = 'url("' + profile.photo + '")';
        profileBtn.style.backgroundSize = 'cover';
        profileBtn.style.backgroundPosition = 'center';
        profileBtn.textContent = '';
      } else if (profile.name) {
        profileBtn.textContent = profile.name.trim().charAt(0).toUpperCase() || 'M';
      }
    })();
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
</body>
</html>
