<style>
  :root {
    /* Same accent/background system as home.html, courses.html, etc. —
       the default red/orange gradient every authenticated page falls
       back to. */
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);

    --page-bg-start: #f17b53;
    --page-bg-end: #930500;

    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;

    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

    height: 100vh; /* fixed, not min -- body itself no longer scrolls */

  .page {
    width: 100%;
    max-width: 560px;
    align-self: stretch; /* fill body's available height regardless of
      body's own align-items:center, so there's a bounded box to scroll
      within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll now happens here, at the edge
      of the app's own window column -- not on body/html */
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---------- The panel itself — same shared card language as every
     other page, centered vertically since there's no page content to
     anchor above it. margin:auto (not .page's justify-content:center)
     does the centering: a centered flex container's scrollHeight doesn't
     reliably account for content overflowing past the centered position
     (verified -- it under-reports how far there is to scroll), while auto
     margins center when there's room and cleanly collapse to top-aligned,
     fully-scrollable once there isn't. ---------- */
  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    padding: 44px 36px 40px;
    text-align: center;
    margin: auto 0;
  }

  /* ---------- Icon — a plain outlined "page" shape with a broken
     corner and a dashed question-mark stroke, in the same stroke-based
     currentColor convention as the rest of the app's icon set (see
     icon-checklist.md), not a stock illustration. ---------- */
  .notfound-icon-wrap {
    width: 84px;
    height: 84px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--panel-inner);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notfound-icon-wrap svg {
    width: 38px;
    height: 38px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .notfound-code {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 6px;
  }

  h1.notfound-title {
    font-size: clamp(1.5rem, 4vw, 1.9rem);
    font-weight: 900;
    font-style: italic;
    color: var(--text-dark);
    margin: 0 0 10px;
    transform: skewX(-2deg);
  }

  .notfound-sub {
    font-size: 0.92rem;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0 0 30px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
  }

  .notfound-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-home {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    font: inherit;
    font-weight: 800;
    font-size: 0.86rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    box-shadow: 0 12px 26px -10px rgba(0,0,0,0.4);
  }
  .btn-home:hover { background: var(--accent-dark); }
  .btn-home:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring), 0 12px 26px -10px rgba(0,0,0,0.4); }

  .btn-back {
    background: var(--panel-inner);
    color: var(--text-dark);
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font: inherit;
    font-weight: 800;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .btn-back:hover { background: var(--border); }
  .btn-back:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring); }

  /* ---------- Bottom nav — identical markup/behavior to every other
     page (see home.html), so a lost user can still get anywhere in the
     app from here rather than being fully stranded. No item is marked
     active since a 404 isn't itself a real destination. ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;
    gap: 4px;
    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .nav-link .label {
    display: block;
    max-width: 100%;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
  .nav-link.active .label { color: var(--text-dark); }
  .nav-link.active .dot { background: var(--accent); }
  .nav-link:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-ring) inset; }

  @media (max-width: 520px) {
    .card { padding: 36px 22px 34px; }
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
</style>
</head>
<body>

  <div class="page">
    <div class="card">
      <div class="notfound-icon-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/>
          <path d="M14 3v4h4"/>
          <path d="M9.3 12.3a2.2 2.2 0 1 1 3.5 1.8c-.7.5-1.3.9-1.3 1.9" stroke-dasharray="1 3.2"/>
          <circle cx="11.5" cy="18.2" r="0.15" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <p class="notfound-code">404 — Not Found</p>
      <h1 class="notfound-title">This page took a sick day</h1>
      <p class="notfound-sub">The page you're looking for doesn't exist, moved, or the link's just plain broken. Let's get you back somewhere real.</p>
      <div class="notfound-actions">
        <a class="btn-home" href="home.html">Take me home</a>
        <button class="btn-back" type="button" id="goBackBtn">Go back</button>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Main navigation">
    <div class="app-nav-inner" id="dock">
      <button class="nav-link" type="button" data-page="home" data-href="home.html">
        <span class="label">Home</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="courses" data-href="courses.html">
        <span class="label">Courses</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="grades" data-href="grades.html">
        <span class="label">Grades</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="assignments" data-href="assignments.html">
        <span class="label">Assignments</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="calendar">
        <span class="label">Calendar</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="messages" data-href="messages.html">
        <span class="label">Messages</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="contacts" data-href="contacts.html">
        <span class="label">Contacts</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="settings" data-href="settings.html">
        <span class="label">Settings</span>
        <span class="dot"></span>
      </button>
    </div>
  </nav>

  <script>
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // "Go back" uses real browser history when there is somewhere to go
    // back to (e.g. a broken in-app link); falls back to Home when this
    // page was opened directly (no history — e.g. a bad bookmark/typed
    // URL), so the button is never a dead end either way.
    document.getElementById('goBackBtn').addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'home.html';
      }
    });
  </script>

</body>
</html>
