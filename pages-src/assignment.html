<style>
  /* ---------- Shared design system — copied verbatim from the other
     pages so this reads as the same app. See architecture-decisions.md
     re: promoting this to an actual shared stylesheet once there's a
     build step. ---------- */
  :root {
    --accent: #d94a2b;
    --accent-dark: #a8331a;
    --accent-ring: rgb(from var(--accent) r g b / 0.35);
    --page-bg-start: #f17b53;
    --page-bg-end: #930500;
    --panel-bg: #eaeaec;
    --panel-inner: #dcdce0;
    --text-dark: #14151f;
    --text-muted: #4b4d63;
    --text-faint: #83849a;
    --border: #cfcfd6;
    --window-radius-lg: 22px;
    --window-radius-md: 14px;
    --window-radius-sm: 10px;
    --grade-good: #2f7d54;
    --grade-mid: #a67a22;
    --grade-bad: #b6432f;
    /* A fifth lifecycle color for the "Returned" status — a teacher
       sends the submission back with a comment, usually asking for a
       revision, without necessarily finalizing a grade. Distinct from
       every existing use (red/amber/green already carry Missing/
       Submitted/Graded meanings, and violet isn't used anywhere else
       in this app), so a returned item can't be visually confused with
       an ordinary graded one. */
    --returned: #6a4fae;
  }

  * { box-sizing: border-box; }

  /* Scrollbars app-wide: a slim, permanently-visible, rounded gray bar
     sitting slightly inset from the true edge of its scrollable area --
     like a normal OS/Gmail-style scrollbar, not hidden and not
     hover-gated. (An earlier hover-only version turned out unreliable:
     the outer page counts as "hovered" almost the entire time you're
     using it, so it either showed constantly or never, depending on the
     browser -- not the meaningful hover signal it needed to be.)
     Scrolling itself always works via wheel/trackpad/touch/keys either
     way. One universal rule (the `*` selector) so it covers every
     scrollable element automatically — the outer page scroll, every
     popup/modal, every internal list — without repeating it per
     element. (The bottom nav's own horizontal scroll strip is a
     deliberate exception — see .app-nav-inner further down — that one
     stays permanently hidden as a mobile overflow safety net.) */
  * {
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 21, 31, 0.28) transparent;
  }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background-color: rgba(20, 21, 31, 0.28);
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box; /* the transparent border creates the
      inset gap around the thumb, so it reads as sitting inside the
      window rather than flush against the very edge */
  }
  *::-webkit-scrollbar-thumb:hover { background-color: rgba(20, 21, 31, 0.45); }
  *::-webkit-scrollbar-corner { background: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: "puffin", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .page {
    width: 100%;
    max-width: 980px;
    align-self: stretch; /* fill body's available height regardless of
      whatever align-items body declares, so there's a bounded box to
      scroll within */
    min-height: 0; /* flexbox gotcha: without this, a flex item won't
      shrink below its content size, which breaks overflow scrolling */
    overflow-y: auto; /* the actual scroll happens here -- both cards grow
      to their natural content height and .page scrolls as a whole */
    overflow-x: hidden;
  }

  /* ---------- Top bar — same .back-link convention as course-home.html/

    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.82);
    font-weight: 800;
    font-size: 0.76rem;
    padding: 0;
    margin: 0 0 14px 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .back-link svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .back-link:hover { color: #fff; }
  .back-link:focus-visible { outline: none; text-decoration: underline; }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 4px 8px;
    gap: 12px;
  }

  h1.title {
    color: #ffffff;
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    font-weight: 900;
    font-style: italic;
    letter-spacing: -0.01em;
    margin: 0;
    transform: skewX(-2deg);
    display: inline-block;
  }

  /* ---------- Sub-line — "Class Name (Linked)" + "Gradebook (linked)"
     from the draft, laid out as a subtitle row. Both are now real links
     (Gradebook became one 2026-08-31 once gradebook.html existed to
     point at — previously styled visibly muted/inert, same convention
     as every other unbuilt nav destination in this app; that treatment
     is gone now that there's a real destination). ---------- */
  .assign-sub { display: flex; align-items: center; gap: 8px; margin: 4px 0 18px 2px; flex-wrap: wrap; }
  .assign-sub-link {
    background: none;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-style: italic;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.92);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0;
  }
  .assign-sub-link:hover { color: #fff; }
  .assign-sub-link:focus-visible { outline: none; text-decoration-thickness: 2px; }
  .assign-sub-dot { color: rgba(255,255,255,0.5); font-size: 0.8rem; }

  .profile-menu-wrap { position: relative; flex-shrink: 0; }
  .profile-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .profile-menu {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    min-width: 160px;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 6px;
    z-index: 25;
  }
  .profile-menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-radius: var(--window-radius-sm);
    font: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--text-dark);
    padding: 9px 12px;
    cursor: pointer;
  }
  .profile-menu-item:hover { background: var(--panel-inner); }
  .profile-menu-item.signout { color: var(--grade-bad); }

  /* ---------- Two-panel layout — Description+Materials / Submissions,
     matching the draft's two equal-width white boxes side by side.
     This grid is capped to the space .page has left (flex: 1;
     min-height: 0) instead of .page growing to fit both cards' full
     height, which is what used to let their rounded corners scroll off
     screen. Fixed again 2026-09-04 (per Martin, "round corners on
     scroll on all pages"): the grid itself no longer scrolls — that
     just moved the same bug down one level, scrolling both cards as a
     single unit and cutting off THEIR rounded corners instead (found by
     scrolling .assign-detail-grid directly and screenshotting — the top
     of both cards went flat/square mid-scroll). align-items: stretch
     (not start) so each card fills the grid row's full height, and each
     .card is its own independently-windowed frame — fixed size, only
     .card-inner scrolls inside it — same pattern as every single-card
     page (calendar.html, home.html, etc.), just one level deeper. ---------- */
  .assign-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .assign-detail-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    padding: 6px;
  }
  .card-inner {
    padding: 22px 24px 24px;
  }
  .card-inner h2 {
    font-size: 0.92rem;
    font-weight: 800;
    font-style: italic;
    color: var(--text-dark);
    margin: 0 0 8px;
  }
  .card-inner h2.second { margin-top: 20px; }

  .assign-desc-text { font-size: 0.86rem; line-height: 1.55; color: var(--text-muted); margin: 0; }

  /* ---------- Attached / submitted file rows — same red/blue/orange
     PDF/DOCX/PPTX badge colors course-materials.html already uses, so
     a file reads consistently wherever it shows up in the app. ---------- */
  .material-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .material-row:last-child { border-bottom: none; }
  .material-badge {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .material-name { flex: 1; min-width: 0; font-size: 0.82rem; font-weight: 600; color: var(--text-dark); }
  .assign-empty { font-size: 0.8rem; color: var(--text-faint); font-style: italic; padding: 4px 0; }

  /* ---------- View/Download buttons on an Attached Materials row
     (2026-08-29, per Martin's request) — no real file content exists in
     this mock (same as course-materials.html), so both open a small
     info modal rather than actually opening or downloading anything. ---------- */
  .material-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .material-icon-btn {
    width: 28px;
    height: 28px;
    border: none;
    background: none;
    color: var(--text-faint);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .material-icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .material-icon-btn:hover { background: var(--border); color: var(--text-dark); }
  .material-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }

  /* ---------- Shared small modal — Add Submission and the file-action
     (View/Download) info both use this one component. ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 60;
  }
  /* Same [hidden]-vs-display:flex specificity tie already caught
     elsewhere in this app (.edit-fab[hidden] on home.html,
     .view-toggle[hidden] on course-materials.html) — without this,
     the later `display: flex` rule above wins and the overlay stays
     visible (and intercepts clicks) even with `hidden` set. */
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--panel-bg);
    border-radius: var(--window-radius-lg);
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.6);
    padding: 22px;
    width: 100%;
    max-width: 380px;
  }
  /* Wider variant for the Add Submission modal only (2026-09-04, per
     Martin: "make the assignment submission popup bigger") -- it now
     carries tabs, a multi-file list, and the Create tab's rich-text
     toolbar, so the default 380px (sized for the smaller file-info/
     submission-preview popups) felt cramped. Added/removed by
     openAddSubmissionModal()/closeModal() rather than changing
     .modal-box itself, so every other popup in this app stays the same
     size it's always been. Still just width:100% under 560px, so it
     shrinks to fit a narrow viewport the same as .modal-box normally does. */
  .modal-box.modal-box-lg { max-width: 560px; }
  /* Wraps the per-file rows in the Submission Preview popup (2026-09-04)
     -- just spacing, .material-row/.material-badge do the rest. */
  .modal-file-list { margin-top: 8px; }
  .modal-box h3 { margin: 0 0 8px; font-size: 1rem; font-weight: 800; font-style: italic; color: var(--text-dark); }
  .modal-box p { margin: 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
  .modal-file-input {
    width: 100%;
    margin-top: 14px;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  /* Add Submission — Upload/Create tabs, mirroring the real Schoology
     upload dialog Martin shared a screenshot of (2026-08-29). */
  .upload-tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
    border-bottom: 1px solid var(--border);
  }
  .upload-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.76rem;
    color: var(--text-muted);
    padding: 6px 10px 9px;
    cursor: pointer;
  }
  .upload-tab:hover { color: var(--text-dark); }
  .upload-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .upload-tab:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); border-radius: 4px; }
  .upload-tab-panel { padding-top: 12px; }
  .upload-tab-desc { font-size: 0.76rem; color: var(--text-muted); margin: 0 0 8px; line-height: 1.45; }
  .modal-field-label {
    display: block;
    margin-top: 16px;
    font-size: 0.68rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
  }
  .modal-textarea {
    width: 100%;
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: var(--window-radius-sm);
    border: 1px solid var(--border);
    background: var(--panel-inner);
    color: var(--text-dark);
    font-family: inherit;
    font-size: 0.78rem;
    line-height: 1.4;
    resize: vertical;
    min-height: 52px;
    box-sizing: border-box;
  }
  .modal-textarea:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .modal-textarea.answer-textarea { min-height: 78px; }
  /* Upload tab's file picker — the bare native <input type="file"> read
     ugly (browser-default button + "no file chosen" text with no styling
     control), so it's now a hidden input triggered by a real styled button,
     matching every other pill/rounded control in this modal (2026-08-29,
     per Martin's request). */
  .upload-picker { display: flex; align-items: center; gap: 10px; margin-top: 4px; min-width: 0; }
  .upload-picker-btn {
    background: var(--panel-inner);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.76rem;
    color: var(--text-dark);
    cursor: pointer;
    flex-shrink: 0;
  }
  .upload-picker-btn:hover { background: var(--border); }
  .upload-picker-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .upload-picker-filename {
    flex: 1;
    min-width: 0;
    font-size: 0.78rem;
    color: var(--text-dark);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .upload-picker-filename.empty { color: var(--text-faint); font-weight: 600; font-style: italic; }
  /* Required-file validation (2026-09-04, per Martin: "make sure that the
     user uploads at min 1 file in the upload tab") -- Submit is blocked
     on the Upload tab until a file is chosen; this note + the picker's
     red border only appear after that first failed attempt, not before
     the user has had a chance to pick a file. Same red as
     .profile-menu-item.signout elsewhere in the app. */
  .upload-picker.error .upload-picker-btn { border-color: #b6432f; }
  .upload-required-note { font-size: 0.74rem; font-weight: 700; color: #b6432f; margin: 6px 0 0; }
  .upload-required-note[hidden] { display: none; }
  /* List of files picked so far on the Upload tab (2026-09-04, per
     Martin: "let people upload multiple files") -- the native file input
     is `multiple` and re-opening the OS picker only ADDS to this list
     rather than replacing it (each dialog's selection is appended to
     `pickedFiles` in bindUploadTab, since the browser itself resets
     input.files to just the newest selection every time). Reuses
     .material-row's badge look (same file-type colors as everywhere else
     in this app) plus a remove button per row. */
  .upload-picked-list { margin-top: 4px; max-height: 168px; overflow-y: auto; }
  .upload-picked-list:empty { margin-top: 0; }
  .upload-picked-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .upload-picked-row:last-child { border-bottom: none; }
  .upload-picked-name { flex: 1; min-width: 0; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Create tab's rich-text toolbar (2026-08-30, per Martin's request — "the
     create section is just one textbox that has formatting options like
     google docs"). A lightweight execCommand-based editor: a block-style
     picker (Normal text / Heading 1-3) plus Bold/Italic/Underline/list/link
     buttons sit above a contenteditable answer area, replacing the old
     plain <textarea>. Front-end only, same as everywhere else in this
     mockup — nothing is actually saved as rich text on submit. */
  .rte-toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
    padding: 5px 6px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: var(--window-radius-sm) var(--window-radius-sm) 0 0;
    background: var(--panel-inner);
  }
  .rte-select {
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-dark);
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    cursor: pointer;
  }
  .rte-select:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .rte-divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
  .rte-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dark);
    font-family: inherit;
    font-size: 0.78rem;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .rte-btn b, .rte-btn i, .rte-btn u { pointer-events: none; }
  .rte-btn:hover { background: var(--border); }
  .rte-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-ring); }
  .rte-btn.active { background: var(--accent); color: #fff; }
  .rte-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .rte-btn svg text { fill: currentColor; stroke: none; font-weight: 700; pointer-events: none; }
  .rte-editor {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
    min-height: 110px;
    overflow-y: auto;
  }
  .rte-editor:empty::before { content: attr(data-placeholder); color: var(--text-faint); }
  .rte-editor h1 { font-size: 1.15rem; margin: 4px 0; }
  .rte-editor h2 { font-size: 1.02rem; margin: 4px 0; }
  .rte-editor h3 { font-size: 0.92rem; margin: 4px 0; }
  .rte-editor ul, .rte-editor ol { margin: 4px 0 4px 18px; padding: 0; }
  .rte-editor a { color: var(--accent); }
  .submission-comment {
    font-size: 0.76rem;
    color: var(--text-muted);
    font-style: italic;
    margin: 2px 0 0 34px;
  }
  /* Submission-history rows are clickable (2026-08-31, per Martin's
     request) — a row is a specific turn-in, so clicking it opens a
     small preview + that turn-in's own teacher comments, rather than
     showing feedback as one static block for the whole assignment. */
  .submission-row { cursor: pointer; border-radius: var(--window-radius-sm); border-bottom: none; padding: 10px 8px; }
  .submission-row:hover { background: var(--panel-inner); }
  .submission-row:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px var(--accent-ring);
  }
  .submission-comment-icon {
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    color: var(--text-faint);
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* The student's own comment on a submission, shown inside the preview
     popup — same italic quote treatment as .submission-comment used to
     have inline, just without the row-indent margin since it now sits
     inside a modal instead of under a list row. */
  .own-comment-box {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.5;
    margin: 12px 0 0;
  }
  .own-comment-box .label {
    display: block;
    font-size: 0.66rem;
    font-weight: 800;
    font-style: normal;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-faint);
    margin-bottom: 4px;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal-btn {
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-family: inherit;
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .modal-btn.secondary { background: var(--panel-inner); color: var(--text-dark); }
  .modal-btn.secondary:hover { background: var(--border); }
  .modal-btn.primary { background: var(--accent); color: #fff; }
  .modal-btn.primary:hover { background: var(--accent-dark); }

  /* ---------- Add Submission button + submission history — an
     assignment can be submitted more than once (2026-08-29, per
     Martin's request), so Submissions now shows a small history list
     (newest first) instead of a single fixed file, with this button
     always available to add another attempt regardless of status. ---------- */
  .add-submission-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 14px 8px 12px;
    font-weight: 800;
    font-size: 0.76rem;
    font-family: inherit;
    cursor: pointer;
    margin-top: 4px;
  }
  .add-submission-btn:hover { background: var(--accent-dark); }
  .add-submission-btn svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .submission-latest-tag {
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin-left: 8px;
  }

  /* ---------- Submissions panel ---------- */
  .submission-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: var(--window-radius-md);
    margin-bottom: 16px;
  }
  .submission-banner .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .submission-banner-text { min-width: 0; }
  .submission-banner-label { font-weight: 800; font-size: 0.86rem; margin: 0; }
  .submission-banner-meta { font-weight: 600; font-size: 0.74rem; margin: 2px 0 0; opacity: 0.85; }
  .submission-banner.overdue { background: rgba(182, 67, 47, 0.14); }
  .submission-banner.overdue .dot { background: var(--grade-bad); }
  .submission-banner.overdue .submission-banner-label { color: var(--grade-bad); }
  .submission-banner.upcoming { background: var(--panel-inner); }
  .submission-banner.upcoming .dot { background: var(--text-faint); }
  .submission-banner.upcoming .submission-banner-label { color: var(--text-muted); }
  .submission-banner.submitted { background: rgba(166, 122, 34, 0.14); }
  .submission-banner.submitted .dot {
    background: var(--grade-mid);
    /* Submitted = grade pending. Fade in/out to read as "waiting", distinct from the
       static dots on every other status. */
    animation: pending-fade 1.8s ease-in-out infinite;
  }
  .submission-banner.submitted .submission-banner-label { color: var(--grade-mid); }

  @keyframes pending-fade {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  @media (prefers-reduced-motion: reduce) {
    .submission-banner.submitted .dot { animation: none; }
  }
  .submission-banner.graded { background: rgba(47, 125, 84, 0.14); }
  .submission-banner.graded .dot { background: var(--grade-good); }
  .submission-banner.graded .submission-banner-label { color: var(--grade-good); }
  .submission-banner.returned { background: rgba(106, 79, 174, 0.14); }
  .submission-banner.returned .dot { background: var(--returned); }
  .submission-banner.returned .submission-banner-label { color: var(--returned); }

  .submit-dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--window-radius-md);
    padding: 26px 18px;
    text-align: center;
    color: var(--text-faint);
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.5;
  }
  .submit-dropzone svg { width: 24px; height: 24px; stroke: var(--text-faint); fill: none; stroke-width: 1.8; margin-bottom: 6px; }
  /* Solid panel background instead of the dashed upload border — this
     notice isn't a drop target, it's a redirect, so it shouldn't read as
     one (2026-09-03, quiz redirect notice). Accent-colored icon for the
     same reason: it's pointing somewhere, not waiting for a file.
     `> svg` (direct child only) so this doesn't also recolor/resize the
     smaller icon inside the Open in Schoology button below. */
  .quiz-redirect-notice { border: none; background: var(--panel-inner); }
  .quiz-redirect-notice > svg { stroke: var(--accent); }
  /* Real clickable redirect (2026-09-03, per Martin: "keep them in but
     ... can you put a redirect to schoology") — a working external link,
     not another disabled/"not available in this preview" placeholder,
     since Schoology itself is a real site this can actually open.
     Same pill shape/weight as .add-submission-btn so it reads as the
     one other real action-button on this panel. */
  .quiz-redirect-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: 0.76rem;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    margin-top: 12px;
  }
  .quiz-redirect-btn:hover { background: var(--accent-dark); }
  .quiz-redirect-btn svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.4; margin-bottom: 0; }

  .feedback-box {
    background: var(--panel-inner);
    border-radius: var(--window-radius-md);
    padding: 12px 14px;
    margin-top: 16px;
  }
  .feedback-box p { margin: 0; font-size: 0.84rem; font-style: italic; color: var(--text-dark); line-height: 1.5; }
  .feedback-box .attrib { display: block; margin-top: 8px; font-size: 0.72rem; font-weight: 800; font-style: normal; color: var(--text-faint); }
  /* A comment on a Returned assignment reuses the same quote-box shape
     as graded Teacher Feedback, but with a violet accent border and a
     small label so it never reads as an actual final-grade comment. */
  .feedback-box.returned { border-left: 4px solid var(--returned); }
  .feedback-box-label {
    display: block;
    font-size: 0.66rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--returned);
    margin-bottom: 6px;
  }

  /* ---------- Bottom nav — verbatim from every other page ---------- */
  .app-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    display: flex;
    justify-content: center;
    padding: 0 20px;
    z-index: 10;
    pointer-events: none;
  }
  .app-nav-inner {
    display: flex;

    width: 100%;
    max-width: 940px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--panel-bg);
    border-radius: var(--window-radius-md);
    box-shadow: 0 20px 45px -16px rgba(0,0,0,0.5);
    padding: 0 8px;
    pointer-events: auto;
  }
  .app-nav-inner::-webkit-scrollbar { display: none; }
  .nav-link {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    flex: 1;
    min-width: 0;
    padding: 12px 6px 10px;
    display: flex;
    flex-direction: column;

  .nav-link .label { display: block; max-width: 100%; font-size: 0.72rem; font-weight: 800; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .nav-link:hover .label { color: var(--text-muted); }
  .nav-link .dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }

  @media (max-width: 520px) {
    .nav-link { min-width: 0; padding: 10px 3px 8px; }
    .nav-link .label { font-size: 0.58rem; }
  }
</style>
</head>
<body>
  <div class="page">
    <button class="back-link" type="button" id="backBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>

        <h1 class="title" id="assignTitle">Assignment Name</h1>

          <button class="profile-menu-item" type="button" role="menuitem" data-action="settings">Settings</button>

    <div class="assign-detail-grid">

          <p class="assign-desc-text" id="descText"></p>

      <div class="card">
        <div class="card-inner">
          <h2>Submissions</h2>

          <div id="submissionBody"></div>
        </div>
      </div>
    </div>
  </div>

  <nav class="app-nav" aria-label="Main navigation">
    <div class="app-nav-inner" id="dock">
      <button class="nav-link" type="button" data-page="home" data-href="home.html">
        <span class="label">Home</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="courses" data-href="courses.html">
        <span class="label">Courses</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="grades" data-href="grades.html">
        <span class="label">Grades</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link active" type="button" data-page="assignments" data-href="assignments.html">
        <span class="label">Assignments</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="calendar" data-href="calendar.html">
        <span class="label">Calendar</span>

      </button>

        <span class="label">Messages</span>

        <span class="label">Contacts</span>
        <span class="dot"></span>
      </button>
      <button class="nav-link" type="button" data-page="settings" data-href="settings.html">
        <span class="label">Settings</span>
        <span class="dot"></span>
      </button>
    </div>
  </nav>

  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // Sample data — same six courses/colors/teachers as courses.html,
    // and the same OVERDUE/UPCOMING/HISTORY/SUBMITTED values
    // assignments.html uses, so a given assignment's title/type/date/
    // score/status match no matter which page it's viewed from.
    // ------------------------------------------------------------------
    const COURSES = [
      { id: 'apchem', name: 'AP Chemistry', color: '#a67a22', teacher: 'Mr. Alvarez' },
      { id: 'algebra2', name: 'Algebra II', color: '#5b6ea3', teacher: 'Ms. Whitfield' },
      { id: 'english10', name: 'English 10', color: '#6b8f5e', teacher: 'Ms. Cho' },
      { id: 'ushistory', name: 'U.S. History', color: '#a15c4f', teacher: 'Mr. Bennett' },
      { id: 'spanish3', name: 'Spanish III', color: '#8a6ba1', teacher: 'Ms. Ortiz' },
      { id: 'pe', name: 'PE', color: '#4f8c8a', teacher: 'Coach Reyes' },
    ];
    function findCourse(id) { return COURSES.find(c => c.id === id); }

    const TYPE_LABEL = { assignment: 'Assignment', discussion: 'Discussion', assessment: 'Quiz' };

    const HISTORY = {
      apchem: { points: [72, 79, 84, 88, 90], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'], titles: [['Intro Lab Safety Quiz', 'assessment'], ['Stoichiometry Problem Set', 'assignment'], ['Molarity Discussion', 'discussion'], ['Gas Laws Test', 'assessment'], ['Lab Report #3', 'assignment']] },
      algebra2: { points: [94, 96, 93, 97, 95], dates: ['Aug 3', 'Aug 7', 'Aug 11', 'Aug 17', 'Aug 23'], titles: [['Warm-Up Quiz 1', 'assessment'], ['Systems of Equations HW', 'assignment'], ['Factoring Discussion', 'discussion'], ['Unit 1 Test', 'assessment'], ['Practice Set 6', 'assignment']] },
      english10: { points: [88, 82, 79, 76, 73], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'], titles: [['Reading Journal 1', 'assignment'], ['Vocabulary Quiz', 'assessment'], ['Chapter 3 Discussion', 'discussion'], ['Essay Draft', 'assignment'], ['Grammar Check', 'assessment']] },
      ushistory: { points: [89, 93, 88, 92, 90], dates: ['Aug 4', 'Aug 8', 'Aug 12', 'Aug 18', 'Aug 24'], titles: [['Colonial Era Notes', 'assignment'], ['Primary Source Quiz', 'assessment'], ['Revolution Discussion', 'discussion'], ['Timeline Project', 'assignment'], ['Unit 1 Exam', 'assessment']] },
      spanish3: { points: [76, 80, 83, 85, 87], dates: ['Aug 3', 'Aug 7', 'Aug 11', 'Aug 17', 'Aug 23'], titles: [['Vocabulario Quiz', 'assessment'], ['Conjugación Practice', 'assignment'], ['Conversación Discussion', 'discussion'], ['Listening Check', 'assessment'], ['Composición 1', 'assignment']] },
      pe: { points: [96, 98, 95, 97, 96], dates: ['Aug 2', 'Aug 6', 'Aug 10', 'Aug 16', 'Aug 22'], titles: [['Fitness Log 1', 'assignment'], ['Rules Quiz', 'assessment'], ['Team Strategy Discussion', 'discussion'], ['Skills Check', 'assessment'], ['Fitness Log 2', 'assignment']] },
    };

    const OVERDUE = [
      { type: 'assignment', title: 'Lab Report #4', courseId: 'apchem', due: 'Fri Aug 21' },
      { type: 'discussion', title: 'Chapter 6 Discussion', courseId: 'english10', due: 'Thu Aug 20' },
      { type: 'discussion', title: 'Reading Response', courseId: 'ushistory', due: 'Wed Aug 19' },
    ];
    const UPCOMING = [
      { type: 'assessment', title: 'Unit 2 Quiz', courseId: 'algebra2', due: 'Mon Aug 24' },
      { type: 'assignment', title: 'Vocab Worksheet', courseId: 'spanish3', due: 'Tue Aug 25' },
      { type: 'assignment', title: 'Problem Set 7', courseId: 'algebra2', due: 'Wed Aug 26' },
      { type: 'assignment', title: 'Titration Lab Prep', courseId: 'apchem', due: 'Mon Aug 24' },
    ];
    // Recently Submitted — work that's been turned in but hasn't been
    // graded yet, sitting between Upcoming and Graded in the overall
    // assignment lifecycle. New as of 2026-08-29, per Martin's request.
    const SUBMITTED = [
      { type: 'assignment', title: 'Molarity Practice Set', courseId: 'apchem', submittedOn: 'Sat Aug 22' },
      { type: 'assessment', title: 'Quiz Corrections', courseId: 'algebra2', submittedOn: 'Sun Aug 23' },
      { type: 'assignment', title: 'Composición 2', courseId: 'spanish3', submittedOn: 'Fri Aug 21' },
    ];
    // Returned — the teacher has looked at the submission and sent it
    // back with a comment, usually asking for a revision, without
    // necessarily attaching a final score. A separate lifecycle stage
    // from Graded (which already has its own Teacher Feedback + score),
    // added per Martin's request to see what a "comment or return" on
    // an assignment looks like.
    const RETURNED = [
      { type: 'assignment', title: 'Periodic Trends Worksheet', courseId: 'apchem', returnedOn: 'Sun Aug 23' },
    ];

    // ------------------------------------------------------------------
    // Hand-authored detail content — description, attached materials,
    // submitted file(s), and teacher feedback — for one representative
    // assignment per status (Missing/Upcoming/Submitted/Graded), keyed
    // by "{courseId}|{title}". There are ~40 assignments across the
    // app's sample data and hand-writing rich detail for all of them
    // isn't realistic for a mock — anything not listed here falls back
    // to generic placeholder content in buildDetail() below, same as a
    // real assignment a teacher hasn't filled in yet would show.
    // ------------------------------------------------------------------
    // Real Schoology grading periods are named things like "HS-Fall:
    // 2026-08-17 - 2026-12-18", not the bare word "Gradebook" (2026-08-29,
    // per Martin's correction) — this is what the breadcrumb next to
    // Class Name shows. Now a real link (2026-08-31, once gradebook.html
    // existed to link to) — see the click wiring below, which points at
    // this assignment's own course, resolving the note that used to sit
    // here about the breadcrumb needing a real, course + grading-period-
    // scoped destination rather than a generic one.
    const GRADING_PERIOD = 'HS-Fall: 2026-08-17 - 2026-12-18';

    // Submissions are now a history, not a single fixed file — a real
    // assignment can be turned in more than once, and the teacher sees
    // the most recent attempt (2026-08-29, per Martin's request). Each
    // DETAILS entry's `submissions` array is oldest-first; the Submitted
    // example below has two entries specifically to demonstrate a
    // resubmission.
    const DETAILS = {
      'apchem|Lab Report #4': {
        description: "Write up your findings from this week's titration lab. Include your data table, calculated molarity for each trial, and a short error-analysis paragraph.",
        materials: [{ name: 'Lab Report Template.docx', ext: 'docx' }, { name: 'Titration Data Sheet.pdf', ext: 'pdf' }],
      },
      'algebra2|Unit 2 Quiz': {
        description: 'Covers solving and graphing systems of equations (Sections 4.1–4.4). Calculator allowed; show your work for full credit.',
        materials: [{ name: 'Unit 2 Study Guide.pdf', ext: 'pdf' }],
      },
      'apchem|Molarity Practice Set': {
        description: "Ten practice problems on molarity and dilution calculations — extra practice before Friday's quiz. Show all work for each problem.",
        materials: [{ name: 'Molarity Practice Set.pdf', ext: 'pdf' }],
        submissions: [
          { name: 'Molarity_Practice_Martin_v1.pdf', ext: 'pdf', timestamp: 'Fri, Aug 21 at 6:10 PM' },
          { name: 'Molarity_Practice_Martin.pdf', ext: 'pdf', timestamp: 'Sat, Aug 22 at 11:42 PM' },
        ],
      },
      'apchem|Gas Laws Test': {
        description: "Unit test covering Boyle's Law, Charles's Law, and the Ideal Gas Law. 25 multiple choice questions plus 2 free-response problems.",
        materials: [{ name: 'Gas Laws Formula Sheet.pdf', ext: 'pdf' }],
        submissions: [{ name: 'GasLawsTest_Martin.pdf', ext: 'pdf', timestamp: 'Mon, Aug 18 at 9:58 AM' }],
        feedback: "Solid work overall — your free-response reasoning on Boyle's Law was especially clear. Watch your significant figures on Q14 and Q19 next time.",
      },
      // Uses a new `comment` field (distinct from `feedback`, which is
      // only ever shown once an assignment is actually Graded) so a
      // Returned item's note reads as "not your final grade yet".
      'apchem|Periodic Trends Worksheet': {
        description: 'Label and explain the periodic trends (atomic radius, ionization energy, electronegativity) across a period and down a group, using the blank periodic table provided.',
        materials: [{ name: 'Periodic Trends Packet.pdf', ext: 'pdf' }],
        submissions: [{ name: 'PeriodicTrends_Martin.pdf', ext: 'pdf', timestamp: 'Fri, Aug 21 at 4:32 PM' }],
        comment: "You're on the right track, but your explanation of the ionization-energy trend needs another pass — re-read the section on shielding effect and resubmit by Wednesday.",
      },
    };
    function buildDetail(item) {
      const key = `${item.courseId}|${item.title}`;
      const found = DETAILS[key];
      if (found) return found;
      const generic = { description: 'No description provided by your teacher yet.', materials: [] };
      if (item.status === 'submitted' || item.status === 'graded' || item.status === 'returned') {
        generic.submissions = [{ name: `${item.title}.pdf`, ext: 'pdf', timestamp: item.status === 'graded' ? item.due : (item.submittedOn || item.returnedOn) }];
        if (item.status === 'graded') generic.feedback = 'No additional feedback yet.';
        if (item.status === 'returned') generic.comment = 'No comment yet.';
      }
      return generic;
    }

    const EXT_COLOR = { pdf: '#c1443a', docx: '#3b6fd1', pptx: '#d1852f' };

    const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M12 15l-4-4M12 15l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
    const PLUS_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
    // Remove button on a picked-file row in the Add Submission modal's
    // Upload tab (2026-09-04, per Martin's multi-file request).
    const REMOVE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    // Small speech-bubble flag shown on a submission-history row when it
    // has a student-entered comment attached (2026-08-31) — a hint that
    // there's more to see before the row is actually clicked open.
    const COMMENT_ICON = '<svg class="submission-comment-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-8.9 8.4A8.5 8.5 0 1 1 21 11.5z"/></svg>';
    // Used on the quiz redirect notice (2026-09-03) — an "external link"
    // glyph, distinct from the upload-arrow icon the dropzone normally
    // shows, so it reads as "this happens somewhere else" rather than
    // "drag a file here."
    const EXTERNAL_LINK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';

    const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    function fmtAug(day) { return `${DOW[new Date(2026, 7, day).getDay()]} Aug ${day}`; }
    function dayNum(dateStr) { const parts = dateStr.trim().split(/\s+/); return parseInt(parts[parts.length - 1], 10); }

    // Build one normalized master list across every status, exactly as
    // assignments.html does, so this page can look any assignment up by
    // course + title regardless of which list it came from.
    const ALL_ITEMS = [];
    OVERDUE.forEach(o => ALL_ITEMS.push({ status: 'overdue', type: o.type, title: o.title, courseId: o.courseId, due: o.due }));
    UPCOMING.forEach(u => ALL_ITEMS.push({ status: 'upcoming', type: u.type, title: u.title, courseId: u.courseId, due: u.due }));
    SUBMITTED.forEach(s => ALL_ITEMS.push({ status: 'submitted', type: s.type, title: s.title, courseId: s.courseId, submittedOn: s.submittedOn }));
    RETURNED.forEach(r => ALL_ITEMS.push({ status: 'returned', type: r.type, title: r.title, courseId: r.courseId, returnedOn: r.returnedOn }));
    COURSES.forEach(course => {
      const hist = HISTORY[course.id];
      hist.dates.forEach((d, i) => {
        ALL_ITEMS.push({ status: 'graded', type: hist.titles[i][1], title: hist.titles[i][0], courseId: course.id, due: fmtAug(dayNum(d)), score: hist.points[i] });
      });
    });

    function findAssignment(courseId, title) {
      return ALL_ITEMS.find(i => i.courseId === courseId && i.title === title);
    }

    // Default landing item (no query string) — the new Submitted status
    // is the freshest feature on this page, so it doubles as a natural
    // example to land on.
    const params = new URLSearchParams(location.search);
    const qCourse = params.get('course');
    const qTitle = params.get('title');
    const qFrom = params.get('from');
    let item = null;
    if (qCourse && qTitle) {
      item = findAssignment(qCourse, decodeURIComponent(qTitle));
      if (!item) {
        // A real title/course was passed (e.g. an assignment-flagged file
        // opened from course-materials.html — see openAssignmentDetail()
        // there) but it has no matching entry in this page's own shared
        // OVERDUE/UPCOMING/SUBMITTED/HISTORY lists. Show its real title
        // with generic fallback content rather than silently swapping in
        // an unrelated default assignment.
        item = { status: 'upcoming', type: 'assignment', title: decodeURIComponent(qTitle), courseId: qCourse, due: null };
      }
    } else {
      item = findAssignment('apchem', 'Molarity Practice Set');
    }
    const course = findCourse(item.courseId) || COURSES[0];
    const detail = buildDetail(item);

    document.title = `Schoolagy — ${item.title}`;
    document.getElementById('assignTitle').textContent = item.title;
    document.getElementById('classLink').textContent = course.name;
    document.getElementById('classLink').addEventListener('click', () => {
      window.location.href = `course-home.html?course=${course.id}`;
    });
    // Links to gradebook.html scoped to this assignment's own course —
    // resolves the note that used to sit here about the breadcrumb
    // needing to point at the specific course + grading-period gradebook
    // it's actually referring to, rather than a shared/ambiguous one
    // (2026-08-31, once gradebook.html existed to link to).
    document.getElementById('gradebookLink').textContent = GRADING_PERIOD;
    document.getElementById('gradebookLink').addEventListener('click', () => {
      window.location.href = `gradebook.html?course=${course.id}`;
    });

    // Back breadcrumb — "Back to Assignments" by default, but swapped for
    // "Back to Course Materials" when this page was reached from the
    // Materials Finder (2026-08-29, per Martin's request), since that's
    // genuinely where the user came from and assignments.html would be a
    // dead end back to a page they didn't start on.
    const cameFromMaterials = qFrom === 'materials';
    document.getElementById('backLabel').textContent = cameFromMaterials ? 'Back to Course Materials' : 'Back to Assignments';
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = cameFromMaterials ? `course-materials.html?course=${course.id}` : 'assignments.html';
    });

    document.getElementById('descText').textContent = detail.description;

    // `actions` adds the Download icon button — used for Attached
    // Materials rows only, not the Submissions history list, per how
    // Martin originally scoped this (2026-08-29). **View button removed
    // (2026-09-03)**: per Martin's material-types scoping decision — real
    // file preview/editing is coming with the Canva/Drive integrations
    // already on the roadmap for Release 1.0.0 ("Preview in Drive"/"Edit
    // in Canva" — see `claude/updates-roadmap.md`), so a "View" action
    // that only ever opened a "no live preview" placeholder modal doesn't
    // belong in the app before that's real. Download is the one file
    // action Schoolagy offers for now — see the click handler below,
    // which now triggers a real file download instead of another
    // placeholder modal.
    function materialRowHTML(m, actions) {
      const color = EXT_COLOR[m.ext] || '#83849a';
      const btns = actions ? `
          <div class="material-actions">
            <button class="material-icon-btn" type="button" data-file-action="download" data-file-name="${m.name.replace(/"/g, '&quot;')}" data-file-ext="${m.ext}" aria-label="Download ${m.name}">${DOWNLOAD_ICON}</button>
          </div>` : '';
      return `
        <div class="material-row">
          <span class="material-badge" style="background:${color}">${m.ext.toUpperCase()}</span>
          <span class="material-name">${m.name}</span>
          ${btns}
        </div>`;
    }
    // A submission-history entry carries its file(s) as either the older
    // singular `name`/`ext` fields (every hand-authored DETAILS/generic
    // entry) or, since 2026-09-04 (per Martin: "let people upload
    // multiple files"), a plural `files` array (every submission made
    // through the Add Submission modal — see modalSubmitBtn's click
    // handler further down). Normalizes either shape to an array so
    // submissionHistoryHTML/openSubmissionPreview only have to handle one
    // case, the same pattern messages.html's attachmentsOf() uses.
    function filesOf(s) {
      return Array.isArray(s.files) ? s.files : (s.name ? [{ name: s.name, ext: s.ext }] : []);
    }
    // Real client-side download (2026-09-03, per Martin: "for now we
    // should just have a download option") — there's no real backend
    // holding actual file bytes in this mock, so this generates a small
    // placeholder text blob and downloads it under the material's real
    // name/extension via a throwaway <a download> link, rather than
    // showing another "isn't available in this preview yet" dead end.
    // The download itself is genuinely real (a real browser Save/
    // Downloads-folder event fires); only the file's *content* is a
    // stand-in, same honesty convention as Quick Look's own "no preview
    // available in this mock" note elsewhere in the app.
    function downloadPlaceholderFile(name, ext) {
      const content = `${name}\n\nThis is a placeholder file from the Schoolagy mockup — no real file content is stored yet.\nReal file delivery is coming with the Drive/Canva integrations (Release 1.0.0).`;
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    const materialsEl = document.getElementById('materialsList');
    materialsEl.innerHTML = (detail.materials && detail.materials.length)
      ? detail.materials.map(m => materialRowHTML(m, true)).join('')
      : '<p class="assign-empty">No materials attached to this assignment.</p>';

    // ------------------------------------------------------------------
    // Shared small modal — Add Submission and the View/Download file
    // info both open into this one overlay.
    // ------------------------------------------------------------------
    const modalOverlay = document.getElementById('modalOverlay');
    const modalBox = document.getElementById('modalBox');
    function openModal(html) { modalBox.innerHTML = html; modalOverlay.hidden = false; }
    // Also strips the wider modal-box-lg modifier (see openAddSubmissionModal)
    // so the NEXT modal opened -- e.g. a small file-info popup -- isn't left
    // oversized from a previous Add Submission session.
    function closeModal() { modalOverlay.hidden = true; modalBox.innerHTML = ''; modalBox.classList.remove('modal-box-lg'); }
    // Static popup (2026-08-29, per Martin's request) — clicking the dark
    // backdrop no longer dismisses the modal, so an accidental click outside
    // the box (easy to do on the Add Submission modal while picking a tab or
    // a file) can't lose in-progress input. Escape and the explicit
    // Cancel/Close buttons still close it.
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

    materialsEl.addEventListener('click', e => {
      const btn = e.target.closest('[data-file-action="download"]');
      if (!btn) return;
      downloadPlaceholderFile(btn.dataset.fileName, btn.dataset.fileExt);
    });
    // Same download delegation as the Attached Materials list above, but
    // scoped to the modal itself -- covers the Submission Preview
    // popup's per-file Download buttons (see openSubmissionPreview),
    // which can now list more than one file per turn-in.
    modalBox.addEventListener('click', e => {
      const btn = e.target.closest('[data-file-action="download"]');
      if (!btn) return;
      downloadPlaceholderFile(btn.dataset.fileName, btn.dataset.fileExt);
    });

    // ------------------------------------------------------------------
    // Submissions panel — banner + status-specific body. An assignment
    // can be submitted more than once (2026-08-29, per Martin's request),
    // so this is now re-rendered from mutable state every time a new
    // attempt is added, rather than drawn once from static data.
    // ------------------------------------------------------------------
    let submissionHistory = (detail.submissions || []).slice();
    let currentStatus = item.status;
    const previousScore = (item.status === 'graded' && typeof item.score === 'number') ? item.score : null;

    const BANNER_COPY = {
      overdue: () => ({ label: 'Missing — nothing submitted', meta: item.due ? `Was due ${item.due}` : '' }),
      upcoming: () => ({ label: 'Not submitted yet', meta: item.due ? `Due ${item.due}` : '' }),
      submitted: () => {
        const latest = submissionHistory[submissionHistory.length - 1];
        let meta = latest ? `Submitted ${latest.timestamp}` : '';
        if (previousScore !== null) meta += meta ? ` · previously graded ${previousScore}%` : `Previously graded ${previousScore}%`;
        return { label: 'Submitted — awaiting grade', meta };
      },
      graded: () => ({ label: 'Graded', meta: typeof item.score === 'number' ? `${item.score}%` : '' }),
      returned: () => ({ label: 'Returned — revision requested', meta: item.returnedOn ? `Returned ${item.returnedOn}` : '' }),
    };

    // Rows are clickable (2026-08-31, per Martin's request) — each one
    // is a specific turn-in, so clicking it pops up a preview plus that
    // turn-in's own teacher comments (see openSubmissionPreview below)
    // instead of the teacher feedback sitting as one static block under
    // the whole list. `data-sub-index` is the row's real index into
    // `submissionHistory` (oldest-first), not its on-screen position —
    // the array itself is only reordered for display, via the trailing
    // `.reverse()` on the rendered HTML strings, so the index each row
    // carries stays stable regardless of display order.
    function submissionHistoryHTML() {
      if (!submissionHistory.length) return '<p class="assign-empty">No submission on record.</p>';
      return submissionHistory.map((s, idx) => {
        const files = filesOf(s);
        const first = files[0] || { name: 'Untitled', ext: '' };
        const color = EXT_COLOR[first.ext] || '#83849a';
        const isLatest = idx === submissionHistory.length - 1;
        // Multiple files in one turn-in (2026-09-04, per Martin) show as
        // a count badge + "N files" rather than trying to cram every
        // filename onto one row -- the full list is one click away in
        // openSubmissionPreview.
        const badgeLabel = files.length > 1 ? String(files.length) : first.ext.toUpperCase();
        const nameLabel = files.length > 1 ? `${files.length} files` : first.name;
        return `
          <div class="material-row submission-row" tabindex="0" role="button" data-sub-index="${idx}" aria-label="Preview ${nameLabel}, submitted ${s.timestamp}">
            <span class="material-badge" style="background:${color}">${badgeLabel}</span>
            <span class="material-name">${nameLabel} <span style="color:var(--text-faint); font-weight:600;">— ${s.timestamp}</span></span>
            ${isLatest && submissionHistory.length > 1 ? '<span class="submission-latest-tag">Latest</span>' : ''}
            ${s.comment ? COMMENT_ICON : ''}
          </div>`;
      }).reverse().join('');
    }

    // Preview + teacher comments popup for one submission-history row
    // (2026-08-31, per Martin's request — submissions weren't clickable
    // at all before). Reuses the same shared openModal()/closeModal()
    // component the Attached Materials View/Download buttons and Add
    // Submission already use, so it looks and behaves like every other
    // popup in this app. Only the LATEST submission can carry the
    // assignment's current teacher feedback/comment — an older,
    // superseded attempt shows a plain "no feedback on this one" note,
    // since real feedback is given on the most recent turn-in, not every
    // one in the history.
    function openSubmissionPreview(idx) {
      const s = submissionHistory[idx];
      if (!s) return;
      const files = filesOf(s);
      const isLatest = idx === submissionHistory.length - 1;
      let feedbackHtml = '';
      if (isLatest && currentStatus === 'graded' && detail.feedback) {
        feedbackHtml = `
          <div class="feedback-box">
            <span class="feedback-box-label" style="color:var(--grade-good);">Teacher Feedback</span>
            <p>"${detail.feedback}"</p>
            <span class="attrib">— ${course.teacher}</span>
          </div>`;
      } else if (isLatest && currentStatus === 'returned' && detail.comment) {
        feedbackHtml = `
          <div class="feedback-box returned">
            <span class="feedback-box-label">Teacher Comment · Revision requested</span>
            <p>"${detail.comment}"</p>
            <span class="attrib">— ${course.teacher}</span>
          </div>`;
      } else {
        feedbackHtml = `<p class="assign-empty" style="margin-top:14px;">No teacher feedback on this submission yet.</p>`;
      }
      const ownCommentHtml = s.comment ? `
        <div class="own-comment-box">
          <span class="label">Your comment</span>
          "${s.comment}"
        </div>` : '';
      // Title/subhead read naturally whether this turn-in was one file or
      // several (2026-09-04, per Martin's multi-file request). Each file
      // gets its own row + Download button (materialRowHTML(f, true),
      // same component Attached Materials uses) instead of the single
      // "Download" action this modal used to have — the delegated
      // [data-file-action="download"] listener on modalBox (see where
      // modalBox is declared) handles all of them, one file or many.
      const titleLabel = files.length > 1 ? `${files.length} files` : (files[0] ? files[0].name : 'Submission');
      openModal(`
        <h3>${titleLabel}</h3>
        <p>Submitted ${s.timestamp}<br>No live preview is available in this mock.</p>
        <div class="modal-file-list">${files.map(f => materialRowHTML(f, true)).join('')}</div>
        ${ownCommentHtml}
        ${feedbackHtml}
        <div class="modal-actions">
          <button class="modal-btn primary" type="button" id="modalCloseBtn">Close</button>
        </div>`);
      document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    }

    const submissionBodyEl = document.getElementById('submissionBody');
    submissionBodyEl.addEventListener('click', e => {
      const row = e.target.closest('[data-sub-index]');
      if (!row) return;
      openSubmissionPreview(Number(row.dataset.subIndex));
    });
    submissionBodyEl.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('[data-sub-index]');
      if (!row) return;
      e.preventDefault();
      openSubmissionPreview(Number(row.dataset.subIndex));
    });

    function renderSubmissionsPanel() {
      const banner = BANNER_COPY[currentStatus]();
      document.getElementById('submissionBanner').innerHTML = `
        <div class="submission-banner ${currentStatus}">
          <span class="dot"></span>
          <div class="submission-banner-text">
            <p class="submission-banner-label">${banner.label}</p>
            ${banner.meta ? `<p class="submission-banner-meta">${banner.meta}</p>` : ''}
          </div>
        </div>`;

      const bodyEl = document.getElementById('submissionBody');
      let html = '';
      // Quizzes/tests are actually taken in Schoology itself, not in
      // Schoolagy — there's no real "upload a file" or "type an answer"
      // step for them here, unlike a normal assignment or discussion post
      // (2026-09-03, per Martin: "for quizes i don't think they can take
      // it in our app, they have to use schoology"). So instead of the
      // upload dropzone / submission history / Add Submission button
      // below, a quiz-type item gets one static redirect notice no matter
      // its status — the status banner above still reflects the real
      // Missing/Submitted/Graded/Returned state, since Schoolagy does
      // still mirror that from Schoology once it happens.
      if (item.type === 'assessment') {
        html += `
          <div class="submit-dropzone quiz-redirect-notice">
            ${EXTERNAL_LINK_ICON}
            <div>Quizzes and tests are taken in Schoology, not in Schoolagy. Head to Schoology to complete this one — your grade will show up here once it's in.</div>
            <a class="quiz-redirect-btn" href="https://www.schoology.com/" target="_blank" rel="noopener noreferrer">
              Open in Schoology
              ${EXTERNAL_LINK_ICON}
            </a>
          </div>`;
        // Feedback/a comment is still real Schoology grading data, not a
        // "submission" — Schoolagy already mirrors the score in the banner
        // above, so it shows this the same way rather than hiding it just
        // because the file-submission UI above it went away.
        if (currentStatus === 'graded' && detail.feedback) {
          html += `
            <div class="feedback-box">
              <span class="feedback-box-label" style="color:var(--grade-good);">Teacher Feedback</span>
              <p>"${detail.feedback}"</p>
              <span class="attrib">— ${course.teacher}</span>
            </div>`;
        } else if (currentStatus === 'returned' && detail.comment) {
          html += `
            <div class="feedback-box returned">
              <span class="feedback-box-label">Teacher Comment · Revision requested</span>
              <p>"${detail.comment}"</p>
              <span class="attrib">— ${course.teacher}</span>
            </div>`;
        }
        bodyEl.innerHTML = html;
        return;
      }
      if (currentStatus === 'overdue' || currentStatus === 'upcoming') {
        html += `
          <div class="submit-dropzone">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M12 4l-5 5M12 4l5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            <div>Submitting assignments isn't available in this preview yet.</div>
          </div>`;
      } else {
        // Teacher Feedback / Teacher Comment used to render here as one
        // static block for the whole assignment — moved into each
        // submission row's own click-to-preview popup instead
        // (2026-08-31, per Martin's request to make submissions
        // clickable), since feedback is really about one specific
        // turn-in, not the assignment in the abstract. See
        // openSubmissionPreview() above.
        html += `<h2 style="margin-top:0;">Submission History</h2>${submissionHistoryHTML()}`;
      }
      // You can submit an assignment more than once — this button stays
      // available regardless of status (2026-08-29, per Martin's
      // request), including after it's already been graded, since a
      // resubmission is exactly how a real regrade request would start.
      html += `
        <button class="add-submission-btn" type="button" id="addSubmissionBtn">
          ${PLUS_ICON}
          Add Submission
        </button>`;
      bodyEl.innerHTML = html;
      document.getElementById('addSubmissionBtn').addEventListener('click', openAddSubmissionModal);
    }

    // Add Submission — Upload / Create, mirroring the real Schoology upload
    // dialog (screenshot Martin shared 2026-08-29): Upload loads a file from
    // this device, Create answers directly in the app with no file. Both are
    // real, switchable tabs sharing one optional comment box underneath.
    // (A third Resources tab, picking a file from Google Drive, was removed
    // 2026-09-02 per Martin's request — Google Drive integrations are coming
    // back in a later update, not this release.)
    const UPLOAD_TAB_PANEL = {
      // Custom-styled "Choose Files" button + a list of what's been picked
      // so far, in place of the bare native file input (2026-08-29, per
      // Martin's request — the browser-default control looked out of
      // place next to everything else in this modal). The real
      // <input type="file"> is still there, just visually hidden and
      // triggered by the button. `multiple` + the picked-files list below
      // (2026-09-04, per Martin: "let people upload multiple files") — see
      // bindUploadTab's pickedFiles handling for why the list is tracked
      // in JS rather than read straight off the input at submit time.
      upload: () => `
        <p class="upload-tab-desc">Upload one or more files from this device.</p>
        <div class="upload-picker" id="uploadPicker">
          <button class="upload-picker-btn" type="button" id="chooseFileBtn">Choose Files</button>
          <span class="upload-picker-filename empty" id="chooseFileName">No files chosen</span>
        </div>
        <div class="upload-picked-list" id="uploadPickedList"></div>
        <!-- Hidden until a Submit attempt with no file chosen (2026-09-04,
             per Martin -- at least one file is now required on this tab;
             see modalSubmitBtn's click handler). -->
        <p class="upload-required-note" id="uploadRequiredNote" hidden>Choose at least one file before submitting.</p>
        <input type="file" id="submissionFileInput" multiple style="display:none;">`,
      // Rich-text answer area (2026-08-30, per Martin's request — a plain
      // textbox with Google-Docs-style formatting options) in place of the
      // old bare <textarea>. See bindCreateTab() below for the toolbar
      // wiring (document.execCommand-based, front-end only).
      create: () => `
        <p class="upload-tab-desc">Answer directly — no file needed.</p>
        <div class="rte-toolbar" role="toolbar" aria-label="Text formatting">
          <select class="rte-select" id="rteBlockSelect" aria-label="Text style">
            <option value="p">Normal text</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
          </select>
          <span class="rte-divider" aria-hidden="true"></span>
          <button class="rte-btn" type="button" data-cmd="bold" aria-label="Bold" title="Bold"><b>B</b></button>
          <button class="rte-btn" type="button" data-cmd="italic" aria-label="Italic" title="Italic"><i>I</i></button>
          <button class="rte-btn" type="button" data-cmd="underline" aria-label="Underline" title="Underline"><u>U</u></button>
          <span class="rte-divider" aria-hidden="true"></span>
          <button class="rte-btn" type="button" data-cmd="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="4.01" y2="6"/><line x1="4" y1="12" x2="4.01" y2="12"/><line x1="4" y1="18" x2="4.01" y2="18"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>
          </button>
          <button class="rte-btn" type="button" data-cmd="insertOrderedList" aria-label="Numbered list" title="Numbered list">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><text x="1" y="8" font-size="7">1</text><text x="1" y="14" font-size="7">2</text><text x="1" y="20" font-size="7">3</text></svg>
          </button>
          <span class="rte-divider" aria-hidden="true"></span>
          <button class="rte-btn" type="button" data-cmd="createLink" aria-label="Insert link" title="Insert link">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 15l6-6"/><path d="M10 6l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M14 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>
          </button>
        </div>
        <div class="modal-textarea answer-textarea rte-editor" id="submissionAnswerText" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Answer" data-placeholder="Type your answer here…"></div>`,
    };

    function openAddSubmissionModal() {
      let activeTab = 'upload';
      // Every file picked on the Upload tab so far this modal session
      // (2026-09-04, per Martin's multi-file request) -- lives here, not
      // just on the <input>, because re-opening the OS file dialog
      // REPLACES input.files with just that dialog's selection rather
      // than adding to it; this array is what actually accumulates
      // across multiple picks (see bindUploadTab's `change` handler).
      // Also survives switching to the Create tab and back, since it's
      // closed over here rather than living in the (regenerated) DOM.
      let pickedFiles = [];

      openModal(`
        <h3>Add Submission</h3>
        <div class="upload-tabs" role="tablist">
          <button class="upload-tab active" type="button" role="tab" aria-selected="true" data-tab="upload">Upload</button>
          <button class="upload-tab" type="button" role="tab" aria-selected="false" data-tab="create">Create</button>
        </div>
        <div class="upload-tab-panel" id="uploadTabPanel">${UPLOAD_TAB_PANEL.upload()}</div>
        <label class="modal-field-label" for="submissionComment">Add a comment (optional)</label>
        <textarea class="modal-textarea" id="submissionComment" placeholder="Add a comment (optional)"></textarea>
        <div class="modal-actions">
          <button class="modal-btn secondary" type="button" id="modalCancelBtn">Cancel</button>
          <button class="modal-btn primary" type="button" id="modalSubmitBtn">Submit</button>
        </div>`);
      // Wider than the default .modal-box (2026-09-04, per Martin: "make
      // the assignment submission popup bigger") -- see the modal-box-lg
      // rule and closeModal(), which strips this back off so a later,
      // smaller popup (file info, submission preview) isn't left oversized.
      modalBox.classList.add('modal-box-lg');

      const panelEl = document.getElementById('uploadTabPanel');
      const commentEl = document.getElementById('submissionComment');

      function bindUploadTab() {
        if (activeTab !== 'upload') return;
        const chooseBtn = document.getElementById('chooseFileBtn');
        const fileInput = document.getElementById('submissionFileInput');
        const nameEl = document.getElementById('chooseFileName');
        const pickerEl = document.getElementById('uploadPicker');
        const noteEl = document.getElementById('uploadRequiredNote');
        const listEl = document.getElementById('uploadPickedList');

        function renderPickedList() {
          if (!pickedFiles.length) {
            listEl.innerHTML = '';
            nameEl.textContent = 'No files chosen';
            nameEl.classList.add('empty');
            return;
          }
          nameEl.textContent = pickedFiles.length === 1 ? pickedFiles[0].name : `${pickedFiles.length} files chosen`;
          nameEl.classList.remove('empty');
          listEl.innerHTML = pickedFiles.map((f, i) => {
            const ext = (f.name.split('.').pop() || '').toLowerCase();
            const color = EXT_COLOR[ext] || '#83849a';
            return `
              <div class="upload-picked-row">
                <span class="material-badge" style="background:${color}">${(ext || '?').toUpperCase()}</span>
                <span class="upload-picked-name">${f.name}</span>
                <button class="material-icon-btn" type="button" data-index="${i}" aria-label="Remove ${f.name.replace(/"/g, '&quot;')}">${REMOVE_ICON}</button>
              </div>`;
          }).join('');
        }
        renderPickedList(); // re-bound after a Create->Upload tab switch, with files already picked this session

        chooseBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
          const newFiles = Array.from(fileInput.files);
          fileInput.value = ''; // so picking the same file(s) again still fires "change"
          if (!newFiles.length) return;
          pickedFiles.push(...newFiles);
          renderPickedList();
          // Picking file(s) clears a validation error from a previous
          // failed Submit attempt (see modalSubmitBtn's click handler).
          pickerEl.classList.remove('error');
          noteEl.hidden = true;
        });
        // Delegated (not per-row) since the list is rebuilt on every add/remove.
        listEl.addEventListener('click', e => {
          const btn = e.target.closest('.material-icon-btn[data-index]');
          if (!btn) return;
          pickedFiles.splice(Number(btn.dataset.index), 1);
          renderPickedList();
        });
      }

      // Wires up the Create tab's rich-text toolbar (2026-08-30). Kept
      // deliberately simple — document.execCommand is deprecated but still
      // broadly supported, and this is a front-end mockup with no real
      // save-as-HTML step, so a heavier editor library isn't warranted.
      function bindCreateTab() {
        if (activeTab !== 'create') return;
        const editor = document.getElementById('submissionAnswerText');
        const blockSelect = document.getElementById('rteBlockSelect');
        const toolbar = editor.previousElementSibling;
        const cmdBtns = toolbar.querySelectorAll('.rte-btn[data-cmd]');
        function updateToolbarState() {
          cmdBtns.forEach(btn => {
            let active = false;
            try { active = document.queryCommandState(btn.dataset.cmd); } catch (e) {}
            btn.classList.toggle('active', active);
          });
          try {
            const block = (document.queryCommandValue('formatBlock') || '').toLowerCase();
            blockSelect.value = ['h1', 'h2', 'h3'].includes(block) ? block : 'p';
          } catch (e) {}
        }
        cmdBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            editor.focus();
            const cmd = btn.dataset.cmd;
            if (cmd === 'createLink') {
              const url = window.prompt('Link URL:', 'https://');
              if (url) document.execCommand('createLink', false, url);
            } else {
              document.execCommand(cmd, false, null);
            }
            updateToolbarState();
          });
        });
        blockSelect.addEventListener('change', () => {
          editor.focus();
          document.execCommand('formatBlock', false, blockSelect.value);
          updateToolbarState();
        });
        editor.addEventListener('keyup', updateToolbarState);
        editor.addEventListener('mouseup', updateToolbarState);
        editor.addEventListener('focus', updateToolbarState);
      }

      function bindActiveTab() {
        bindUploadTab();
        bindCreateTab();
      }
      bindActiveTab();

      modalBox.querySelectorAll('.upload-tab').forEach(tabBtn => {
        tabBtn.addEventListener('click', () => {
          activeTab = tabBtn.dataset.tab;
          modalBox.querySelectorAll('.upload-tab').forEach(b => {
            const isActive = b === tabBtn;
            b.classList.toggle('active', isActive);
            b.setAttribute('aria-selected', String(isActive));
          });
          panelEl.innerHTML = UPLOAD_TAB_PANEL[activeTab]();
          bindActiveTab();
        });
      });

      document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
      document.getElementById('modalSubmitBtn').addEventListener('click', () => {
        let files;
        if (activeTab === 'upload') {
          // At least one file is required on this tab (2026-09-04, per
          // Martin) — no more falling back to a synthesized filename when
          // nothing was chosen. Blocks the submit and surfaces the error
          // inline instead of closing the modal.
          if (!pickedFiles.length) {
            document.getElementById('uploadPicker').classList.add('error');
            document.getElementById('uploadRequiredNote').hidden = false;
            document.getElementById('chooseFileBtn').focus();
            return;
          }
          // Every file picked this session (2026-09-04, per Martin: "let
          // people upload multiple files") goes into this one turn-in --
          // see filesOf()/submissionHistoryHTML()/openSubmissionPreview
          // for how a multi-file entry renders.
          files = pickedFiles.map(f => ({ name: f.name, ext: (f.name.split('.').pop() || 'pdf').toLowerCase() }));
        } else {
          // activeTab === 'create'. Typed content isn't required to submit
          // -- this tab has no file requirement (only the Upload tab does,
          // per Martin) -- the filename just always reflects that this
          // attempt was a typed answer, not an uploaded document.
          files = [{ name: `${item.title.replace(/\s+/g, '_')}_Answer.txt`, ext: 'txt' }];
        }
        const comment = (commentEl.value || '').trim();
        const entry = { files, timestamp: 'Just now' };
        if (comment) entry.comment = comment;
        submissionHistory.push(entry);
        currentStatus = 'submitted';
        closeModal();
        renderSubmissionsPanel();
      });
    }

    renderSubmissionsPanel();

    // Nav — Home/Courses/Assignments are real links between real pages;
    // the rest stay visual-only placeholders until those pages exist.
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        if (link.dataset.href) { window.location.href = link.dataset.href; return; }
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        link.classList.add('active');
      });
    });

    // ------------------------------------------------------------------
    // Profile menu — same behavior as every other page.
    // ------------------------------------------------------------------
    const profileBtn = document.getElementById('profileBtn');
    const profileMenu = document.getElementById('profileMenu');
    function openProfileMenu() { profileMenu.hidden = false; profileBtn.setAttribute('aria-expanded', 'true'); }
    function closeProfileMenu() { profileMenu.hidden = true; profileBtn.setAttribute('aria-expanded', 'false'); }
    profileBtn.addEventListener('click', () => { if (profileMenu.hidden) openProfileMenu(); else closeProfileMenu(); });
    document.addEventListener('click', e => { if (!profileMenu.hidden && !e.target.closest('.profile-menu-wrap')) closeProfileMenu(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !profileMenu.hidden) { closeProfileMenu(); profileBtn.focus(); } });
    profileMenu.querySelectorAll('.profile-menu-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'settings') { window.location.href = 'settings.html'; return; }
        closeProfileMenu();
      });
    });
  </script>
</body>
</html>
